<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f7ff;
    color:#172033;
    min-height:100vh;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(
        135deg,
        #0757c9,
        #0b7bea
    );

    color:white;
    padding:20px 16px;

.header-top{

}

.header h1{

}

}

.back-btn{

/* =====================================================
   SUMMARY
===================================================== */

}

}

/* =====================================================
   PAYMENT SUMMARY
===================================================== */

.payment-summary{

    grid-template-columns:repeat(2,1fr);

    margin-bottom:16px;
}

.payment-card{

.payment-count{

.deposit-name{

    word-break:break-word;
}

.deposit-phone{

}

.deposit-amount{
    font-size:18px;
    font-weight:bold;
    color:#0757c9;

}

.badge-row{

    gap:6px;

.badge{

    align-items:center;

}

.badge-payment2{

.deposit-date{

    margin-top:9px;

/* =====================================================

===================================================== */

.deposit-details{
    display:none;
    border-top:1px solid #e8eef7;

    background:#f9fbff;
}

.deposit-card.open .deposit-details{

}

.detail-grid{

}

.detail-item{

.detail-label{

    text-transform:uppercase;

.detail-value{

}

/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:35px 15px;

.spinner{

    border-top-color:#0757c9;

    border-radius:50%;

}

@keyframes spin{

/* =====================================================
   EMPTY
===================================================== */

.empty{

    padding:30px 15px;
    text-align:center;

}

.empty-icon{

/* =====================================================
   ERROR
===================================================== */

.error{
    background:#fff1f1;
    border:1px solid #ffcaca;
    color:#b42318;

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:650px){

    .summary-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   STATE
===================================================== */

let allDeposits = [];

let currentFilter = "ALL";

let searchText = "";


/* =====================================================
   MONEY
===================================================== */

function money(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "en-PH",
        {
            style:"currency",
            currency:"PHP",
            minimumFractionDigits:2
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampValue(value){

    if(!value){
        return 0;
    }


    if(
        typeof value === "object" &&
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }


    if(
        typeof value === "object" &&
        value.seconds
    ){

        return Number(value.seconds) * 1000;

    }


    const parsed =
        new Date(value).getTime();


    return Number.isNaN(parsed)
        ? 0
        : parsed;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    const time =
        getTimestampValue(value);


    if(!time){

        return "Date not available";

    }


    return new Date(time).toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   PAYMENT OPTION IDENTIFIER
=====================================================

   Payment 1 / Payment 2 is ONLY the identifier
   telling us which payment account the user selected.

===================================================== */

function getPaymentOption(deposit){

    if(!deposit){
        return null;
    }


    /*
       Explicit paymentChannel may contain:
       Payment 1
       Payment 2
    */

    const channel =
        String(
            deposit.paymentChannel ?? ""
        )
        .trim()
        .toLowerCase();


    if(
        channel === "payment 1" ||
        channel === "payment1"
    ){

        return "1";

    }


    if(
        channel === "payment 2" ||
        channel === "payment2"
    ){

        return "2";

    }


    /*
       Numeric identifier.
    */

    const numericFields = [

        deposit.paymentOption,

        deposit.paymentOptionNumber,

        deposit.paymentTypeNumber,

        deposit.selectedPaymentOption,

        deposit.paymentMethodNumber,

        deposit.paymentChannelNumber

    ];


    for(
        const value of numericFields
    ){

        if(
            value === 1 ||
            String(value).trim() === "1"
        ){

            return "1";

        }


        if(
            value === 2 ||
            String(value).trim() === "2"
        ){

            return "2";

        }

    }


    /*
       Boolean identifiers.
    */

    if(
        deposit.payment1 === true
    ){

        return "1";

    }


    if(
        deposit.payment2 === true
    ){

        return "2";

    }


    /*
       Other possible text identifiers.
    */

    const textFields = [

        deposit.payment,

        deposit.paymentType,

        deposit.paymentMethod,

        deposit.selectedPayment,

        deposit.selectedPaymentOption

    ];


    for(
        const value of textFields
    ){

        const text =
            String(value ?? "")
            .trim()
            .toLowerCase()
            .replace(/[_-]+/g," ")
            .replace(/\s+/g," ");


        if(
            text === "payment 1" ||
            text === "payment1" ||
            text === "payment option 1" ||
            text === "option 1"
        ){

            return "1";

        }


        if(
            text === "payment 2" ||
            text === "payment2" ||
            text === "payment option 2" ||
            text === "option 2"
        ){

            return "2";

        }

    }


    return null;

}


/* =====================================================
   PAYMENT BADGE
===================================================== */

function paymentBadgeHTML(deposit){

    const option =
        getPaymentOption(deposit);


    if(option === "1"){

        return `
            <span class="badge badge-payment1">
                💳 PAYMENT 1
            </span>
        `;

    }


    if(option === "2"){

        return `
            <span class="badge badge-payment2">
                💳 PAYMENT 2
            </span>
        `;

    }


    return `
        <span class="badge badge-unknown">
            ⚠️ PAYMENT NOT IDENTIFIED
        </span>
    `;

}


/* =====================================================
   NAME
===================================================== */

function getName(deposit){

    return (
        deposit.userName ||
        deposit.name ||
        deposit.fullName ||
        deposit.displayName ||
        "Unknown User"
    );

}


/* =====================================================
   PHONE
===================================================== */

function getPhone(deposit){

    return (
        deposit.phone ||
        deposit.mobile ||
        deposit.userPhone ||
        deposit.phoneNumber ||
        "Not available"
    );

}


/* =====================================================
   EMAIL
===================================================== */

function getEmail(deposit){

    return (
        deposit.email ||
        deposit.userEmail ||
        "Not available"
    );

}


/* =====================================================
   REFERENCE
===================================================== */

function getReference(deposit){

    return (
        deposit.referenceNumber ||
        deposit.referenceNo ||
        deposit.refNo ||
        deposit.reference ||
        deposit.gcashReference ||
        deposit.paymentReference ||
        "Not available"
    );

}


/* =====================================================
   PAYMENT CHANNEL
=====================================================

   IMPORTANT:

   paymentAccount is displayed here.

   Payment 1 / Payment 2 is NOT displayed as the
   payment channel itself.

===================================================== */

function getPaymentChannel(deposit){

    return (
        deposit.paymentAccount ||
        deposit.receivingAccount ||
        deposit.account ||
        "Not available"
    );

}


/* =====================================================
   PAYMENT METHOD
===================================================== */

function getPaymentMethod(deposit){

    return (
        deposit.paymentMethod ||
        deposit.method ||
        "Not available"
    );

}


/* =====================================================
   AMOUNT
===================================================== */

function getAmount(deposit){

    return Number(
        deposit.amount ||
        deposit.depositAmount ||
        deposit.value ||
        0
    );

}


/* =====================================================
   APPROVAL DATE
===================================================== */

function getApprovalDate(deposit){

    return (
        deposit.approvedAt ||
        deposit.updatedAt ||
        deposit.processedAt ||
        deposit.createdAt ||
        deposit.timestamp
    );

}


/* =====================================================
   SEARCH TEXT
===================================================== */

function searchableText(deposit){

    return [

        getName(deposit),

        getPhone(deposit),

        getEmail(deposit),

        getReference(deposit),

        getPaymentMethod(deposit),

        getPaymentChannel(deposit),

        deposit.userId,

        deposit.id

    ]
    .join(" ")
    .toLowerCase();

}


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits(){

    const list =
        document.getElementById(
            "depositList"
        );


    list.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Loading deposit history...

        </div>
    `;


    try{

        /*
           Load approved deposits only.
        */

        const q =
            query(
                collection(
                    db,
                    "deposits"
                ),
                where(
                    "status",
                    "==",
                    "Approved"
                )
            );


        const snapshot =
            await getDocs(q);


        allDeposits = [];


        snapshot.forEach(
            docSnapshot => {

                const data =
                    docSnapshot.data();


                allDeposits.push({

                    id:
                        docSnapshot.id,

                    ...data

                });

            }
        );


        /*
           Newest first.
        */

        allDeposits.sort(
            (a,b) => {

                return (
                    getTimestampValue(
                        getApprovalDate(b)
                    )
                    -
                    getTimestampValue(
                        getApprovalDate(a)
                    )
                );

            }
        );


        updateSummary();

        renderDeposits();

    }
    catch(error){

        console.error(
            "Deposit history error:",
            error
        );


        list.innerHTML = `
            <div class="error">

                ❌ Unable to load deposit history.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>
        `;


        document.getElementById(
            "listStatus"
        ).textContent =
            "Error";

    }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    let total = 0;

    let payment1Amount = 0;

    let payment2Amount = 0;

    let payment1Count = 0;

    let payment2Count = 0;


    allDeposits.forEach(
        deposit => {

            const amount =
                getAmount(deposit);


            const option =
                getPaymentOption(deposit);


            total += amount;


            if(option === "1"){

                payment1Amount += amount;

                payment1Count++;

            }


            if(option === "2"){

                payment2Amount += amount;

                payment2Count++;

            }

        }
    );


    document.getElementById(
        "totalAmount"
    ).textContent =
        money(total);


    document.getElementById(
        "totalCount"
    ).textContent =
        allDeposits.length;


    document.getElementById(
        "payment1Amount"
    ).textContent =
        money(payment1Amount);


    document.getElementById(
        "payment1Count"
    ).textContent =
        `${payment1Count} deposits`;


    document.getElementById(
        "payment2Amount"
    ).textContent =
        money(payment2Amount);


    document.getElementById(
        "payment2Count"
    ).textContent =
        `${payment2Count} deposits`;

}


/* =====================================================
   FILTER
===================================================== */

window.setFilter =
    function(filter){

        currentFilter =
            filter;


        document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.filter === filter
                    );

                }
            );


        renderDeposits();

    };


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function(){

            searchText =
                this.value
                .trim()
                .toLowerCase();


            renderDeposits();

        }
    );


/* =====================================================
   FILTERED DEPOSITS
===================================================== */

function getFilteredDeposits(){

    return allDeposits.filter(
        deposit => {

            const option =
                getPaymentOption(
                    deposit
                );


            if(
                currentFilter === "1" &&
                option !== "1"
            ){

                return false;

            }


            if(
                currentFilter === "2" &&
                option !== "2"
            ){

                return false;

            }


            if(
                currentFilter === "UNKNOWN" &&
                option !== null
            ){

                return false;

            }


            if(
                searchText &&
                !searchableText(
                    deposit
                ).includes(
                    searchText
                )
            ){

                return false;

            }


            return true;

        }
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderDeposits(){

    const list =
        document.getElementById(
            "depositList"
        );


    const deposits =
        getFilteredDeposits();


    document.getElementById(
        "showingCount"
    ).textContent =
        deposits.length;


    document.getElementById(
        "listStatus"
    ).textContent =
        `${deposits.length} record${
            deposits.length === 1
                ? ""
                : "s"
        }`;


    if(!deposits.length){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                No approved deposits found.

            </div>

        `;

        return;

    }


    list.innerHTML =
        deposits
        .map(
            (deposit,index) =>
                createDepositHTML(
                    deposit,
                    index
                )
        )
        .join("");

}

/* =====================================================
   TOGGLE
===================================================== */

window.toggleDeposit =
    function(index){

        const card =
            document.getElementById(
                `deposit-${index}`
            );


        if(!card){
            return;
        }


        const wasOpen =
            card.classList.contains(
                "open"
            );


        /*
           Close all.
        */

        document
            .querySelectorAll(
                ".deposit-card.open"
            )
            .forEach(
                other => {

                    other.classList.remove(
                        "open"
                    );

                }
            );


        /*
           Open selected.
        */

        if(!wasOpen){

            card.classList.add(
                "open"
            );


            const indicator =
                document.getElementById(
                    `indicator-${index}`
                );


            if(indicator){

                indicator.textContent =
                    "👆 Tap to hide details";

            }

        }


        /*
           Reset indicators.
        */

        document
            .querySelectorAll(
                ".deposit-card:not(.open) .expand-indicator"
            )
            .forEach(
                element => {

                    element.textContent =
                        "👆 Tap to view details";

                }
            );

    };


/* =====================================================
   ADMIN AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        if(
            user.uid !== ADMIN_UID
        ){

            alert(
                "Access denied. Administrator only."
            );


            window.location.href =
                "dashboard.html";

            return;

        }


        await loadDeposits();

    }
);
