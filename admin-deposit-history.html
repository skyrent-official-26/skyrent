<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SkyRent - Deposit History</title> <style> /* ===================================================== RESET ===================================================== */ *{ box-sizing:border-box; margin:0; padding:0; } body{ font-family:Arial,Helvetica,sans-serif; background:#f3f7ff; color:#172033; min-height:100vh; } /* ===================================================== HEADER ===================================================== */ .header{ background:linear-gradient( 135deg, #0757c9, #0b7bea ); color:white; padding:18px 16px; position:sticky; top:0; z-index:100; box-shadow: 0 4px 15px rgba(0,0,0,.15); } .header-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; } .header-title{ font-size:20px; font-weight:bold; } .header-subtitle{ font-size:12px; opacity:.85; margin-top:3px; } .back-btn{ border:none; background:rgba(255,255,255,.18); color:white; width:40px; height:40px; border-radius:12px; font-size:20px; cursor:pointer; } /* ===================================================== MAIN ===================================================== */ .container{ width:100%; max-width:800px; margin:auto; padding:15px; } /* ===================================================== SEARCH ===================================================== */ .search-box{ background:white; border-radius:16px; padding:14px; box-shadow:0 4px 15px rgba(0,0,0,.06); margin-bottom:14px; } .search-label{ font-size:13px; font-weight:bold; color:#64748b; margin-bottom:8px; } .search-input{ width:100%; border:1px solid #dbe5f3; background:#f8fbff; padding:13px 14px; border-radius:12px; font-size:14px; outline:none; } .search-input:focus{ border-color:#0b7bea; background:white; } /* ===================================================== SUMMARY ===================================================== */ .summary{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; } .summary-card{ background:white; border-radius:15px; padding:13px; box-shadow: 0 4px 15px rgba(0,0,0,.05); } .summary-label{ font-size:11px; color:#64748b; margin-bottom:5px; } .summary-value{ font-size:18px; font-weight:bold; color:#0757c9; } .summary-card.payment2 .summary-value{ color:#0b7bea; } .summary-card.total .summary-value{ color:#172033; } /* ===================================================== SECTION ===================================================== */ .section-title{ display:flex; justify-content:space-between; align-items:center; margin:17px 2px 9px; } .section-title h2{ font-size:16px; } .count{ font-size:12px; color:#64748b; } /* ===================================================== HISTORY LIST ===================================================== */ .history-list{ display:flex; flex-direction:column; gap:9px; } /* ===================================================== HISTORY ITEM ===================================================== */ .history-item{ background:white; border-radius:15px; box-shadow: 0 4px 14px rgba(0,0,0,.06); overflow:hidden; } /* ===================================================== COLLAPSED HEADER ===================================================== */ .history-header{ width:100%; border:none; background:white; display:flex; align-items:center; padding:13px; text-align:left; cursor:pointer; } .history-header:active{ background:#f7faff; } .history-main{ flex:1; min-width:0; } .top-line{ display:flex; align-items:center; gap:7px; margin-bottom:5px; } .payment-badge{ display:inline-block; padding:4px 7px; border-radius:7px; font-size:10px; font-weight:bold; color:white; } .payment1{ background:#0757c9; } .payment2{ background:#0b7bea; } .approved-badge{ background:#16a34a; color:white; padding:4px 7px; border-radius:7px; font-size:10px; font-weight:bold; } .user-name{ font-size:14px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .user-phone{ color:#64748b; font-size:12px; margin-top:2px; } .amount{ font-size:16px; font-weight:bold; color:#0757c9; margin-left:10px; white-space:nowrap; } .date{ font-size:11px; color:#94a3b8; margin-top:4px; } .chevron{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:18px; transition: transform .2s ease; } .history-item.open .chevron{ transform:rotate(180deg); } /* ===================================================== DETAILS ===================================================== */ .history-details{ display:none; border-top:1px solid #edf2f7; padding:13px; background:#fbfdff; } .history-item.open .history-details{ display:block; } .details-title{ font-size:13px; font-weight:bold; color:#0757c9; margin-bottom:10px; } .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; } .detail{ background:white; border:1px solid #edf2f7; border-radius:10px; padding:9px; min-width:0; } .detail.full{ grid-column:1 / -1; } .detail-label{ font-size:10px; color:#94a3b8; margin-bottom:4px; text-transform:uppercase; } .detail-value{ font-size:12px; font-weight:bold; color:#1e293b; word-break:break-word; } /* ===================================================== LOADING ===================================================== */ .loading{ text-align:center; padding:35px 15px; color:#64748b; font-size:14px; } .spinner{ width:28px; height:28px; border:3px solid #dbeafe; border-top-color:#0757c9; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; } @keyframes spin{ to{ transform:rotate(360deg); } } /* ===================================================== EMPTY ===================================================== */ .empty{ background:white; border-radius:15px; padding:30px 15px; text-align:center; color:#64748b; box-shadow: 0 4px 15px rgba(0,0,0,.05); } .empty-icon{ font-size:35px; margin-bottom:8px; } .empty-title{ font-weight:bold; color:#334155; margin-bottom:4px; } .empty-text{ font-size:12px; } /* ===================================================== ERROR ===================================================== */ .error-box{ background:#fff1f2; border:1px solid #fecdd3; color:#be123c; border-radius:12px; padding:13px; font-size:13px; display:none; margin-bottom:12px; } /* ===================================================== REFRESH BUTTON ===================================================== */ .refresh-btn{ width:100%; border:none; padding:13px; border-radius:12px; background:#e8f1ff; color:#0757c9; font-size:14px; font-weight:bold; cursor:pointer; margin-top:15px; } .refresh-btn:active{ transform:scale(.98); } /* ===================================================== DESKTOP ===================================================== */ @media(min-width:600px){ .summary{ grid-template-columns:1fr 1fr 1fr; } .history-header{ padding:15px; } .history-details{ padding:16px; } } </style> </head> <body> <!-- ===================================================== HEADER ===================================================== --> <header class="header"> <div class="header-row"> <button class="back-btn" onclick="window.location.href='admin.html'" > ← </button> <div style="flex:1;"> <div class="header-title"> Deposit History </div> <div class="header-subtitle"> Approved Payment 1 & Payment 2 deposits </div> </div> </div> </header> <!-- ===================================================== MAIN ===================================================== --> <main class="container"> <!-- SEARCH --> <div class="search-box"> <div class="search-label"> Search Deposit History </div> <input type="text" id="historySearch" class="search-input" placeholder="Search phone, name, reference or transaction ID..." autocomplete="off" > </div> <!-- ERROR --> <div id="errorBox" class="error-box" ></div> <!-- SUMMARY --> <div class="summary"> <div class="summary-card"> <div class="summary-label"> Payment 1 </div> <div class="summary-value" id="payment1Total" > ₱0.00 </div> </div> <div class="summary-card payment2"> <div class="summary-label"> Payment 2 </div> <div class="summary-value" id="payment2Total" > ₱0.00 </div> </div> <div class="summary-card total"> <div class="summary-label"> Total Approved </div> <div class="summary-value" id="totalDeposit" > ₱0.00 </div> </div> </div> <!-- LIST --> <div class="section-title"> <h2> Deposit Records </h2> <span class="count" id="recordCount" > 0 records </span> </div> <div id="historyList" class="history-list" > <div class="loading"> <div class="spinner"></div> Loading deposit history... </div> </div> <button class="refresh-btn" id="refreshBtn" > 🔄 Refresh History </button> </main> <!-- ===================================================== FIREBASE ===================================================== --> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ===================================================== FIREBASE CONFIG ===================================================== */ const firebaseConfig = { apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8", authDomain: "skyrent-ea30c.firebaseapp.com", projectId: "skyrent-ea30c", storageBucket: "skyrent-ea30c.firebasestorage.app", messagingSenderId: "572678456448", appId: "1:572678456448:web:6b7132351515742dd09265" }; /* ===================================================== INITIALIZE ===================================================== */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ===================================================== ADMIN UID ===================================================== */ const ADMIN_UID = "28zzG9NB46gRkwia7WtOxS1lQNa2"; /* ===================================================== GLOBAL DATA ===================================================== */ let allDeposits = []; /* ===================================================== HELPERS ===================================================== */ function escapeHTML(value){ if( value === null || value === undefined ){ return ""; } return String(value) .replace(/&/g,"&amp;") .replace(/</g,"&lt;") .replace(/>/g,"&gt;") .replace(/"/g,"&quot;") .replace(/'/g,"&#039;"); } function getNumber(value){ const number = Number(value); return Number.isFinite(number) ? number : 0; } function money(value){ return "₱" + getNumber(value) .toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); } function formatDate(value){ if(!value){ return "—"; } try{ let date; if( typeof value === "object" && value.seconds !== undefined ){ date = new Date( value.seconds * 1000 ); } else if( typeof value === "object" && typeof value.toDate === "function" ){ date = value.toDate(); } else{ date = new Date(value); } if( isNaN(date.getTime()) ){ return "—"; } return date.toLocaleString( "en-PH", { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", second:"2-digit" } ); } catch(error){ return "—"; } } function getDateValue(value){ if(!value){ return 0; } try{ if( typeof value === "object" && value.seconds !== undefined ){ return value.seconds * 1000; } if( typeof value === "object" && typeof value.toDate === "function" ){ return value.toDate().getTime(); } const date = new Date(value); return date.getTime() || 0; } catch(error){ return 0; } } /* ===================================================== PAYMENT CHANNEL ===================================================== */ function getPaymentChannel(data){ return ( data.paymentChannel || data.paymentMethodChannel || data.channel || data.payment || "" ); } /* ===================================================== APPROVED STATUS ===================================================== */ function isApproved(data){ const status = String( data.status || "" ) .trim() .toLowerCase(); return ( status === "approved" || status === "deposit approved" || status === "deposit successful" || status === "success" || status === "successful" ); } /* ===================================================== GET DEPOSIT DATE ===================================================== */ function getDepositDate(data){ return ( data.approvedAt || data.updatedAt || data.createdAt || data.submittedAt || data.requestedAt ); } /* ===================================================== SEARCH TEXT ===================================================== */ function searchableText(record){ const data = record.data || {}; return [ data.phone, data.userPhone, data.userName, data.name, data.email, data.referenceNumber, data.referenceNo, data.gcachReference, data.gcashReference, data.mayaReference, data.instapayReference, data.transactionId, data.depositId, record.id, data.uid, data.userId, getPaymentChannel(data), data.paymentMethod ] .filter( value => value !== undefined && value !== null ) .join(" ") .toLowerCase(); } /* ===================================================== GET USER NAME ===================================================== */ function getUserName(data){ return ( data.userName || data.name || data.fullName || "Unknown User" ); } /* ===================================================== GET PHONE ===================================================== */ function getPhone(data){ return ( data.phone || data.userPhone || "—" ); } /* ===================================================== GET AMOUNT ===================================================== */ function getAmount(data){ return getNumber( data.amount ?? data.depositAmount ?? data.amountDeposited ?? 0 ); } /* ===================================================== GET REFERENCE ===================================================== */ function getReference(data){ return ( data.referenceNumber || data.referenceNo || data.gcashReference || data.gcachReference || data.mayaReference || data.instapayReference || data.refNumber || "—" ); } /* ===================================================== GET TRANSACTION ID ===================================================== */ function getTransactionId(data, id){ return ( data.transactionId || data.depositTransactionId || data.txnId || id || "—" ); } /* ===================================================== LOAD HISTORY ===================================================== */ async function loadHistory(){ const historyList = document.getElementById( "historyList" ); const errorBox = document.getElementById( "errorBox" ); errorBox.style.display = "none"; historyList.innerHTML = ` <div class="loading"> <div class="spinner"></div> Loading deposit history... </div> `; try{ let snapshot; /* * Try newest approved deposits first. */ try{ const depositsQuery = query( collection( db, "deposits" ), orderBy( "approvedAt", "desc" ) ); snapshot = await getDocs( depositsQuery ); } catch(error){ /* * Fallback if some documents do not * contain approvedAt or index is unavailable. */ snapshot = await getDocs( collection( db, "deposits" ) ); } allDeposits = []; snapshot.forEach( docSnapshot => { const data = docSnapshot.data(); /* * Only approved deposits belong * in Deposit History. */ if(!isApproved(data)){ return; } allDeposits.push({ id: docSnapshot.id, data: data }); } ); /* * Newest first. */ allDeposits.sort( (a,b) => getDateValue( getDepositDate(b.data) ) - getDateValue( getDepositDate(a.data) ) ); updateSummary(); renderHistory(); } catch(error){ console.error( "Deposit history error:", error ); historyList.innerHTML = ` <div class="empty"> <div class="empty-icon"> ⚠️ </div> <div class="empty-title"> Unable to load history </div> <div class="empty-text"> Please check your Firebase connection and Firestore permissions. </div> </div> `; errorBox.textContent = error.message || "Unable to load deposit history."; errorBox.style.display = "block"; } } /* ===================================================== SUMMARY ===================================================== */ function updateSummary(){ let payment1 = 0; let payment2 = 0; let total = 0; allDeposits.forEach( record => { const data = record.data; const amount = getAmount(data); const channel = getPaymentChannel(data) .toLowerCase(); total += amount; if( channel.includes("payment 1") || channel.includes("payment1") ){ payment1 += amount; } else if( channel.includes("payment 2") || channel.includes("payment2") ){ payment2 += amount; } } ); document.getElementById( "payment1Total" ).textContent = money(payment1); document.getElementById( "payment2Total" ).textContent = money(payment2); document.getElementById( "totalDeposit" ).textContent = money(total); } /* ===================================================== PAYMENT BADGE ===================================================== */ function paymentBadge(channel){ const lower = String(channel) .toLowerCase(); if( lower.includes("payment 2") || lower.includes("payment2") ){ return ` <span class="payment-badge payment2"> Payment 2 </span> `; } return ` <span class="payment-badge payment1"> Payment 1 </span> `; } /* ===================================================== DETAIL ITEM ===================================================== */ function detailItem( label, value, full = false ){ return ` <div class="detail ${full ? "full" : ""}"> <div class="detail-label"> ${escapeHTML(label)} </div> <div class="detail-value"> ${escapeHTML( value === undefined || value === null || value === "" ? "—" : value )} </div> </div> `; } /* ===================================================== RENDER HISTORY ===================================================== */ function renderHistory(){ const historyList = document.getElementById( "historyList" ); const search = document.getElementById( "historySearch" ) .value .trim() .toLowerCase(); let records = allDeposits; if(search){ records = allDeposits.filter( record => searchableText( record ).includes(search) ); } document.getElementById( "recordCount" ).textContent = records.length + ( records.length === 1 ? " record" : " records" ); if(records.length === 0){ historyList.innerHTML = ` <div class="empty"> <div class="empty-icon"> 📋 </div> <div class="empty-title"> No deposit history found </div> <div class="empty-text"> ${ search ? "No approved deposit matches your search." : "There are no approved deposits yet." } </div> </div> `; return; } historyList.innerHTML = ""; records.forEach( record => { const data = record.data; const userName = getUserName(data); const phone = getPhone(data); const amount = getAmount(data); const channel = getPaymentChannel(data); const reference = getReference(data); const transactionId = getTransactionId( data, record.id ); const depositDate = getDepositDate(data); const item = document.createElement( "div" ); item.className = "history-item"; item.innerHTML = ` <!-- ========================= COLLAPSED ROW ========================== --> <button class="history-header" type="button" > <div class="history-main"> <div class="top-line"> ${paymentBadge(channel)} <span class="approved-badge"> Approved </span> </div> <div class="user-name"> ${escapeHTML( userName )} </div> <div class="user-phone"> ${escapeHTML( phone )} </div> <div class="date"> ${escapeHTML( formatDate( depositDate ) )} </div> </div> <div class="amount"> ${money(amount)} </div> <div class="chevron"> ▼ </div> </button> <!-- ========================= DETAILS ========================== --> <div class="history-details"> <div class="details-title"> Deposit Details </div> <div class="detail-grid"> ${detailItem( "User Name", userName )} ${detailItem( "Phone Number", phone )} ${detailItem( "Deposit Amount", money(amount) )} ${detailItem( "Payment Channel", channel || "—" )} ${detailItem( "Payment Method", data.paymentMethod || data.method || data.depositMethod || "—" )} ${detailItem( "Reference Number", reference )} ${detailItem( "Transaction ID", transactionId )} ${detailItem( "Deposit Status", data.status || "Approved" )} ${detailItem( "Requested / Submitted", formatDate( data.requestedAt || data.submittedAt || data.createdAt ) )} ${detailItem( "Approved At", formatDate( data.approvedAt || data.updatedAt ) )} ${detailItem( "Approved By", data.approvedBy || data.approvedByEmail || "—" )} ${detailItem( "User ID", data.uid || data.userId || "—", true )} ${detailItem( "Deposit Record ID", record.id, true )} </div> </div> `; /* * Click to expand/collapse. */ const header = item.querySelector( ".history-header" ); header.addEventListener( "click", () => { item.classList.toggle( "open" ); } ); historyList.appendChild( item ); } ); } /* ===================================================== SEARCH ===================================================== */ document.getElementById( "historySearch" ) .addEventListener( "input", renderHistory ); /* ===================================================== REFRESH ===================================================== */ document.getElementById( "refreshBtn" ) .addEventListener( "click", async () => { const button = document.getElementById( "refreshBtn" ); button.disabled = true; button.textContent = "⏳ Refreshing..."; try{ await loadHistory(); } finally{ button.disabled = false; button.textContent = "🔄 Refresh History"; } } ); /* ===================================================== ADMIN AUTH ===================================================== */ onAuthStateChanged( auth, async user => { if(!user){ window.location.href = "index.html"; return; } /* * Only the configured admin account * can access this page. */ if( user.uid !== ADMIN_UID ){ try{ await signOut(auth); } catch(error){ console.error( error ); } window.location.href = "index.html"; return; } /* * Admin verified. */ await loadHistory(); } ); </script> </body> </html>
