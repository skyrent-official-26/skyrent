<head>

<title>SkyRent - Transactions</title>

<style> /* ===================================================== RESET ===================================================== */ *{ margin:0; padding:0; box-sizing:border-box; } body{ font-family:Arial, Helvetica, sans-serif; background:#f3f7fc; color:#172033; padding-bottom:90px; } /* ===================================================== HEADER ===================================================== */ .header{ background: linear-gradient( 135deg, #0757c9, #1475e8 ); color:white; padding: 22px 20px 32px; border-bottom-left-radius:32px; border-bottom-right-radius:32px; box-shadow: 0 10px 25px rgba(7,87,201,.18); } .back-row{ display:flex; align-items:center; gap:13px; } .back-button{ width:43px; height:43px; border:none; border-radius:14px; background: rgba(255,255,255,.18); color:white; font-size:23px; cursor:pointer; } .header-logo{ font-size:18px; font-weight:900; } .header h1{ margin-top:22px; font-size:30px; font-weight:900; } .header p{ margin-top:6px; font-size:13px; opacity:.9; } /* ===================================================== CONTAINER ===================================================== */ .container{ width:92%; max-width:520px; margin: -20px auto 0; position:relative; z-index:5; } /* ===================================================== SUMMARY CARD ===================================================== */ .total-card{ background:white; border-radius:23px; padding:22px; box-shadow: 0 9px 25px rgba(30,70,120,.10); } .total-label{ color:#8a929e; font-size:11px; font-weight:800; letter-spacing:.5px; margin-bottom:8px; } .total-amount{ color:#0757c9; font-size:30px; font-weight:900; } .total-count{ margin-top:6px; color:#858d99; font-size:12px; } .summary-row{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin-top:16px; } .summary-box{ background:#f7f9fc; border:1px solid #e7edf5; border-radius:15px; padding:13px; } .summary-box-label{ color:#89919d; font-size:9px; font-weight:800; margin-bottom:5px; } .summary-box-value{ font-size:16px; font-weight:900; } .summary-box.income .summary-box-value{ color:#168044; } .summary-box.expense .summary-box-value{ color:#c62828; } /* ===================================================== FILTER BUTTONS ===================================================== */ .filter-card{ margin-top:14px; background:white; border-radius:20px; padding:14px; box-shadow: 0 9px 25px rgba(30,70,120,.08); } .filter-row{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; } .filter-row::-webkit-scrollbar{ display:none; } .filter-btn{ flex:0 0 auto; border:none; background:#eef5ff; color:#0757c9; padding: 9px 13px; border-radius:20px; font-size:10px; font-weight:900; cursor:pointer; } .filter-btn.active{ background: linear-gradient( 135deg, #0757c9, #1475e8 ); color:white; } /* ===================================================== TRANSACTION CARD ===================================================== */ .history-card{ margin-top:14px; background:white; border-radius:23px; padding:20px; box-shadow: 0 9px 25px rgba(30,70,120,.08); } .history-title{ font-size:21px; font-weight:900; margin-bottom:15px; } .transaction-list{ display:flex; flex-direction:column; gap:10px; } /* ===================================================== TRANSACTION ITEM ===================================================== */ .transaction-item{ background:#f7f9fc; border:1px solid #e7edf5; border-radius:16px; padding:14px; } .transaction-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; } .transaction-left{ display:flex; align-items:center; gap:11px; min-width:0; } .transaction-icon{ width:43px; height:43px; flex-shrink:0; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; background:#eef5ff; } .transaction-info{ min-width:0; } .transaction-type{ color:#172033; font-size:13px; font-weight:900; margin-bottom:4px; } .transaction-description{ color:#8a929e; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .transaction-amount{ font-size:16px; font-weight:900; white-space:nowrap; } .transaction-amount.plus{ color:#188044; } .transaction-amount.minus{ color:#c62828; } /* ===================================================== STATUS ===================================================== */ .status{ display:inline-block; padding: 6px 10px; border-radius:20px; font-size:9px; font-weight:900; white-space:nowrap; } .status.pending{ background:#fff4d6; color:#a57400; } .status.approved{ background:#e5f8ed; color:#188044; } .status.rejected{ background:#fff0f0; color:#c62828; } .status.completed{ background:#e5f8ed; color:#188044; } /* ===================================================== TRANSACTION BOTTOM ===================================================== */ .transaction-bottom{ margin-top:11px; padding-top:10px; border-top: 1px solid #e3e8ef; display:flex; justify-content:space-between; align-items:center; gap:8px; } .transaction-date{ color:#687281; font-size:10px; } /* ===================================================== EMPTY ===================================================== */ .empty{ text-align:center; padding:30px 10px; color:#858d99; font-size:13px; } /* ===================================================== REFRESH ===================================================== */ .refresh-btn{ width:100%; margin-top:13px; padding:13px; border:none; border-radius:14px; background:#eef5ff; color:#0757c9; font-size:13px; font-weight:900; cursor:pointer; } .refresh-btn:active{ transform:scale(.98); } /* ===================================================== WITHDRAWAL HISTORY ===================================================== */ .withdraw-history-btn{ width:100%; margin-top:12px; padding:15px; border:none; border-radius:15px; background: linear-gradient( 135deg, #0757c9, #1475e8 ); color:white; font-size:14px; font-weight:900; cursor:pointer; box-shadow: 0 7px 17px rgba(7,87,201,.18); } /* ===================================================== BOTTOM NAV ===================================================== */ .bottom-nav{ position:fixed; left:0; right:0; bottom:0; height:78px; background: rgba(255,255,255,.97); border-top: 1px solid #e8edf4; box-shadow: 0 -5px 20px rgba(20,60,110,.10); display:grid; grid-template-columns: repeat(5,1fr); z-index:9999; backdrop-filter:blur(10px); } .nav-item{ border:none; background:transparent; color:#89919d; font-size:10px; font-weight:bold; cursor:pointer; padding-top:9px; } .nav-icon{ display:block; font-size:21px; margin-bottom:4px; } .nav-item.active{ color:#0757c9; } </style>

</head>

<body>

<!-- ===================================================== HEADER ===================================================== -->

<header class="header">

<div class="back-row"> <button class="back-button" onclick="goBack()"> ← </button> <div class="header-logo"> SkyRent </div> </div> <h1> Transactions </h1> <p> Complete account activity </p>

</header>

<main class="container">

<!-- ===================================================== SUMMARY ===================================================== -->

<div class="total-card">

<div class="total-label"> TOTAL DEPOSIT AMOUNT </div> <div class="total-amount" id="totalDeposit"> ₱0.00 </div> <div class="total-count" id="transactionCount"> Loading transactions... </div> <div class="summary-row"> <div class="summary-box income"> <div class="summary-box-label"> TOTAL RECEIVED </div> <div class="summary-box-value" id="totalIncome"> ₱0.00 </div> </div> <div class="summary-box expense"> <div class="summary-box-label"> TOTAL SPENT </div> <div class="summary-box-value" id="totalExpense"> ₱0.00 </div> </div> </div>

</div>

<!-- ===================================================== WITHDRAWAL HISTORY ===================================================== -->

<button class="withdraw-history-btn" onclick="goWithdrawalHistory()">

💸 Withdrawal History

</button>

<!-- ===================================================== FILTERS ===================================================== -->

<div class="filter-card">

<div class="filter-row"> <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)"> All </button> <button class="filter-btn" data-filter="deposit" onclick="setFilter('deposit', this)"> Deposits </button> <button class="filter-btn" data-filter="purchase" onclick="setFilter('purchase', this)"> Purchases </button> <button class="filter-btn" data-filter="withdrawal" onclick="setFilter('withdrawal', this)"> Withdrawals </button> <button class="filter-btn" data-filter="earning" onclick="setFilter('earning', this)"> Earnings </button> <button class="filter-btn" data-filter="commission" onclick="setFilter('commission', this)"> Commission </button> <button class="filter-btn" data-filter="bonus" onclick="setFilter('bonus', this)"> Bonus </button> <button class="filter-btn" data-filter="gift" onclick="setFilter('gift', this)"> Gift Codes </button> </div>

</div>

<!-- ===================================================== TRANSACTION HISTORY ===================================================== -->

<div class="history-card">

<div class="history-title"> Transaction History </div> <div id="transactionList" class="transaction-list"> <div class="empty"> Loading transactions... </div> </div> <button class="refresh-btn" onclick="loadTransactions()"> 🔄 Refresh Transactions </button>

</div>

</main>

<!-- ===================================================== BOTTOM NAV ===================================================== -->

<nav class="bottom-nav">

<button class="nav-item" onclick="goHome()"> <span class="nav-icon"> 🏠 </span> Home </button> <button class="nav-item" onclick="goCrafts()"> <span class="nav-icon"> ✈️ </span> Crafts </button> <button class="nav-item" onclick="goNetwork()"> <span class="nav-icon"> 👥 </span> Network </button> <button class="nav-item active"> <span class="nav-icon"> 💰 </span> Earnings </button> <button class="nav-item" onclick="logout()"> <span class="nav-icon"> ↪ </span> Logout </button>

</nav>

<!-- ===================================================== FIREBASE ===================================================== -->

<script type="module"> /* ===================================================== FIREBASE IMPORTS ===================================================== */ import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ===================================================== FIREBASE CONFIG ===================================================== */ const firebaseConfig = { apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8", authDomain: "skyrent-ea30c.firebaseapp.com", projectId: "skyrent-ea30c", storageBucket: "skyrent-ea30c.firebasestorage.app", messagingSenderId: "572678456448", appId: "1:572678456448:web:6b7132351515742dd09265" }; /* ===================================================== INITIALIZE ===================================================== */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ===================================================== CURRENT USER ===================================================== */ let currentUser = null; /* ===================================================== ALL TRANSACTIONS ===================================================== */ let allTransactions = []; /* ===================================================== CURRENT FILTER ===================================================== */ let currentFilter = "all"; /* ===================================================== FORMAT MONEY ===================================================== */ function formatMoney(amount){ return "₱" + Number(amount || 0).toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); } /* ===================================================== GET NUMBER ===================================================== */ function getNumber(data, fields){ if(!data){ return 0; } for(const field of fields){ const value = data[field]; if( value !== undefined && value !== null && value !== "" ){ const number = Number( String(value) .replace(/[₱,\s]/g,"") ); if(!isNaN(number)){ return number; } } } return 0; } /* ===================================================== GET DATE ===================================================== */ function getDate(data){ if(!data){ return null; } const fields = [ "createdAt", "updatedAt", "requestedAt", "submittedAt", "approvedAt", "completedAt", "collectedAt", "earnedAt", "purchaseDate", "date", "time" ]; for(const field of fields){ const value = data[field]; if(!value){ continue; } if( value && typeof value.toDate === "function" ){ return value.toDate(); } if(value instanceof Date){ return value; } const date = new Date(value); if(!isNaN(date.getTime())){ return date; } } return null; } /* ===================================================== FORMAT DATE ===================================================== */ function formatDate(date){ if(!date){ return "Date unavailable"; } return date.toLocaleString( "en-PH", { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", hour12:true } ); } /* ===================================================== GET STATUS ===================================================== */ function getStatus(data){ if(!data){ return "Completed"; } return String( data.status || data.depositStatus || data.withdrawalStatus || data.investmentStatus || data.earningStatus || "Completed" ); } /* ===================================================== STATUS CLASS ===================================================== */ function getStatusClass(status){ const value = String(status) .toLowerCase(); if( value.includes("reject") || value.includes("cancel") || value.includes("decline") ){ return "rejected"; } if( value.includes("pending") || value.includes("process") || value.includes("review") ){ return "pending"; } if( value.includes("complete") || value.includes("approve") || value.includes("success") || value.includes("active") || value.includes("collected") ){ return "completed"; } return "completed"; } /* ===================================================== CHECK SUCCESSFUL STATUS ===================================================== */ function isSuccessful(data){ const status = getStatus(data) .toLowerCase(); return ( status.includes("approve") || status.includes("success") || status.includes("complete") || status.includes("active") || status.includes("collect") ); } /* ===================================================== GET NAME ===================================================== */ function getName(data, fallback){ if(!data){ return fallback; } return ( data.planName || data.plan || data.aircraftName || data.aircraft || data.name || data.title || fallback ); } /* ===================================================== LOAD ONE COLLECTION SAFELY ===================================================== */ async function loadCollection( collectionName ){ try{ const ref = collection( db, collectionName ); const q = query( ref, where( "userId", "==", currentUser.uid ) ); const snapshot = await getDocs(q); const records = []; snapshot.forEach( docSnapshot => { records.push({ id: docSnapshot.id, ...docSnapshot.data() }); } ); return records; } catch(error){ console.log( "Collection skipped:", collectionName, error ); return []; } } /* ===================================================== ADD TRANSACTION ===================================================== */ function addTransaction({ type, title, description, amount, direction, status, date, icon, sourceId }){ const numericAmount = Number(amount || 0); if( numericAmount <= 0 ){ return; } allTransactions.push({ type, title, description, amount:numericAmount, direction, status, date, icon, sourceId }); } /* ===================================================== LOAD TRANSACTIONS ===================================================== */ window.loadTransactions = async function(){ if(!currentUser){ return; } const list = document.getElementById( "transactionList" ); list.innerHTML = ` <div class="empty"> Loading transactions... </div> `; allTransactions = []; try{ /* ================================================= 1. DEPOSITS ================================================= */ const deposits = await loadCollection( "deposits" ); deposits.forEach( deposit => { const amount = getNumber( deposit, [ "amount", "amountValue", "depositAmount", "value" ] ); const status = getStatus(deposit); addTransaction({ type:"deposit", title:"Deposit", description: "Account deposit", amount, direction:"plus", status, date: getDate(deposit), icon:"💳", sourceId: deposit.id }); } ); /* ================================================= 2. PURCHASES / INVESTMENTS ================================================= */ let purchases = await loadCollection( "purchases" ); const investments = await loadCollection( "investments" ); /* If your system stores purchases inside investments, those are also included. */ purchases = purchases.concat( investments ); purchases.forEach( purchase => { let amount = getNumber( purchase, [ "amount", "price", "purchaseAmount", "investmentAmount", "cost", "planPrice", "principal" ] ); const status = getStatus(purchase); /* Only display the purchase as a completed deduction when the record indicates a successful purchase. */ if( amount > 0 ){ addTransaction({ type:"purchase", title:"Aircraft Purchase", description: getName( purchase, "Investment Plan" ), amount, direction:"minus", status, date: getDate(purchase), icon:"✈️", sourceId: purchase.id }); } } ); /* ================================================= 3. WITHDRAWALS ================================================= */ const withdrawals = await loadCollection( "withdrawals" ); withdrawals.forEach( withdrawal => { const amount = getNumber( withdrawal, [ "amount", "withdrawalAmount", "value" ] ); addTransaction({ type:"withdrawal", title:"Withdrawal", description: "Withdrawal request", amount, direction:"minus", status: getStatus(withdrawal), date: getDate(withdrawal), icon:"💸", sourceId: withdrawal.id }); } ); /* ================================================= 4. DAILY EARNINGS ================================================= */ const earnings = await loadCollection( "earnings" ); earnings.forEach( earning => { const amount = getNumber( earning, [ "amount", "earning", "earnings", "dailyEarning", "profit", "value" ] ); addTransaction({ type:"earning", title:"Daily Earnings", description: getName( earning, "Daily investment earnings" ), amount, direction:"plus", status: getStatus(earning), date: getDate(earning), icon:"📈", sourceId: earning.id }); } ); /* ================================================= 5. COMMISSIONS ================================================= */ const commissions = await loadCollection( "commissions" ); commissions.forEach( commission => { const amount = getNumber( commission, [ "amount", "commission", "commissionAmount", "value" ] ); let level = commission.level || commission.levelName || ""; if(level){ level = " • " + String(level); } addTransaction({ type:"commission", title:"Referral Commission", description: "Network commission" + level, amount, direction:"plus", status: getStatus(commission), date: getDate(commission), icon:"🤝", sourceId: commission.id }); } ); /* Also support the singular referralCommissions collection if that is what your existing Firebase structure uses. */ const referralCommissions = await loadCollection( "referralCommissions" ); referralCommissions.forEach( commission => { const amount = getNumber( commission, [ "amount", "commission", "commissionAmount", "value" ] ); addTransaction({ type:"commission", title:"Referral Commission", description: "Referral commission", amount, direction:"plus", status: getStatus(commission), date: getDate(commission), icon:"🤝", sourceId: commission.id }); } ); /* ================================================= 6. BONUSES ================================================= */ const bonuses = await loadCollection( "bonuses" ); bonuses.forEach( bonus => { const amount = getNumber( bonus, [ "amount", "bonus", "bonusAmount", "value" ] ); addTransaction({ type:"bonus", title:"Bonus", description: bonus.reason || bonus.description || "Account bonus", amount, direction:"plus", status: getStatus(bonus), date: getDate(bonus), icon:"🎁", sourceId: bonus.id }); } ); /* ================================================= 7. GIFT CODE CLAIMS ================================================= */ const giftClaims = await loadCollection( "giftCodeClaims" ); giftClaims.forEach( gift => { const amount = getNumber( gift, [ "amount", "value", "reward", "bonusAmount", "giftAmount" ] ); addTransaction({ type:"gift", title:"Gift Code", description: gift.code ? "Gift Code • " + gift.code : "Gift code reward", amount, direction:"plus", status: getStatus(gift), date: getDate(gift), icon:"🎁", sourceId: gift.id }); } ); /* Support another common name if your gift system uses giftClaims. */ const giftClaims2 = await loadCollection( "giftClaims" ); giftClaims2.forEach( gift => { const amount = getNumber( gift, [ "amount", "value", "reward", "bonusAmount", "giftAmount" ] ); addTransaction({ type:"gift", title:"Gift Code", description: gift.code ? "Gift Code • " + gift.code : "Gift code reward", amount, direction:"plus", status: getStatus(gift), date: getDate(gift), icon:"🎁", sourceId: gift.id }); } ); /* ================================================= SORT NEWEST FIRST ================================================= */ allTransactions.sort( (a,b) => { if( !a.date && !b.date ){ return 0; } if(!a.date){ return 1; } if(!b.date){ return -1; } return ( b.date.getTime() - a.date.getTime() ); } ); /* ================================================= TOTAL DEPOSITS ================================================= */ let totalDeposit = 0; deposits.forEach( deposit => { const status = getStatus( deposit ).toLowerCase(); /* Rejected/cancelled deposits are not included in the total deposit amount. */ if( !status.includes("reject") && !status.includes("cancel") && !status.includes("decline") ){ totalDeposit += getNumber( deposit, [ "amount", "amountValue", "depositAmount", "value" ] ); } } ); document.getElementById( "totalDeposit" ).innerText = formatMoney( totalDeposit ); /* ================================================= TOTAL INCOME ================================================= */ let totalIncome = 0; allTransactions.forEach( transaction => { if( transaction.direction === "plus" ){ const status = String( transaction.status ).toLowerCase(); /* Pending and rejected transactions are not counted as received money. */ if( !status.includes("pending") && !status.includes("reject") && !status.includes("cancel") && !status.includes("decline") ){ totalIncome += transaction.amount; } } } ); /* ================================================= TOTAL EXPENSE ================================================= */ let totalExpense = 0; allTransactions.forEach( transaction => { if( transaction.direction === "minus" ){ const status = String( transaction.status ).toLowerCase(); if( !status.includes("pending") && !status.includes("reject") && !status.includes("cancel") && !status.includes("decline") ){ totalExpense += transaction.amount; } } } ); document.getElementById( "totalIncome" ).innerText = formatMoney( totalIncome ); document.getElementById( "totalExpense" ).innerText = formatMoney( totalExpense ); document.getElementById( "transactionCount" ).innerText = allTransactions.length + ( allTransactions.length === 1 ? " transaction" : " transactions" ); renderTransactions(); } catch(error){ console.error( "Transaction loading error:", error ); list.innerHTML = ` <div class="empty"> Unable to load transactions. <br><br> Please check your internet connection. </div> `; } }; /* ===================================================== RENDER TRANSACTIONS ===================================================== */ function renderTransactions(){ const list = document.getElementById( "transactionList" ); let transactions = allTransactions; if( currentFilter !== "all" ){ transactions = allTransactions.filter( transaction => transaction.type === currentFilter ); } list.innerHTML = ""; if( transactions.length === 0 ){ list.innerHTML = ` <div class="empty"> No transactions found. </div> `; return; } transactions.forEach( transaction => { const item = document.createElement( "div" ); item.className = "transaction-item"; const sign = transaction.direction === "plus" ? "+" : "−"; const amountClass = transaction.direction === "plus" ? "plus" : "minus"; const statusClass = getStatusClass( transaction.status ); item.innerHTML = ` <div class="transaction-top"> <div class="transaction-left"> <div class="transaction-icon"> ${transaction.icon} </div> <div class="transaction-info"> <div class="transaction-type"> ${transaction.title} </div> <div class="transaction-description"> ${transaction.description} </div> </div> </div> <div class="transaction-amount ${amountClass}"> ${sign}${formatMoney( transaction.amount )} </div> </div> <div class="transaction-bottom"> <div class="transaction-date"> ${formatDate( transaction.date )} </div> <div class="status ${statusClass}"> ${transaction.status} </div> </div> `; list.appendChild( item ); } ); } /* ===================================================== FILTER ===================================================== */ window.setFilter = function( filter, button ){ currentFilter = filter; document .querySelectorAll( ".filter-btn" ) .forEach( btn => { btn.classList.remove( "active" ); } ); button.classList.add( "active" ); renderTransactions(); }; /* ===================================================== FIREBASE AUTH ===================================================== */ onAuthStateChanged( auth, async function(user){ if(!user){ console.log( "No Firebase user." ); window.location.href = "index.html"; return; } currentUser = user; console.log( "Transactions user:", user.uid ); await loadTransactions(); } ); /* ===================================================== NAVIGATION ===================================================== */ window.goHome = function(){ window.location.href = "dashboard.html"; }; window.goCrafts = function(){ window.location.href = "crafts.html"; }; window.goNetwork = function(){ window.location.href = "network.html"; }; window.goBack = function(){ window.location.href = "dashboard.html"; }; window.goWithdrawalHistory = function(){ window.location.href = "withdrawal-history.html"; }; /* ===================================================== LOGOUT ===================================================== */ window.logout = async function(){ try{ await signOut( auth ); window.location.href = "index.html"; } catch(error){ console.error( "Logout error:", error ); alert( "Logout failed. Please try again." ); } }; console.log( "SkyRent Transactions Firebase Connected" ); </script>
