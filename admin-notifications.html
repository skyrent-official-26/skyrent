<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Admin Notifications</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:#f3f7ff;

color:#1e293b;

}



.header{

background:linear-gradient(
135deg,
#075985,
#0284c7
);

color:white;

text-align:center;

padding:22px 15px;

}



.header h1{

margin:0;

font-size:24px;

}


.header p{

margin:6px 0 0;

font-size:13px;

}



.container{

max-width:500px;

margin:auto;

padding:15px;

}



.card{

background:white;

border-radius:16px;

padding:20px;

margin-top:20px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

text-align:center;

}



.logo{

width:130px;

}



button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:12px;

font-size:15px;

font-weight:bold;

}



.enable{

background:#0284c7;

color:white;

}



.back{

background:#64748b;

color:white;

}



.status{

margin-top:15px;

padding:12px;

border-radius:10px;

background:#eff6ff;

color:#075985;

font-weight:bold;

font-size:14px;

}



.status.success{

background:#ecfdf5;

color:#047857;

}



.status.error{

background:#fef2f2;

color:#b91c1c;

}



.spinner{

display:none;

width:30px;

height:30px;

border:4px solid #dbeafe;

border-top-color:#0284c7;

border-radius:50%;

animation:spin .8s linear infinite;

margin:15px auto;

}


@keyframes spin{

to{

transform:rotate(360deg);

}

}



.info{

font-size:12px;

color:#64748b;

margin-top:15px;

}


</style>

</head>


<body>


<div class="header">

<h1>🔔 SkyRent Notifications</h1>

<p>Admin Notification Settings</p>

</div>



<div class="container">


<div class="card">


<img src="skyrent-logo.png" class="logo">


<h2>
Enable Admin Alerts
</h2>


<p>
Receive important SkyRent notifications.
</p>



<div id="loading" class="spinner"></div>



<button id="enableButton"
class="enable"
onclick="enableNotifications()">

🔔 Enable Notifications

</button>



<div id="status" class="status">

Checking notification status...

</div>



<div class="info">

This device will receive SkyRent admin alerts.

</div>

<button
class="enable"
onclick="sendTestNotification()">

📢 Send Test Notification

</button>


   

<button class="back"
onclick="location.href='admin.html'">

⬅ Back to Admin Dashboard

</button>



</div>


</div>
<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
getMessaging,
getToken
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";



const firebaseConfig = {

apiKey:
"AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

authDomain:
"skyrent-ea30c.firebaseapp.com",

projectId:
"skyrent-ea30c",

storageBucket:
"skyrent-ea30c.firebasestorage.app",

messagingSenderId:
"572678456448",

appId:
"1:572678456448:web:6b7132351515742dd09265"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const messaging =
getMessaging(app);



const ADMIN_UID =
"28zzG9NB46gRkwia7WtOxS1lQNa2";



const VAPID_KEY =
"BC390oYXhlNUfxELpth0-roQQe_RubAfu_TupX0i0xN63GlEyXB69XQkpcPwtgUY6h35rZMVy83QIbjxxRFR-Ds";



let adminUser = null;



function setStatus(message,type=""){

const status =
document.getElementById("status");

status.textContent =
message;

status.className =
"status "+type;

}





async function checkStatus(){


try{


const ref =
doc(
db,
"admins",
ADMIN_UID
);



const snap =
await getDoc(ref);



if(snap.exists()){


const data =
snap.data();



if(
data.notificationEnabled === true &&
data.notificationToken
){


setStatus(
"🔔 Notifications are already enabled",
"success"
);



document.getElementById(
"enableButton"
).textContent =
"✅ Notifications Enabled";


return;


}


}



setStatus(
"✅ Admin account verified",
"success"
);



}
catch(error){


console.log(error);


setStatus(
"❌ "+error.message,
"error"
);


}



}






onAuthStateChanged(
auth,
(user)=>{


console.log(
"LOGIN USER:",
user
);



if(!user){


setStatus(
"❌ No admin login",
"error"
);


return;


}




if(user.uid !== ADMIN_UID){


setStatus(
"❌ Access denied",
"error"
);


return;


}




adminUser = user;



checkStatus();



}

);








window.enableNotifications = async function(){



if(!adminUser){


alert(
"Please wait for admin verification"
);


return;


}




const loading =
document.getElementById(
"loading"
);


const button =
document.getElementById(
"enableButton"
);



loading.style.display =
"block";


button.disabled =
true;



try{


if(!("Notification" in window)){


throw new Error(
"Browser notification not supported"
);


}




let permission =
await Notification.requestPermission();



if(permission !== "granted"){


throw new Error(
"Notification permission denied"
);


}





const registration =
await navigator.serviceWorker.register(
"/firebase-messaging-sw.js"
);



await navigator.serviceWorker.ready;






const token =
await getToken(

messaging,

{

vapidKey:VAPID_KEY,

serviceWorkerRegistration:
registration

}

);






if(!token){


throw new Error(
"Token generation failed"
);


}






await setDoc(

doc(
db,
"admins",
ADMIN_UID
),

{


notificationToken:
token,


notificationEnabled:
true,


updatedAt:
serverTimestamp()


},


{

merge:true

}


);






setStatus(

"🔔 Notifications enabled successfully",

"success"

);



button.textContent =
"✅ Notifications Enabled";



alert(
"SkyRent admin notifications enabled"
);



}

catch(error){


console.error(
error
);



setStatus(
"❌ "+error.message,
"error"
);



}

finally{


loading.style.display =
"none";


button.disabled =
false;


}



};


window.sendTestNotification = async function(){

try{


const adminRef =
doc(
db,
"admins",
ADMIN_UID
);


const adminSnap =
await getDoc(adminRef);



if(!adminSnap.exists()){

alert(
"No admin notification record found"
);

return;

}



const data =
adminSnap.data();



if(!data.notificationToken){

alert(
"No notification token found"
);

return;

}



alert(
"Test request ready. Next step is connecting Firebase Cloud Messaging sender."
);



}
catch(error){

console.error(error);

alert(
error.message
);

}


};

   

</script>


</body>

</html>
