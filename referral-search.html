<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SkyRent Admin - Referral Search</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0757c9,#1688f5);
    color:white;
    padding:18px 16px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.header h1{
    font-size:21px;
}

.header p{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.back-btn{
    border:0;
    background:rgba(255,255,255,.18);
    color:white;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
}

/* MAIN */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

/* SEARCH CARD */

.search-card{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
    margin-bottom:14px;
}

.search-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.search-row{
    display:flex;
    gap:9px;
}

.search-input{
    flex:1;
    border:1px solid #dce3ed;
    background:white;
    padding:13px 15px;
    border-radius:11px;
    font-size:14px;
    outline:none;
}

.search-input:focus{
    border-color:#1688f5;
}

.search-button{
    border:0;
    background:#0757c9;
    color:white;
    padding:0 20px;
    border-radius:11px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.search-button:active{
    transform:scale(.97);
}

/* SUMMARY */

.summary{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.summary-label{
    color:#718096;
    font-size:12px;
}

.summary-code{
    color:#0757c9;
    font-size:15px;
    font-weight:bold;
    margin-top:3px;
}

.summary-count{
    color:#0757c9;
    font-size:27px;
    font-weight:bold;
}

/* USER */

.user-card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
}

.user-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.user-name{
    font-size:15px;
    font-weight:bold;
}

.user-phone{
    font-size:12px;
    color:#718096;
    margin-top:3px;
}

.user-number{
    background:#eaf4ff;
    color:#0757c9;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
    height:max-content;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.info-item{
    background:#f7f9fc;
    padding:10px;
    border-radius:9px;
}

.info-label{
    color:#7b8798;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:4px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    word-break:break-word;
}

/* REFERRAL CODES */

.code-card{
    background:white;
    border-radius:15px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
    overflow:hidden;
    margin-top:15px;
}

.code-title{
    padding:15px;
    font-size:15px;
    font-weight:bold;
    border-bottom:1px solid #edf0f5;
}

.code-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 15px;
    border-bottom:1px solid #edf0f5;
    cursor:pointer;
}

.code-item:last-child{
    border-bottom:0;
}

.code-item:hover{
    background:#f7fbff;
}

.code{
    font-size:14px;
    font-weight:bold;
    color:#0757c9;
}

.code-users{
    color:#718096;
    font-size:11px;
    margin-top:3px;
}

.code-arrow{
    color:#0757c9;
    font-size:20px;
}

/* EMPTY */

.empty{
    background:white;
    border-radius:15px;
    padding:30px 15px;
    text-align:center;
    color:#718096;
    font-size:14px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
}

.empty-icon{
    font-size:34px;
    margin-bottom:8px;
}

/* LOADING */

.loading{
    padding:30px 15px;
    text-align:center;
    color:#718096;
    font-size:13px;
}

.spinner{
    width:25px;
    height:25px;
    border:3px solid #dcecff;
    border-top-color:#0757c9;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ACCESS */

.access{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
}

.access-box{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.1);
    max-width:380px;
}

.access-box h2{
    color:#c62828;
    margin-bottom:8px;
}

.access-box p{
    color:#718096;
    font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .search-row{
        flex-direction:column;
    }

    .search-button{
        height:46px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>


<!-- ACCESS DENIED -->

<div
    class="access"
    id="accessDenied"
>

    <div class="access-box">

        <h2>Access Denied</h2>

        <p>
            Your account is not authorized
            to access this administrator page.
        </p>

    </div>

</div>



<!-- MAIN -->

<div id="mainPage" style="display:none;">


<header class="header">

    <div class="header-row">

        <div>

            <h1>
                🔗 Referral Search
            </h1>

            <p>
                Find members using a referral code
            </p>

        </div>


        <button
            class="back-btn"
            id="backBtn"
        >
            ← Members
        </button>

    </div>

</header>



<main class="container">


    <!-- SEARCH -->

    <div class="search-card">

        <div class="search-title">
            Search Referral Code
        </div>


        <div class="search-row">

            <input
                type="text"
                id="referralInput"
                class="search-input"
                placeholder="Enter referral code..."
                autocomplete="off"
            >


            <button
                class="search-button"
                id="searchButton"
            >
                🔍 Search
            </button>

        </div>

    </div>



    <!-- SUMMARY -->

    <div
        class="summary"
        id="summary"
        style="display:none;"
    >

        <div>

            <div class="summary-label">
                Referral Code
            </div>

            <div
                class="summary-code"
                id="searchedCode"
            >
                -
            </div>

        </div>


        <div>

            <div class="summary-label">
                Users
            </div>

            <div
                class="summary-count"
                id="resultCount"
            >
                0
            </div>

        </div>

    </div>



    <!-- RESULTS -->

    <div id="results">

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            Enter a referral code to search.

        </div>

    </div>



    <!-- ALL CODES -->

    <div class="code-card">

        <div class="code-title">
            📋 Referral Codes In Use
        </div>


        <div id="codeList">

            <div class="loading">

                <div class="spinner"></div>

                Loading referral codes...

            </div>

        </div>

    </div>


</main>

</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
   SAME AS YOUR WORKING MEMBERS PAGE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};



/* =====================================================
   ADMIN UID
   SAME AS MEMBERS PAGE
===================================================== */

const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";



/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =====================================================
   ELEMENTS
===================================================== */

const mainPage =
    document.getElementById("mainPage");

const accessDenied =
    document.getElementById("accessDenied");

const referralInput =
    document.getElementById("referralInput");

const searchButton =
    document.getElementById("searchButton");

const results =
    document.getElementById("results");

const summary =
    document.getElementById("summary");

const resultCount =
    document.getElementById("resultCount");

const searchedCode =
    document.getElementById("searchedCode");

const codeList =
    document.getElementById("codeList");



/* =====================================================
   USERS
===================================================== */

let allUsers = [];



/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        console.log(
            "Current Firebase user:",
            user
        );


        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        console.log(
            "Current UID:",
            user.uid
        );


        if(user.uid !== ADMIN_UID){

            alert(
                "Access denied.\n\nUID:\n" +
                user.uid
            );

            window.location.href =
                "dashboard.html";

            return;

        }


        mainPage.style.display =
            "block";


        await loadUsers();

    }
);



/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    try{

        codeList.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Loading referral codes...

            </div>

        `;


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allUsers = [];


        snapshot.forEach(
            doc => {

                allUsers.push({

                    id:doc.id,

                    ...doc.data()

                });

            }
        );


        renderReferralCodes();


    }catch(error){

        console.error(
            "Load users error:",
            error
        );


        codeList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                Unable to load referral data.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* =====================================================
   GET USED REFERRAL CODE
===================================================== */

function getUsedReferralCode(user){

    return (

        user.referredByCode ||

        user.referredBy ||

        user.referrerCode ||

        user.referralFrom ||

        user.usedReferralCode ||

        ""

    )
    .toString()
    .trim();

}



/* =====================================================
   GET USER'S OWN REFERRAL CODE
===================================================== */

function getUserReferralCode(user){

    return (

        user.referralCode ||

        user.referralID ||

        user.referralId ||

        user.referral ||

        ""

    )
    .toString()
    .trim();

}



/* =====================================================
   REFERRAL CODE LIST
===================================================== */

function renderReferralCodes(){

    const counts = {};


    allUsers.forEach(
        user => {

            const code =
                getUsedReferralCode(user);


            if(!code)
                return;


            const normalized =
                code.toUpperCase();


            if(!counts[normalized]){

                counts[normalized] = 0;

            }


            counts[normalized]++;

        }
    );


    const codes =
        Object.keys(counts)
        .sort();


    if(!codes.length){

        codeList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔗
                </div>

                No used referral codes found.

            </div>

        `;

        return;

    }


    codeList.innerHTML =
        codes.map(
            code => `

                <div
                    class="code-item"
                    data-code="${escapeHTML(code)}"
                >

                    <div>

                        <div class="code">
                            ${escapeHTML(code)}
                        </div>

                        <div class="code-users">

                            ${counts[code]}
                            user${counts[code] === 1 ? "" : "s"}

                        </div>

                    </div>


                    <div class="code-arrow">
                        ›
                    </div>

                </div>

            `
        )
        .join("");


    document
        .querySelectorAll(".code-item")
        .forEach(
            item => {

                item.addEventListener(
                    "click",
                    () => {

                        referralInput.value =
                            item.dataset.code;

                        searchReferral();

                    }
                );

            }
        );

}



/* =====================================================
   SEARCH BUTTON
===================================================== */

searchButton.addEventListener(
    "click",
    searchReferral
);



/* =====================================================
   ENTER KEY
===================================================== */

referralInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            searchReferral();

        }

    }
);



/* =====================================================
   SEARCH REFERRAL
===================================================== */

function searchReferral(){

    const code =
        referralInput.value
        .trim()
        .toUpperCase();


    if(!code){

        summary.style.display =
            "none";


        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                Enter a referral code to search.

            </div>

        `;

        return;

    }


    const matchedUsers =
        allUsers.filter(
            user => {

                return (
                    getUsedReferralCode(user)
                    .toUpperCase() === code
                );

            }
        );


    summary.style.display =
        "flex";


    searchedCode.textContent =
        code;


    resultCount.textContent =
        matchedUsers.length;


    if(!matchedUsers.length){

        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👤
                </div>

                No users found using

                <strong>
                    ${escapeHTML(code)}
                </strong>

            </div>

        `;

        return;

    }


    results.innerHTML =
        matchedUsers
        .map(
            (user,index) =>
                createUserCard(
                    user,
                    index + 1
                )
        )
        .join("");

}



/* =====================================================
   USER CARD
===================================================== */

function createUserCard(
    user,
    index
){

    const name =
        user.name ||
        user.fullName ||
        user.displayName ||
        "Unnamed User";


    const phone =
        user.phone ||
        user.mobile ||
        user.phoneNumber ||
        "-";


    const ownCode =
        getUserReferralCode(user) ||
        "-";


    const balance =
        Number(
            user.balance || 0
        );


    const created =
        formatDate(
            user.createdAt
        );


    return `

        <div class="user-card">

            <div class="user-header">

                <div>

                    <div class="user-name">

                        ${escapeHTML(name)}

                    </div>

                    <div class="user-phone">

                        ${escapeHTML(phone)}

                    </div>

                </div>


                <div class="user-number">

                    #${index}

                </div>

            </div>


            <div class="info-grid">


                <div class="info-item">

                    <div class="info-label">
                        User Referral Code
                    </div>

                    <div class="info-value">
                        ${escapeHTML(ownCode)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        Used Referral Code
                    </div>

                    <div class="info-value">
                        ${escapeHTML(
                            getUsedReferralCode(user) || "-"
                        )}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        Available Balance
                    </div>

                    <div class="info-value">

                        ₱${balance.toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        Registered
                    </div>

                    <div class="info-value">
                        ${escapeHTML(created)}
                    </div>

                </div>


            </div>

        </div>

    `;

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value)
        return "-";


    try{

        let date;


        if(
            typeof value === "object" &&
            typeof value.toDate === "function"
        ){

            date =
                value.toDate();

        }else if(
            typeof value === "object" &&
            typeof value.seconds === "number"
        ){

            date =
                new Date(
                    value.seconds * 1000
                );

        }else{

            date =
                new Date(value);

        }


        if(
            isNaN(date.getTime())
        ){

            return "-";

        }


        return date.toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "-";

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =====================================================
   BACK TO MEMBERS
===================================================== */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "members.html";

        }
    );


</script>

</body>
</html>
