<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Admin - Members</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#0757c9,#1688f5);
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.header h1{
    font-size:21px;
}

.header p{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.back-btn{
    border:0;
    background:rgba(255,255,255,.18);
    color:white;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
}

/* MAIN */
.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* SUMMARY */
.summary{
    background:white;
    border-radius:15px;
    padding:17px;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
    margin-bottom:14px;
}

.summary-label{
    font-size:13px;
    color:#718096;
}

.summary-count{
    font-size:29px;
    font-weight:bold;
    color:#0757c9;
    margin-top:4px;
}

/* SEARCH */
.search-box{
    position:relative;
    margin-bottom:12px;
}

.search-box input{
    width:100%;
    border:1px solid #dce3ed;
    background:white;
    padding:13px 15px;
    border-radius:11px;
    font-size:14px;
    outline:none;
}

.search-box input:focus{
    border-color:#1688f5;
}

/* MEMBER LIST */
.member-list{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 14px rgba(20,40,80,.07);
}

.list-header{
    padding:14px 15px;
    border-bottom:1px solid #edf0f5;
    font-weight:bold;
    font-size:15px;
}

.member-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 15px;
    border-bottom:1px solid #edf0f5;
    cursor:pointer;
    transition:.15s;
}

.member-row:last-child{
    border-bottom:0;
}

.member-row:hover{
    background:#f7fbff;
}

.member-info{
    min-width:0;
}

.member-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.member-phone{
    font-size:12px;
    color:#718096;
    margin-top:3px;
}

.view-btn{
    flex-shrink:0;
    border:0;
    background:#eaf4ff;
    color:#0757c9;
    padding:8px 11px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

/* LOADING */
.loading{
    padding:35px 15px;
    text-align:center;
    color:#718096;
    font-size:14px;
}

.spinner{
    width:25px;
    height:25px;
    border:3px solid #dcecff;
    border-top-color:#0757c9;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.empty{
    padding:30px 15px;
    text-align:center;
    color:#718096;
    font-size:14px;
}

/* DETAILS */
.details{
    display:none;
}

.details.show{
    display:block;
}

.detail-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

.detail-back{
    border:0;
    background:white;
    padding:9px 12px;
    border-radius:9px;
    color:#0757c9;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.detail-title{
    flex:1;
}

.detail-title h2{
    font-size:19px;
}

.detail-title p{
    font-size:12px;
    color:#718096;
    margin-top:3px;
}

/* CARDS */
.card{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 14px rgba(20,40,80,.06);
}

.card-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:12px;
    color:#172033;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.info-item{
    background:#f7f9fc;
    padding:10px;
    border-radius:9px;
    min-width:0;
}

.info-label{
    color:#7b8798;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:4px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    word-break:break-word;
}

/* COLLAPSIBLE SECTIONS */
.lazy-section{
    background:white;
    border-radius:14px;
    margin-bottom:10px;
    box-shadow:0 3px 14px rgba(20,40,80,.06);
    overflow:hidden;
}

.lazy-header{
    width:100%;
    border:0;
    background:white;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    text-align:left;
}

.lazy-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.lazy-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    background:#eaf4ff;
    color:#0757c9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.lazy-name{
    font-weight:bold;
    font-size:14px;
}

.lazy-count{
    color:#718096;
    font-size:11px;
    margin-top:2px;
}

.arrow{
    color:#718096;
    transition:.2s;
}

.lazy-section.open .arrow{
    transform:rotate(180deg);
}

.lazy-content{
    display:none;
    border-top:1px solid #edf0f5;
    padding:12px;
}

.lazy-section.open .lazy-content{
    display:block;
}

/* RECORDS */
.record{
    border:1px solid #e8edf4;
    border-radius:10px;
    padding:11px;
    margin-bottom:8px;
    background:#fafcff;
}

.record:last-child{
    margin-bottom:0;
}

.record-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.record-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.record-item{
    font-size:11px;
}

.record-label{
    color:#7b8798;
}

.record-value{
    margin-top:2px;
    font-weight:600;
    word-break:break-word;
}

.status{
    display:inline-block;
    padding:4px 7px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
}

.status-approved{
    background:#e8f8ef;
    color:#16834a;
}

.status-pending{
    background:#fff5dc;
    color:#9a6800;
}

.status-rejected{
    background:#ffe9e9;
    color:#c33;
}

.section-loading{
    padding:15px;
    text-align:center;
    color:#718096;
    font-size:12px;
}

.error{
    padding:12px;
    background:#fff0f0;
    color:#c33;
    border-radius:8px;
    font-size:12px;
}

/* MOBILE */
@media(max-width:600px){
    .container{
        padding:10px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .record-grid{
        grid-template-columns:1fr 1fr;
    }

    .member-row{
        padding:12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-row">
        <div>
            <h1>SkyRent Members</h1>
            <p>Member management</p>
        </div>

        <button class="back-btn" id="adminBtn">
            Admin
        </button>
    </div>
</header>

<main class="container">

    <!-- MEMBERS PAGE -->
    <div id="membersPage">

        <div class="summary">
            <div class="summary-label">Total Registered Members</div>
            <div class="summary-count" id="totalUsers">...</div>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search name or phone..."
                autocomplete="off"
            >
        </div>

        <div class="member-list">

            <div class="list-header">
                Members
            </div>

            <div id="membersList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading members...
                </div>
            </div>

        </div>

    </div>


    <!-- DETAILS PAGE -->
    <div id="detailsPage" class="details">

        <div class="detail-top">

            <button class="detail-back" id="backBtn">
                ← Back
            </button>

            <div class="detail-title">
                <h2 id="detailName">Member</h2>
                <p id="detailPhone"></p>
            </div>

        </div>


        <!-- ACCOUNT -->
        <div class="card">

            <div class="card-title">
                Account Information
            </div>

            <div class="info-grid" id="accountInfo"></div>

        </div>


        <!-- WITHDRAWAL ACCOUNT -->
        <div class="card">

            <div class="card-title">
                Withdrawal Account
            </div>

            <div class="info-grid" id="withdrawalInfo">

                <div class="info-item">

                    <div class="info-label">
                        Account
                    </div>

                    <div class="info-value">
                        No withdrawal account
                    </div>

                </div>

            </div>

        </div>


        <!-- DEPOSITS -->
        <div class="lazy-section" data-type="deposits">

            <button class="lazy-header">

                <div class="lazy-left">

                    <div class="lazy-icon">
                        ₱
                    </div>

                    <div>

                        <div class="lazy-name">
                            Deposits
                        </div>

                        <div class="lazy-count">
                            Tap to load deposit history
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    ▼
                </div>

            </button>

            <div class="lazy-content"></div>

        </div>


        <!-- WITHDRAWALS -->
        <div class="lazy-section" data-type="withdrawals">

            <button class="lazy-header">

                <div class="lazy-left">

                    <div class="lazy-icon">
                        ↗
                    </div>

                    <div>

                        <div class="lazy-name">
                            Withdrawals
                        </div>

                        <div class="lazy-count">
                            Tap to load withdrawal history
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    ▼
                </div>

            </button>

            <div class="lazy-content"></div>

        </div>


        <!-- INVESTMENTS -->
        <div class="lazy-section" data-type="investments">

            <button class="lazy-header">

                <div class="lazy-left">

                    <div class="lazy-icon">
                        ✈
                    </div>

                    <div>

                        <div class="lazy-name">
                            Investments
                        </div>

                        <div class="lazy-count">
                            Tap to load investment history
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    ▼
                </div>

            </button>

            <div class="lazy-content"></div>

        </div>


        <!-- EARNINGS -->
        <div class="lazy-section" data-type="earnings">

            <button class="lazy-header">

                <div class="lazy-left">

                    <div class="lazy-icon">
                        ₱
                    </div>

                    <div>

                        <div class="lazy-name">
                            Earnings
                        </div>

                        <div class="lazy-count">
                            Tap to load earnings history
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    ▼
                </div>

            </button>

            <div class="lazy-content"></div>

        </div>

    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {
    apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",
    authDomain: "skyrent-ea30c.firebaseapp.com",
    projectId: "skyrent-ea30c",
    storageBucket: "skyrent-ea30c.firebasestorage.app",
    messagingSenderId: "572678456448",
    appId: "1:572678456448:web:6b7132351515742dd09265"
};

const ADMIN_UID = "28zzG9NB46gRkwia7WtOxS1lQNa2";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ================================
   VARIABLES
================================ */

let allUsers = [];
let currentUser = null;

const detailCache = new Map();


/* ================================
   ELEMENTS
================================ */

const totalUsers =
    document.getElementById("totalUsers");

const membersList =
    document.getElementById("membersList");

const searchInput =
    document.getElementById("searchInput");

const membersPage =
    document.getElementById("membersPage");

const detailsPage =
    document.getElementById("detailsPage");

const detailName =
    document.getElementById("detailName");

const detailPhone =
    document.getElementById("detailPhone");

const accountInfo =
    document.getElementById("accountInfo");

const withdrawalInfo =
    document.getElementById("withdrawalInfo");


/* ================================
   AUTH CHECK
================================ */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "index.html";
        return;
    }

    if (user.uid !== ADMIN_UID) {

        alert("Access denied.");
        window.location.href = "dashboard.html";
        return;
    }

    await loadUsers();

});


/* ================================
   LOAD USERS
================================ */

async function loadUsers(){

    try{

        membersList.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Loading members...
            </div>
        `;


        const snapshot =
            await getDocs(collection(db, "users"));


        allUsers = [];


        snapshot.forEach(doc => {

            allUsers.push({
                id: doc.id,
                ...doc.data()
            });

        });


        /* =========================================
           NEWEST REGISTRATION FIRST
           
           createdAt is the registration timestamp.
           Firebase Timestamp is handled by
           getDateValue() below.
           
           Members without createdAt are placed
           at the bottom.
        ========================================= */

        allUsers.sort((a, b) => {

            const dateA =
                getDateValue(a.createdAt);

            const dateB =
                getDateValue(b.createdAt);

            return dateB - dateA;

        });


        totalUsers.textContent =
            allUsers.length.toLocaleString();


        renderMembers(allUsers);


    }catch(error){

        console.error(error);

        membersList.innerHTML = `
            <div class="empty">
                Unable to load members.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* ================================
   RENDER MEMBERS
================================ */

function renderMembers(users){

    if(!users.length){

        membersList.innerHTML = `
            <div class="empty">
                No members found.
            </div>
        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    users.forEach(user => {

        const row =
            document.createElement("div");


        row.className = "member-row";


        const name =
            user.name ||
            user.fullName ||
            user.displayName ||
            "Unnamed User";


        const phone =
            user.phone ||
            user.mobile ||
            user.phoneNumber ||
            "No phone";


        row.innerHTML = `

            <div class="member-info">

                <div class="member-name">
                    ${escapeHTML(name)}
                </div>

                <div class="member-phone">
                    ${escapeHTML(phone)}
                </div>

            </div>

            <button class="view-btn">
                View
            </button>

        `;


        row.addEventListener("click", () => {

            openMember(user);

        });


        fragment.appendChild(row);

    });


    membersList.innerHTML = "";

    membersList.appendChild(fragment);

}


/* ================================
   SEARCH
================================ */

searchInput.addEventListener("input", () => {

    const term =
        searchInput.value
        .trim()
        .toLowerCase();


    if(!term){

        renderMembers(allUsers);

        return;

    }


    const filtered =
        allUsers.filter(user => {

            const name =
                String(
                    user.name ||
                    user.fullName ||
                    user.displayName ||
                    ""
                ).toLowerCase();


            const phone =
                String(
                    user.phone ||
                    user.mobile ||
                    user.phoneNumber ||
                    ""
                ).toLowerCase();


            return (
                name.includes(term) ||
                phone.includes(term)
            );

        });


    renderMembers(filtered);

});


/* ================================
   OPEN MEMBER
================================ */

async function openMember(user){

    currentUser = user;


    membersPage.style.display = "none";

    detailsPage.classList.add("show");


    window.scrollTo({
        top:0,
        behavior:"instant"
    });


    const name =
        user.name ||
        user.fullName ||
        user.displayName ||
        "Unnamed User";


    const phone =
        user.phone ||
        user.mobile ||
        user.phoneNumber ||
        "No phone";


    detailName.textContent = name;

    detailPhone.textContent = phone;


    renderAccount(user);

    renderWithdrawalAccount(user);

    resetLazySections();

}


/* ================================
   ACCOUNT INFORMATION
================================ */

function renderAccount(user){

    const ignored = [
        "withdrawalAccount"
    ];


    const fields = Object.entries(user)
        .filter(([key]) =>
            key !== "id" &&
            !ignored.includes(key)
        )
        .slice(0, 30);


    if(!fields.length){

        accountInfo.innerHTML = `
            <div class="info-item">
                <div class="info-value">
                    No account information.
                </div>
            </div>
        `;

        return;
    }


    accountInfo.innerHTML =
        fields.map(([key,value]) => `

            <div class="info-item">

                <div class="info-label">
                    ${escapeHTML(formatLabel(key))}
                </div>

                <div class="info-value">
                    ${escapeHTML(formatValue(value))}
                </div>

            </div>

        `).join("");

}


/* ================================
   WITHDRAWAL ACCOUNT
================================ */

function renderWithdrawalAccount(user){

    const account =
        user.withdrawalAccount;


    if(!account){

        withdrawalInfo.innerHTML = `

            <div class="info-item">

                <div class="info-label">
                    Withdrawal Account
                </div>

                <div class="info-value">
                    Not registered
                </div>

            </div>

        `;

        return;
    }


    if(typeof account === "object"){

        const entries =
            Object.entries(account);


        withdrawalInfo.innerHTML =
            entries.map(([key,value]) => `

                <div class="info-item">

                    <div class="info-label">
                        ${escapeHTML(formatLabel(key))}
                    </div>

                    <div class="info-value">
                        ${escapeHTML(formatValue(value))}
                    </div>

                </div>

            `).join("");

    }else{

        withdrawalInfo.innerHTML = `

            <div class="info-item">

                <div class="info-label">
                    Withdrawal Account
                </div>

                <div class="info-value">
                    ${escapeHTML(formatValue(account))}
                </div>

            </div>

        `;

    }

}


/* ================================
   RESET SECTIONS
================================ */

function resetLazySections(){

    document
        .querySelectorAll(".lazy-section")
        .forEach(section => {

            section.classList.remove("open");


            const content =
                section.querySelector(".lazy-content");


            content.innerHTML = "";


            const count =
                section.querySelector(".lazy-count");


            count.textContent =
                "Tap to load history";

        });

}


/* ================================
   LAZY SECTION CLICK
================================ */

document
    .querySelectorAll(".lazy-section")
    .forEach(section => {

        const button =
            section.querySelector(".lazy-header");


        button.addEventListener("click", async () => {

            const alreadyOpen =
                section.classList.contains("open");


            if(alreadyOpen){

                section.classList.remove("open");

                return;

            }


            section.classList.add("open");


            const type =
                section.dataset.type;


            await loadSection(
                section,
                type
            );

        });

    });


/* ================================
   LOAD SECTION
================================ */

async function loadSection(section,type){

    if(!currentUser)
        return;


    const content =
        section.querySelector(".lazy-content");


    const cacheKey =
        currentUser.id + "_" + type;


    if(detailCache.has(cacheKey)){

        renderRecords(
            content,
            detailCache.get(cacheKey),
            type
        );


        updateSectionCount(
            section,
            detailCache.get(cacheKey).length
        );


        return;

    }


    content.innerHTML = `
        <div class="section-loading">
            Loading ${escapeHTML(type)}...
        </div>
    `;


    try{

        const records =
            await getUserRecords(
                type,
                currentUser.id
            );


        detailCache.set(
            cacheKey,
            records
        );


        renderRecords(
            content,
            records,
            type
        );


        updateSectionCount(
            section,
            records.length
        );


    }catch(error){

        console.error(error);


        content.innerHTML = `
            <div class="error">
                Unable to load ${escapeHTML(type)}.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* ================================
   GET USER RECORDS
================================ */

async function getUserRecords(
    type,
    uid
){

    const collectionName =
        type;


    let snapshot =
        await getDocs(
            query(
                collection(db, collectionName),
                where("userId","==",uid)
            )
        );


    let records =
        snapshot.docs.map(doc => ({
            id:doc.id,
            ...doc.data()
        }));


    if(records.length === 0){

        snapshot =
            await getDocs(
                query(
                    collection(db, collectionName),
                    where("uid","==",uid)
                )
            );


        records =
            snapshot.docs.map(doc => ({
                id:doc.id,
                ...doc.data()
            }));

    }


    return records;

}


/* ================================
   UPDATE COUNT
================================ */

function updateSectionCount(
    section,
    count
){

    const element =
        section.querySelector(".lazy-count");


    element.textContent =
        count === 1
        ? "1 record"
        : `${count} records`;

}


/* ================================
   RENDER RECORDS
================================ */

function renderRecords(
    container,
    records,
    type
){

    if(!records.length){

        container.innerHTML = `
            <div class="empty">
                No ${escapeHTML(type)}
                found for this member.
            </div>
        `;

        return;

    }


    records.sort((a,b) => {

        const da =
            getDateValue(a.createdAt);


        const db =
            getDateValue(b.createdAt);


        return db - da;

    });


    container.innerHTML =
        records.map((record,index) => {

            const entries =
                Object.entries(record)
                .filter(([key]) =>
                    key !== "id" &&
                    key !== "userId" &&
                    key !== "uid"
                )
                .slice(0, 12);


            const title =
                getRecordTitle(
                    record,
                    type,
                    index
                );


            return `

                <div class="record">

                    <div class="record-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="record-grid">

                        ${entries.map(
                            ([key,value]) => `

                            <div class="record-item">

                                <div class="record-label">
                                    ${escapeHTML(
                                        formatLabel(key)
                                    )}
                                </div>

                                <div class="record-value">
                                    ${formatRecordValue(
                                        key,
                                        value
                                    )}
                                </div>

                            </div>

                        `).join("")}

                    </div>

                </div>

            `;

        }).join("");

}


/* ================================
   RECORD TITLE
================================ */

function getRecordTitle(
    record,
    type,
    index
){

    if(type === "investments"){

        return (
            record.planName ||
            record.planId ||
            record.name ||
            `Investment #${index + 1}`
        );

    }


    if(type === "deposits"){

        return (
            record.amount
            ? `Deposit ₱${formatNumber(record.amount)}`
            : `Deposit #${index + 1}`
        );

    }


    if(type === "withdrawals"){

        return (
            record.amount
            ? `Withdrawal ₱${formatNumber(record.amount)}`
            : `Withdrawal #${index + 1}`
        );

    }


    if(type === "earnings"){

        return (
            record.amount
            ? `Earning ₱${formatNumber(record.amount)}`
            : `Earning #${index + 1}`
        );

    }


    return `Record #${index + 1}`;

}


/* ================================
   FORMAT RECORD VALUE
================================ */

function formatRecordValue(
    key,
    value
){

    const lower =
        key.toLowerCase();


    if(
        lower === "status"
    ){

        const status =
            String(value)
            .toLowerCase();


        let className =
            "status-pending";


        if(
            status === "approved" ||
            status === "active" ||
            status === "completed"
        ){

            className =
                "status-approved";

        }


        if(
            status === "rejected" ||
            status === "cancelled"
        ){

            className =
                "status-rejected";

        }


        return `
            <span class="status ${className}">
                ${escapeHTML(String(value))}
            </span>
        `;

    }


    return escapeHTML(
        formatValue(value)
    );

}


/* ================================
   FORMAT LABEL
================================ */

function formatLabel(key){

    return String(key)
        .replace(/([A-Z])/g," $1")
        .replace(/[_-]/g," ")
        .replace(/\s+/g," ")
        .trim()
        .replace(/^./,char => char.toUpperCase());

}


/* ================================
   FORMAT VALUE
================================ */

function formatValue(value){

    if(
        value === null ||
        value === undefined
    ){

        return "-";

    }


    if(typeof value === "object"){

        if(
            typeof value.toDate === "function"
        ){

            return value
                .toDate()
                .toLocaleString();

        }


        return JSON.stringify(value);

    }


    return String(value);

}


/* ================================
   DATE VALUE
================================ */

function getDateValue(value){

    if(!value)
        return 0;


    /*
     * Firebase Timestamp
     */
    if(
        typeof value === "object" &&
        typeof value.toDate === "function"
    ){

        return value.toDate().getTime();

    }


    /*
     * Firebase Timestamp-like object
     */
    if(
        typeof value === "object" &&
        typeof value.seconds === "number"
    ){

        return value.seconds * 1000;

    }


    /*
     * JavaScript Date
     */
    if(value instanceof Date){

        return value.getTime();

    }


    /*
     * String / number date
     */
    const date =
        new Date(value);


    return isNaN(date.getTime())
        ? 0
        : date.getTime();

}


/* ================================
   NUMBER
================================ */

function formatNumber(value){

    const number =
        Number(value);


    if(isNaN(number))
        return String(value);


    return number.toLocaleString(
        "en-PH",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
