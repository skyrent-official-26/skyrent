<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


/* =========================================================
   INITIALIZE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   ADMIN UID
========================================================= */

const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentAdmin = null;

let allMembers = [];

let memberDataCache = {};


/* =========================================================
   NORMAL LOADING
========================================================= */

function showLoading(text){

    const element =
        document.getElementById("pageLoading");

    if(!element){
        return;
    }

    element.textContent =
        "⏳ " +
        (text || "Loading...");

    element.classList.add("show");

}


function hideLoading(){

    const element =
        document.getElementById("pageLoading");

    if(!element){
        return;
    }

    element.classList.remove("show");

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* =========================================================
   NUMBER
========================================================= */

function getNumber(value){

    if(
        value === null ||
        value === undefined
    ){
        return 0;
    }

    return Number(
        String(value)
            .replace(/[₱,\s]/g,"")
    ) || 0;

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(amount){

    return "₱" +
        Number(amount || 0).toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function normalizePhone(phone){

    let value =
        String(phone || "")
            .trim()
            .replace(/[^\d+]/g,"");

    if(value.startsWith("+63")){
        return value.substring(1);
    }

    if(value.startsWith("63")){
        return value;
    }

    if(value.startsWith("0")){
        return "63" + value.substring(1);
    }

    return value;

}


/* =========================================================
   USER HELPERS
========================================================= */

function getPhone(user){

    return (
        user?.phone ||
        user?.mobile ||
        user?.phoneNumber ||
        ""
    );

}


function getName(user){

    return (
        user?.name ||
        user?.displayName ||
        "SkyRent Member"
    );

}


/* =========================================================
   DATE HELPERS
========================================================= */

function getDateValue(data){

    if(!data){
        return null;
    }

    return (
        data.createdAt ||
        data.created_at ||
        data.timestamp ||
        data.date ||
        data.requestedAt ||
        data.time ||
        null
    );

}


function formatDate(data){

    const value =
        getDateValue(data);

    if(!value){
        return "Date not available";
    }

    try{

        if(
            typeof value === "object" &&
            typeof value.toDate === "function"
        ){

            return value
                .toDate()
                .toLocaleString();

        }

        const date =
            new Date(value);

        if(!isNaN(date.getTime())){

            return date.toLocaleString();

        }

    }
    catch(error){}

    return String(value);

}


/* =========================================================
   STATUS HELPERS
========================================================= */

function getStatus(data){

    return String(
        data?.status || ""
    )
    .trim()
    .toLowerCase();

}


function isRejectedStatus(status){

    const s =
        String(status || "")
            .trim()
            .toLowerCase();

    return [
        "rejected",
        "cancelled",
        "canceled",
        "declined"
    ].includes(s);

}


function isApprovedDeposit(data){

    const status =
        getStatus(data);

    return (
        data?.approved === true ||
        data?.credited === true ||
        status === "approved" ||
        status === "deposit successful" ||
        status === "successful" ||
        status === "completed"
    );

}


function isApprovedWithdrawal(data){

    const status =
        getStatus(data);

    return (
        status === "approved" ||
        status === "withdrawal successful" ||
        status === "successful" ||
        status === "completed"
    );

}


/* =========================================================
   TRANSACTION AMOUNT
========================================================= */

function getTransactionAmount(data){

    return getNumber(
        data?.amount ??
        data?.amountValue ??
        data?.netAmount ??
        0
    );

}


/* =========================================================
   INVESTMENT AMOUNT
========================================================= */

function getInvestmentAmount(data){

    return getNumber(
        data?.amount ??
        data?.investmentAmount ??
        data?.price ??
        data?.principal ??
        data?.capital ??
        0
    );

}


/* =========================================================
   ACTIVE INVESTMENT
========================================================= */

function isActiveInvestment(data){

    const status =
        getStatus(data);

    if(
        status === "active" ||
        status === "running" ||
        status === "approved" ||
        status === "ongoing"
    ){
        return true;
    }

    if(
        status === "completed" ||
        status === "expired" ||
        status === "closed" ||
        status === "cancelled" ||
        status === "canceled" ||
        status === "rejected"
    ){
        return false;
    }

    if(data?.active === true){
        return true;
    }

    return false;

}


/* =========================================================
   GET MEMBER RECORDS
========================================================= */

async function getMemberRecords(user){

    const uid =
        user.uid;

    /* =====================================================
       DEPOSITS
    ===================================================== */

    let deposits = [];

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"deposits"),
                    where(
                        "userId",
                        "==",
                        uid
                    )
                )
            );

        snapshot.forEach(
            snap => {

                deposits.push({
                    id:snap.id,
                    ...snap.data()
                });

            }
        );

    }
    catch(error){

        console.error(
            "Deposit records error:",
            error
        );

    }


    /* =====================================================
       WITHDRAWALS
    ===================================================== */

    let withdrawals = [];

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"withdrawals"),
                    where(
                        "uid",
                        "==",
                        uid
                    )
                )
            );

        snapshot.forEach(
            snap => {

                withdrawals.push({
                    id:snap.id,
                    ...snap.data()
                });

            }
        );

    }
    catch(error){

        console.error(
            "Withdrawal records error:",
            error
        );

    }


    /* =====================================================
       WITHDRAWAL FALLBACK userId
    ===================================================== */

    if(withdrawals.length === 0){

        try{

            const snapshot =
                await getDocs(
                    query(
                        collection(db,"withdrawals"),
                        where(
                            "userId",
                            "==",
                            uid
                        )
                    )
                );

            snapshot.forEach(
                snap => {

                    withdrawals.push({
                        id:snap.id,
                        ...snap.data()
                    });

                }
            );

        }
        catch(error){

            console.log(
                "No userId withdrawal records."
            );

        }

    }


    /* =====================================================
       EARNINGS
    ===================================================== */

    let earnings = [];

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"earnings"),
                    where(
                        "userId",
                        "==",
                        uid
                    )
                )
            );

        snapshot.forEach(
            snap => {

                earnings.push({
                    id:snap.id,
                    ...snap.data()
                });

            }
        );

    }
    catch(error){

        console.error(
            "Earnings records error:",
            error
        );

    }


    /* =====================================================
       INVESTMENTS
    ===================================================== */

    let investments = [];

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"investments"),
                    where(
                        "userId",
                        "==",
                        uid
                    )
                )
            );

        snapshot.forEach(
            snap => {

                investments.push({
                    id:snap.id,
                    ...snap.data()
                });

            }
        );

    }
    catch(error){

        console.log(
            "userId investment query failed."
        );

    }


    /* =====================================================
       INVESTMENT UID FALLBACK
    ===================================================== */

    if(investments.length === 0){

        try{

            const snapshot =
                await getDocs(
                    query(
                        collection(db,"investments"),
                        where(
                            "uid",
                            "==",
                            uid
                        )
                    )
                );

            snapshot.forEach(
                snap => {

                    investments.push({
                        id:snap.id,
                        ...snap.data()
                    });

                }
            );

        }
        catch(error){

            console.log(
                "No uid investment records."
            );

        }

    }


    /* =====================================================
       TOTAL DEPOSIT
    ===================================================== */

    let totalDeposit = 0;

    deposits.forEach(
        deposit => {

            if(
                isApprovedDeposit(deposit)
            ){

                totalDeposit +=
                    getTransactionAmount(
                        deposit
                    );

            }

        }
    );


    /* =====================================================
       TOTAL WITHDRAWAL
    ===================================================== */

    let totalWithdrawal = 0;

    withdrawals.forEach(
        withdrawal => {

            if(
                isApprovedWithdrawal(
                    withdrawal
                )
            ){

                totalWithdrawal +=
                    getTransactionAmount(
                        withdrawal
                    );

            }

        }
    );


    /* =====================================================
       TOTAL INVESTMENT
    ===================================================== */

    let totalInvestment = 0;

    investments.forEach(
        investment => {

            totalInvestment +=
                getInvestmentAmount(
                    investment
                );

        }
    );


    /* =====================================================
       ACTIVE INVESTMENTS
    ===================================================== */

    let activeInvestments = 0;

    investments.forEach(
        investment => {

            if(
                isActiveInvestment(
                    investment
                )
            ){

                activeInvestments++;

            }

        }
    );


    /* =====================================================
       TOTAL EARNINGS
    ===================================================== */

    let totalEarnings = 0;

    earnings.forEach(
        earning => {

            totalEarnings +=
                getNumber(
                    earning.amount
                );

        }
    );


    /* =====================================================
       REGISTRATION BONUS
    ===================================================== */

    const registrationBonus =
        getNumber(user.bonus);

    totalEarnings +=
        registrationBonus;


    return {

        deposits,
        withdrawals,
        earnings,
        investments,

        totalDeposit,
        totalWithdrawal,
        totalInvestment,
        activeInvestments,
        totalEarnings

/* =========================================================
   LOAD MEMBERS
========================================================= */

async function loadMembers(){

    if(
        !currentAdmin ||
        currentAdmin.uid !== ADMIN_UID
    ){
        return;
    }

    showLoading(
        "Loading registered members..."
    );


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allMembers = [];


        snapshot.forEach(
            snap => {

                allMembers.push({

                    uid:snap.id,
                    ...snap.data()

                });

            }
        );


        /* =================================================
           NEWEST FIRST
        ================================================= */

        allMembers.sort(
            (a,b) => {

                const dateA =
                    getDateValue(a);

                const dateB =
                    getDateValue(b);

                if(!dateA && !dateB){
                    return 0;
                }

                if(!dateA){
                    return 1;
                }

                if(!dateB){
                    return -1;
                }

                try{

                    const timeA =
                        dateA?.toDate
                        ? dateA.toDate().getTime()
                        : new Date(dateA).getTime();

                    const timeB =
                        dateB?.toDate
                        ? dateB.toDate().getTime()
                        : new Date(dateB).getTime();

                    return timeB - timeA;

                }
                catch(error){

                    return 0;

                }

            }
        );


        document.getElementById(
            "totalMembers"
        ).textContent =
            allMembers.length;


        const list =
            document.getElementById(
                "membersList"
            );


        if(allMembers.length === 0){

            list.innerHTML = `

                <div class="empty">

                    No registered members found.

                </div>

            `;

            hideLoading();

            return;

        }


        list.innerHTML = "";


        /* =================================================
           LOAD EACH MEMBER'S RECORDS
        ================================================= */

        for(
            let i = 0;
            i < allMembers.length;
            i++
        ){

            const user =
                allMembers[i];

            try{

                const records =
                    await getMemberRecords(
                        user
                    );

                memberDataCache[user.uid] =
                    records;

            }
            catch(error){

                memberDataCache[user.uid] = {

                    activeInvestments:
                        Number(
                            user.activeInvestments
                        ) || 0

                };

            }


            list.innerHTML +=
                createMemberCard(
                    user,
                    i
                );

        }


        hideLoading();


        const status =
            document.getElementById(
                "adminStatus"
            );

        if(status){

            status.textContent =
                "Members loaded: " +
                allMembers.length;

        }

    }
    catch(error){

        console.error(
            "Load members error:",
            error
        );


        document.getElementById(
            "membersList"
        ).innerHTML = `

            <div class="error">

                ❌ Unable to load members.

                <br><br>

                Please check your Firebase
                connection and Firestore rules.

            </div>

        `;

        hideLoading();

    }

}

/* =========================================================
   SEARCH MEMBER
========================================================= */

window.searchMember =
    async function(){

        const input =
            document.getElementById(
                "phoneSearch"
            );

        const value =
            input.value.trim();

        const target =
            normalizePhone(value);

        const result =
            document.getElementById(
                "searchResult"
            );


        if(!target){

            result.innerHTML = `

                <div class="error">

                    Please enter a phone number.

                </div>

            `;

            return;

        }


        showLoading(
            "Searching member..."
        );


        try{

            /* =============================================
               SEARCH LOADED MEMBERS FIRST
            ============================================= */

            let user =
                allMembers.find(
                    member => {

                        return (
                            normalizePhone(
                                getPhone(member)
                            ) === target
                        );

                    }
                );


            /* =============================================
               FIREBASE EXACT SEARCH
            ============================================= */

            if(!user){

                try{

                    const snapshot =
                        await getDocs(
                            query(
                                collection(
                                    db,
                                    "users"
                                ),
                                where(
                                    "phone",
                                    "==",
                                    value
                                )
                            )
                        );


                    if(!snapshot.empty){

                        const snap =
                            snapshot.docs[0];

                        user = {

                            uid:snap.id,
                            ...snap.data()

                        };

                    }

                }
                catch(error){

                    console.log(
                        "Exact phone query failed."
                    );

                }

            }


            /* =============================================
               PHONE VARIATIONS
            ============================================= */

            if(!user){

                const variations = [

                    value,
                    "+" + target,
                    target,
                    "0" +
                    target.substring(2)

                ];


                for(
                    const phoneVariation
                    of variations
                ){

                    try{

                        const snapshot =
                            await getDocs(
                                query(
                                    collection(
                                        db,
                                        "users"
                                    ),
                                    where(
                                        "phone",
                                        "==",
                                        phoneVariation
                                    )
                                )
                            );


                        if(!snapshot.empty){

                            const snap =
                                snapshot.docs[0];

                            user = {

                                uid:snap.id,
                                ...snap.data()

                            };

                            break;

                        }

                    }
                    catch(error){}

                }

            }


            /* =============================================
               NOT FOUND
            ============================================= */

            if(!user){

                result.innerHTML = `

                    <div class="error">

                        ❌ No member found for:

                        <br><br>

                        <strong>
                            ${escapeHTML(value)}
                        </strong>

                    </div>

                `;

                hideLoading();

                return;

            }


            /* =============================================
               LOAD RECORDS
            ============================================= */

            const stats =
                await getMemberRecords(
                    user
                );


            memberDataCache[user.uid] =
                stats;


            result.innerHTML =
                createFullMemberRecord(
                    user,
                    stats
                );


            hideLoading();


            result.scrollIntoView({

                behavior:"smooth",
                block:"start"

            });

        }
        catch(error){

            console.error(
                "Search member error:",
                error
            );


            result.innerHTML = `

                <div class="error">

                    ❌ Unable to search member.

                    <br><br>

                    ${escapeHTML(
                        error.message ||
                        "Firebase error"
                    )}

                </div>

            `;

            hideLoading();

        }

    };

        getDateValue(a);

    const dateB =
        getDateValue(b);

    if(!dateA && !dateB){
        return 0;
    }

    if(!dateA){
        return 1;
    }

    if(!dateB){
        return -1;
    }

    try{

        const timeA =
            dateA?.toDate
            ? dateA.toDate().getTime()
            : new Date(dateA).getTime();

        const timeB =
            dateB?.toDate
            ? dateB.toDate().getTime()
            : new Date(dateB).getTime();

        return timeB - timeA;

    }
    catch(error){

        return 0;

    }

}


/* =========================================================
   STATUS DISPLAY
========================================================= */

function getDisplayStatus(status){

    if(!status){
        return "Pending";
    }

    return String(status)
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}


function getStatusClass(status){

    const s =
        String(status || "")
            .toLowerCase()
            .trim();


    if(
        s === "approved" ||
        s === "deposit successful" ||
        s === "withdrawal successful" ||
        s === "successful" ||
        s === "success" ||
        s === "completed"
    ){

        return "status-approved";

    }


    if(
        s === "pending" ||
        s === "pending approval" ||
        s === "pending for approval" ||
        s === "waiting" ||
        s === "processing" ||
        s === ""
    ){

        return "status-pending";

    }


    if(
        s === "rejected" ||
        s === "cancelled" ||
        s === "canceled" ||
        s === "declined"
    ){

        return "status-rejected";

    }


    return "status-default";

}

        record?.referenceNumber ||
        record?.ref ||
        record?.transactionId ||
        record?.id ||
        ""
    );

}

}

========================================================= */

    );

}


/* =========================================================
   DELETE MEMBER
========================================================= */

window.deleteMember =
    async function(
        uid,
        name
    ){

        if(
            !currentAdmin ||
            currentAdmin.uid !== ADMIN_UID
        ){

            alert(
                "Admin access required."
            );

            return;

        }


        const confirmed =
            confirm(

                "⚠️ WARNING\n\n" +

                "You are about to permanently delete:\n\n" +

                "Member: " +
                name +

                "\n\n" +

                "The member Firebase document and associated " +
                "SkyRent records will also be deleted.\n\n" +

                "THIS ACTION CANNOT BE UNDONE.\n\n" +

                "Do you want to continue?"

            );


        if(!confirmed){
            return;
        }


        showLoading(
            "Deleting member records..."
        );


        try{

            /* =============================================
               DELETE DEPOSITS
            ============================================= */

            let depositDocs = [];


            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "deposits"
                            ),
                            where(
                                "userId",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        depositDocs.push(
                            snap.id
                        );

                    }
                );

            }
            catch(error){

                console.log(
                    "Deposit deletion query error:",
                    error
                );

            }


            for(
                const id
                of depositDocs
            ){

                await deleteDoc(
                    doc(
                        db,
                        "deposits",
                        id
                    )
                );

            }


            /* =============================================
               DELETE WITHDRAWALS BY UID
            ============================================= */

            let withdrawalDocs = [];


            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "withdrawals"
                            ),
                            where(
                                "uid",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        withdrawalDocs.push(
                            snap.id
                        );

                    }
                );

            }
            catch(error){

                console.log(
                    "UID withdrawal query error:",
                    error
                );

            }


            /* =============================================
               WITHDRAWALS BY userId
            ============================================= */

            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "withdrawals"
                            ),
                            where(
                                "userId",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        if(
                            !withdrawalDocs.includes(
                                snap.id
                            )
                        ){

                            withdrawalDocs.push(
                                snap.id
                            );

                        }

                    }
                );

            }
            catch(error){

                console.log(
                    "userId withdrawal query error."
                );

            }


            for(
                const id
                of withdrawalDocs
            ){

                await deleteDoc(
                    doc(
                        db,
                        "withdrawals",
                        id
                    )
                );

            }


            /* =============================================
               DELETE EARNINGS
            ============================================= */

            let earningDocs = [];


            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "earnings"
                            ),
                            where(
                                "userId",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        earningDocs.push(
                            snap.id
                        );

                    }
                );

            }
            catch(error){

                console.log(
                    "Earnings deletion error:",
                    error
                );

            }


            for(
                const id
                of earningDocs
            ){

                await deleteDoc(
                    doc(
                        db,
                        "earnings",
                        id
                    )
                );

            }


            /* =============================================
               DELETE INVESTMENTS
            ============================================= */

            let investmentDocs = [];


            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "investments"
                            ),
                            where(
                                "userId",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        investmentDocs.push(
                            snap.id
                        );

                    }
                );

            }
            catch(error){

                console.log(
                    "userId investment deletion error."
                );

            }


            /* =============================================
               INVESTMENTS BY UID
            ============================================= */

            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "investments"
                            ),
                            where(
                                "uid",
                                "==",
                                uid
                            )
                        )
                    );


                snapshot.forEach(
                    snap => {

                        if(
                            !investmentDocs.includes(
                                snap.id
                            )
                        ){

                            investmentDocs.push(
                                snap.id
                            );

                        }

                    }
                );

            }
            catch(error){

                console.log(
                    "uid investment deletion error."
                );

            }


            for(
                const id
                of investmentDocs
            ){

                await deleteDoc(
                    doc(
                        db,
                        "investments",
                        id
                    )
                );

            }


            /* =============================================
               DELETE USER DOCUMENT
            ============================================= */

            await deleteDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


            /* =============================================
               CLEAR LOCAL PAGE DATA
            ============================================= */

            allMembers =
                allMembers.filter(
                    member =>
                        member.uid !== uid
                );


            delete memberDataCache[uid];


            document.getElementById(
                "totalMembers"
            ).textContent =
                allMembers.length;


            document.getElementById(
                "searchResult"
            ).innerHTML = "";


            document.getElementById(
                "phoneSearch"
            ).value = "";


            /* =============================================
               REBUILD CURRENT LIST WITHOUT
               AUTOMATIC FIREBASE REFRESH
            ============================================= */

            const list =
                document.getElementById(
                    "membersList"
                );


            list.innerHTML = "";


            for(
                let i = 0;
                i < allMembers.length;
                i++
            ){

                const user =
                    allMembers[i];

                list.innerHTML +=
                    createMemberCard(
                        user,
                        i
                    );

            }


            hideLoading();


            alert(

                "✅ Member deleted successfully.\n\n" +

                name +

                " and the associated Firebase " +

                "SkyRent records have been removed."

            );

        }
        catch(error){

            console.error(
                "Delete member error:",
                error
            );


            hideLoading();


            alert(

                "❌ Unable to delete the member.\n\n" +

                (
                    error.message ||
                    "Please check your Firestore rules."
                )

            );

        }

    };

/* =========================================================
   AUTHENTICATION / ADMIN PROTECTION
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentAdmin =
            user;


        if(
            user.uid !== ADMIN_UID
        ){

            alert(
                "❌ Access denied. " +
                "This Firebase account is not an administrator."
            );


            await signOut(auth);


            window.location.href =
                "index.html";


            return;

        }


        /*
           ADMIN VERIFIED.

           IMPORTANT:
           This page uses NORMAL loading only.

           The full-page SkyRent logo spinner
           belongs to admin.html after successful
           admin login.

           There is NO automatic refresh here.
        */

        await loadMembers();

    }
);

   presses the "🔄 Refresh" button.

========================================================= */
