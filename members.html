<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Admin - Members</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f7fc;
    color:#123;
}

.header{
    background:linear-gradient(135deg,#0757c9,#0b8df5);
    color:white;
    padding:18px 15px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header h1{
    font-size:22px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.top-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search-box{
    flex:1;
    min-width:220px;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #d5dfeb;
    border-radius:12px;
    outline:none;
    background:white;
    font-size:14px;
}

.search-box input:focus{
    border-color:#0877e8;
    box-shadow:0 0 0 3px rgba(8,119,232,.1);
}

.stats{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stats-title{
    color:#687789;
    font-size:13px;
    margin-bottom:5px;
}

.stats-number{
    color:#0757c9;
    font-size:25px;
    font-weight:bold;
}

.members-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.member-card{
    background:white;
    border-radius:16px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #edf2f7;
}

.member-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.member-name{
    font-size:17px;
    font-weight:bold;
    color:#0757c9;
}

.member-id{
    font-size:12px;
    color:#7b8794;
    margin-top:4px;
}

.member-info{
    margin-top:13px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.info-box{
    background:#f7faff;
    border-radius:10px;
    padding:10px;
}

.info-label{
    display:block;
    color:#7b8794;
    font-size:11px;
    margin-bottom:4px;
}

.info-value{
    font-size:13px;
    font-weight:600;
    color:#26384a;
    word-break:break-word;
}

.balance{
    color:#0877e8;
}

.date{
    color:#536579;
}

.badge{
    background:#e7f3ff;
    color:#0757c9;
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:40px 15px;
    color:#6f7f91;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #dcecff;
    border-top-color:#0877e8;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    background:white;
    border-radius:15px;
    padding:35px 15px;
    text-align:center;
    color:#7b8794;
}

.error{
    background:#fff0f0;
    color:#c62828;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    font-size:14px;
}

.back-button{
    display:inline-block;
    margin-top:15px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    padding:8px 12px;
    border-radius:9px;
    font-size:12px;
}

@media(max-width:600px){
    .member-info{
        grid-template-columns:1fr;
    }

    .member-top{
        flex-direction:column;
    }

    .badge{
        align-self:flex-start;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>👥 SkyRent Members</h1>
    <p>Registered members • Newest registrations first</p>

    <a href="/admin.html" class="back-button">
        ← Back to Admin
    </a>
</div>

<div class="container">

    <div class="top-bar">
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search name, phone, email, member ID..."
            >
        </div>
    </div>

    <div class="stats">
        <div class="stats-title">Total Registered Members</div>
        <div class="stats-number" id="totalUsers">0</div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading members...
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="membersList" class="members-list"></div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==============================
   FIREBASE CONFIG
============================== */

const firebaseConfig = {
    apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",
    authDomain: "skyrent-ea30c.firebaseapp.com",
    projectId: "skyrent-ea30c",
    storageBucket: "skyrent-ea30c.firebasestorage.app",
    messagingSenderId: "572678456448",
    appId: "1:572678456448:web:6b7132351515742dd09265"
};


/* ==============================
   FIREBASE INIT
============================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ==============================
   ADMIN UID
============================== */

const ADMIN_UID = "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* ==============================
   ELEMENTS
============================== */

const loading = document.getElementById("loading");

const membersList = document.getElementById("membersList");

const totalUsers = document.getElementById("totalUsers");

const searchInput = document.getElementById("searchInput");

const errorBox = document.getElementById("errorBox");


/* ==============================
   DATA
============================== */

let allUsers = [];


/* ==============================
   DATE HELPER
============================== */

function getDateValue(value){

    if(!value){
        return 0;
    }

    /*
       Firebase Timestamp
    */
    if(
        typeof value === "object" &&
        typeof value.toDate === "function"
    ){
        return value.toDate().getTime();
    }

    /*
       Firebase Timestamp-like object
    */
    if(
        typeof value === "object" &&
        typeof value.seconds === "number"
    ){
        return value.seconds * 1000;
    }

    /*
       JavaScript Date
    */
    if(value instanceof Date){
        return value.getTime();
    }

    /*
       String / number date
    */
    const date = new Date(value);

    if(!isNaN(date.getTime())){
        return date.getTime();
    }

    return 0;
}


/* ==============================
   FORMAT DATE
============================== */

function formatDate(value){

    const timestamp = getDateValue(value);

    if(!timestamp){
        return "No registration date";
    }

    const date = new Date(timestamp);

    return date.toLocaleString("en-PH",{
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
    });
}


/* ==============================
   LOAD USERS
============================== */

async function loadUsers(){

    try{

        loading.style.display = "block";

        errorBox.style.display = "none";

        membersList.innerHTML = "";

        const snapshot = await getDocs(
            collection(db,"users")
        );

        allUsers = [];

        snapshot.forEach(doc => {

            allUsers.push({
                id: doc.id,
                ...doc.data()
            });

        });


        /*
        =========================================
        IMPORTANT:
        SORT NEWEST REGISTRATION FIRST
        =========================================

        Users with the newest createdAt timestamp
        will appear at the top.

        Users without createdAt are placed
        at the bottom.
        */

        allUsers.sort((a,b) => {

            const dateA = getDateValue(a.createdAt);

            const dateB = getDateValue(b.createdAt);

            return dateB - dateA;

        });


        totalUsers.textContent =
            allUsers.length.toLocaleString();


        renderMembers(allUsers);

    }catch(error){

        console.error("Error loading users:",error);

        errorBox.textContent =
            "Unable to load members: " + error.message;

        errorBox.style.display = "block";

    }finally{

        loading.style.display = "none";

    }

}


/* ==============================
   RENDER MEMBERS
============================== */

function renderMembers(users){

    membersList.innerHTML = "";

    if(users.length === 0){

        membersList.innerHTML = `
            <div class="empty">
                No members found.
            </div>
        `;

        return;
    }


    users.forEach((user,index) => {

        const name =
            user.name ||
            "Unnamed Member";

        const email =
            user.email ||
            "No email";

        const phone =
            user.phone ||
            "No phone";

        const memberId =
            user.memberId ||
            user.id ||
            "N/A";

        const balance =
            Number(user.balance || 0);

        const bonus =
            Number(user.bonus || 0);

        const totalEarnings =
            Number(user.totalEarnings || 0);

        const referralCode =
            user.referralCode ||
            "N/A";

        const referredByCode =
            user.referredByCode ||
            "None";

        const registrationDate =
            formatDate(user.createdAt);


        const card = document.createElement("div");

        card.className = "member-card";


        card.innerHTML = `

            <div class="member-top">

                <div>

                    <div class="member-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="member-id">
                        Member ID: ${escapeHtml(memberId)}
                    </div>

                </div>

                <div class="badge">
                    #${index + 1}
                </div>

            </div>


            <div class="member-info">

                <div class="info-box">

                    <span class="info-label">
                        📱 Phone
                    </span>

                    <div class="info-value">
                        ${escapeHtml(phone)}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        📧 Email
                    </span>

                    <div class="info-value">
                        ${escapeHtml(email)}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        💰 Balance
                    </span>

                    <div class="info-value balance">
                        ₱${balance.toLocaleString("en-PH",{
                            minimumFractionDigits:2,
                            maximumFractionDigits:2
                        })}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        🎁 Registration Bonus
                    </span>

                    <div class="info-value">
                        ₱${bonus.toLocaleString("en-PH",{
                            minimumFractionDigits:2,
                            maximumFractionDigits:2
                        })}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        📈 Total Earnings
                    </span>

                    <div class="info-value">
                        ₱${totalEarnings.toLocaleString("en-PH",{
                            minimumFractionDigits:2,
                            maximumFractionDigits:2
                        })}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        🔗 Referral Code
                    </span>

                    <div class="info-value">
                        ${escapeHtml(referralCode)}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        👥 Referred By
                    </span>

                    <div class="info-value">
                        ${escapeHtml(referredByCode)}
                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        🕐 Registered
                    </span>

                    <div class="info-value date">
                        ${escapeHtml(registrationDate)}
                    </div>

                </div>

            </div>

        `;


        membersList.appendChild(card);

    });

}


/* ==============================
   SEARCH
============================== */

searchInput.addEventListener("input",function(){

    const search =
        this.value
            .trim()
            .toLowerCase();


    if(!search){

        /*
        allUsers is already sorted
        newest first, so simply render it.
        */

        renderMembers(allUsers);

        return;

    }


    const filtered =
        allUsers.filter(user => {

            const name =
                String(user.name || "")
                    .toLowerCase();

            const phone =
                String(user.phone || "")
                    .toLowerCase();

            const email =
                String(user.email || "")
                    .toLowerCase();

            const memberId =
                String(user.memberId || "")
                    .toLowerCase();

            const referralCode =
                String(user.referralCode || "")
                    .toLowerCase();

            const referredByCode =
                String(user.referredByCode || "")
                    .toLowerCase();

            return (
                name.includes(search) ||
                phone.includes(search) ||
                email.includes(search) ||
                memberId.includes(search) ||
                referralCode.includes(search) ||
                referredByCode.includes(search)
            );

        });


    /*
    Because allUsers is already sorted
    newest first, filtered results keep
    the same newest-first order.
    */

    renderMembers(filtered);

});


/* ==============================
   HTML ESCAPE
============================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   AUTH / ADMIN CHECK
============================== */

onAuthStateChanged(auth,async(user)=>{

    if(!user){

        window.location.href = "/index.html";

        return;

    }


    if(user.uid !== ADMIN_UID){

        alert("Access denied.");

        window.location.href = "/dashboard.html";

        return;

    }


    await loadUsers();

});

</script>

</body>
</html>
