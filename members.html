<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyRent Admin - Members</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef6fc;
    color:#17324d;
}

.header{
    background:linear-gradient(135deg,#0757c9,#10a8ee);
    color:#fff;
    padding:20px 15px 25px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,70,150,.18);
}

.back{
    display:inline-block;
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    padding:8px 15px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:12px;
}

.header h1{
    font-size:25px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 5px 18px rgba(20,70,110,.08);
}

.total-card{
    background:linear-gradient(135deg,#0757c9,#119bea);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.total-number{
    font-size:38px;
    font-weight:800;
}

.total-label{
    font-size:14px;
    opacity:.9;
}

.total-icon{
    font-size:42px;
}

.section-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:12px;
}

.search-row{
    display:flex;
    gap:8px;
}

.search-row input{
    flex:1;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5e2ec;
    border-radius:13px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#0785dd;
    box-shadow:0 0 0 3px rgba(7,133,221,.1);
}

button{
    border:0;
    border-radius:13px;
    padding:12px 17px;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
}

.search-btn,
.refresh-btn{
    background:#0757c9;
    color:#fff;
}

.clear-btn{
    background:#e8eef5;
    color:#334155;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:520px;
}

th{
    background:#0757c9;
    color:#fff;
    text-align:left;
    padding:13px;
    font-size:13px;
}

td{
    padding:13px;
    border-bottom:1px solid #edf2f7;
    font-size:14px;
}

.member-row{
    cursor:pointer;
    transition:.15s;
}

.member-row:hover{
    background:#f1f8ff;
}

.member-name{
    font-weight:800;
    color:#0757c9;
}

.view-pill{
    display:inline-block;
    background:#e8f4ff;
    color:#0757c9;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    color:#b91c1c;
}

.detail-card{
    background:#fff;
    border-radius:22px;
    padding:18px;
    box-shadow:0 7px 22px rgba(20,70,110,.1);
}

.detail-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-bottom:15px;
    border-bottom:1px solid #edf2f7;
}

.detail-head h2{
    font-size:21px;
    color:#0757c9;
}

.detail-head p{
    color:#64748b;
    font-size:12px;
    margin-top:4px;
}

.close-btn{
    background:#edf2f7;
    color:#334155;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
    margin:15px 0;
}

.stat{
    background:#f3f8fc;
    border-radius:14px;
    padding:12px;
}

.stat-label{
    color:#64748b;
    font-size:11px;
}

.stat-value{
    color:#0757c9;
    font-size:17px;
    font-weight:800;
    margin-top:5px;
}

.detail-section{
    border:1px solid #e0ebf3;
    border-radius:16px;
    overflow:hidden;
    margin-top:15px;
}

.detail-section h3{
    background:#f3f8fc;
    padding:13px 14px;
    font-size:16px;
    color:#17324d;
}

.fields{
    display:grid;
    grid-template-columns:repeat(2,1fr);
}

.field{
    padding:11px 14px;
    border-top:1px solid #edf2f7;
}

.field-label{
    color:#64748b;
    font-size:11px;
    margin-bottom:5px;
}

.field-value{
    font-size:13px;
    font-weight:700;
    word-break:break-word;
    white-space:pre-wrap;
}

.history-item{
    padding:14px;
    border-top:1px solid #edf2f7;
}

.history-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.history-title{
    color:#0757c9;
    font-weight:800;
}

.history-sub{
    color:#64748b;
    font-size:12px;
    margin-top:4px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.status-approved{
    background:#dcfce7;
    color:#15803d;
}

.status-pending{
    background:#fef3c7;
    color:#a16207;
}

.status-rejected{
    background:#fee2e2;
    color:#b91c1c;
}

.status-default{
    background:#e8eef5;
    color:#475569;
}

.raw-fields{
    margin-top:10px;
    background:#f8fafc;
    border-radius:11px;
    padding:10px;
}

.raw-fields summary{
    cursor:pointer;
    font-size:12px;
    font-weight:800;
    color:#475569;
}

.notice{
    background:#fff8e6;
    border:1px solid #f5d98a;
    color:#805d00;
    border-radius:13px;
    padding:12px;
    margin-top:15px;
    font-size:12px;
}

@media(max-width:700px){

    .container{
        padding:10px;
    }

    .search-row{
        flex-wrap:wrap;
    }

    .search-row input{
        width:100%;
        flex:100%;
    }

    .search-row button{
        flex:1;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .fields{
        grid-template-columns:1fr;
    }

    .detail-head{
        align-items:flex-start;
    }

    .detail-head .close-btn{
        padding:9px 12px;
    }

    th,
    td{
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="header">

    <a href="admin.html" class="back">
        ← Back to Admin Dashboard
    </a>

    <h1>👥 SkyRent Members</h1>

    <p>
        Manage registered users and view complete member records
    </p>

</div>


<div class="container">

    <!-- TOTAL USERS -->

    <div class="card total-card">

        <div>
            <div
                class="total-number"
                id="totalMembers"
            >
                0
            </div>

            <div class="total-label">
                Total Registered Users
            </div>
        </div>

        <div class="total-icon">
            👥
        </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <div class="section-title">
            🔎 Search Members
        </div>

        <div class="search-row">

            <input
                id="searchInput"
                type="text"
                placeholder="Search by name or phone"
            >

            <button
                id="searchBtn"
                class="search-btn"
                type="button"
            >
                Search
            </button>

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- MEMBER TABLE -->

    <div class="card">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
                margin-bottom:12px;
            "
        >

            <div class="section-title" style="margin:0;">
                👥 Members
            </div>

            <button
                id="refreshBtn"
                class="refresh-btn"
                type="button"
            >
                ↻ Refresh
            </button>

        </div>

        <div id="membersArea" class="loading">
            Checking administrator access...
        </div>

    </div>


    <!-- DETAILS -->

    <div id="detailsArea"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   ADMIN UID
========================================================= */

const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentAdmin = null;

let allMembers = [];

let currentDisplayedMembers = [];

let memberCache = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const membersArea =
    document.getElementById("membersArea");

const detailsArea =
    document.getElementById("detailsArea");

const totalMembers =
    document.getElementById("totalMembers");

const searchInput =
    document.getElementById("searchInput");

const searchBtn =
    document.getElementById("searchBtn");

const clearBtn =
    document.getElementById("clearBtn");

const refreshBtn =
    document.getElementById("refreshBtn");


/* =========================================================
   BUTTON EVENTS
========================================================= */

searchBtn.addEventListener(
    "click",
    searchMembers
);


clearBtn.addEventListener(
    "click",
    clearSearch
);


refreshBtn.addEventListener(
    "click",
    loadMembers
);


searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            searchMembers();
        }

    }
);


/* =========================================================
   AUTH CHECK
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            membersArea.innerHTML = `
                <div class="error">
                    ❌ No administrator session found.
                </div>
            `;

            return;
        }


        currentAdmin = user;


        if(user.uid !== ADMIN_UID){

            membersArea.innerHTML = `
                <div class="error">
                    ❌ Access denied.<br><br>
                    This account is not an administrator.
                </div>
            `;

            return;
        }


        await loadMembers();

    }
);


/* =========================================================
   LOAD MEMBERS
========================================================= */

async function loadMembers(){

    if(
        !currentAdmin ||
        currentAdmin.uid !== ADMIN_UID
    ){
        return;
    }


    membersArea.innerHTML = `
        <div class="loading">
            ⏳ Loading registered users...
        </div>
    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allMembers = [];


        snapshot.forEach(
            function(docSnap){

                allMembers.push({

                    uid: docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        allMembers.sort(
            function(a,b){

                return (
                    getTime(b.createdAt) -
                    getTime(a.createdAt)
                );

            }
        );


        currentDisplayedMembers =
            [...allMembers];


        totalMembers.textContent =
            allMembers.length;


        renderMembers(
            currentDisplayedMembers
        );


    }catch(error){

        console.error(
            "Load members error:",
            error
        );


        membersArea.innerHTML = `
            <div class="error">
                ❌ Unable to load members.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   RENDER MEMBER TABLE
========================================================= */

function renderMembers(list){

    currentDisplayedMembers =
        [...list];


    if(!list.length){

        membersArea.innerHTML = `
            <div class="empty">
                No registered users found.
            </div>
        `;

        return;
    }


    let rows = "";


    list.forEach(
        function(user){

            rows += `

                <tr
                    class="member-row"
                    data-uid="${escapeHTML(user.uid)}"
                >

                    <td>

                        <div class="member-name">
                            ${escapeHTML(
                                user.name ||
                                "Unnamed User"
                            )}
                        </div>

                    </td>


                    <td>
                        ${escapeHTML(
                            user.phone ||
                            "—"
                        )}
                    </td>


                    <td>

                        <span class="view-pill">
                            View Details →
                        </span>

                    </td>

                </tr>

            `;

        }
    );


    membersArea.innerHTML = `

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            User Phone
                        </th>

                        <th>
                            Details
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${rows}

                </tbody>

            </table>

        </div>

    `;


    const rowElements =
        membersArea.querySelectorAll(
            ".member-row"
        );


    rowElements.forEach(
        function(row){

            row.addEventListener(
                "click",
                function(){

                    openMember(
                        row.dataset.uid
                    );

                }
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function searchMembers(){

    const value =
        searchInput.value
            .trim()
            .toLowerCase();


    if(!value){

        renderMembers(
            allMembers
        );

        return;
    }


    const results =
        allMembers.filter(
            function(user){

                const name =
                    String(
                        user.name || ""
                    ).toLowerCase();


                const phone =
                    String(
                        user.phone || ""
                    ).toLowerCase();


                return (
                    name.includes(value) ||
                    phone.includes(value)
                );

            }
        );


    renderMembers(results);

}


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearSearch(){

    searchInput.value = "";

    detailsArea.innerHTML = "";

    renderMembers(
        allMembers
    );

}


/* =========================================================
   OPEN MEMBER
========================================================= */

async function openMember(uid){

    const user =
        allMembers.find(
            function(member){
                return member.uid === uid;
            }
        );


    if(!user){
        return;
    }


    detailsArea.innerHTML = `

        <div class="detail-card">

            <div class="loading">
                ⏳ Loading complete member record...
            </div>

        </div>

    `;


    detailsArea.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    try{

        let records =
            memberCache.get(uid);


        if(!records){

            records =
                await getMemberRecords(
                    user
                );

            memberCache.set(
                uid,
                records
            );

        }


        detailsArea.innerHTML =
            createMemberDetails(
                user,
                records
            );


    }catch(error){

        console.error(
            "Member details error:",
            error
        );


        detailsArea.innerHTML = `

            <div class="detail-card">

                <div class="error">

                    ❌ Unable to load this member's records.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


/* =========================================================
   GET MEMBER RECORDS
========================================================= */

async function getMemberRecords(user){

    const uid =
        user.uid;


    const deposits =
        await getUserRecords(
            "deposits",
            uid
        );


    const withdrawals =
        await getUserRecords(
            "withdrawals",
            uid
        );


    const investments =
        await getUserRecords(
            "investments",
            uid
        );


    const earnings =
        await getUserRecords(
            "earnings",
            uid
        );


    const totalDeposit =
        deposits
            .filter(isApproved)
            .reduce(
                function(total,record){

                    return (
                        total +
                        getAmount(record)
                    );

                },
                0
            );


    const totalWithdrawal =
        withdrawals
            .filter(isApproved)
            .reduce(
                function(total,record){

                    return (
                        total +
                        getAmount(record)
                    );

                },
                0
            );


    const totalInvestment =
        investments.reduce(
            function(total,record){

                return (
                    total +
                    getInvestmentAmount(
                        record
                    )
                );

            },
            0
        );


    const activeInvestments =
        investments.filter(
            isActiveInvestment
        ).length;


    const totalEarnings =
        earnings.reduce(
            function(total,record){

                return (
                    total +
                    toNumber(
                        record.amount
                    )
                );

            },
            0
        );


    return {

        deposits,

        withdrawals,

        investments,

        earnings,

        totalDeposit,

        totalWithdrawal,

        totalInvestment,

        activeInvestments,

        totalEarnings

    };

}


/* =========================================================
   GET USER RECORDS
   Supports both userId and uid.
========================================================= */

async function getUserRecords(
    collectionName,
    uid
){

    const records =
        new Map();


    const fields = [
        "userId",
        "uid"
    ];


    for(
        const field of fields
    ){

        try{

            const q =
                query(
                    collection(
                        db,
                        collectionName
                    ),
                    where(
                        field,
                        "==",
                        uid
                    )
                );


            const snapshot =
                await getDocs(q);


            snapshot.forEach(
                function(docSnap){

                    records.set(
                        docSnap.id,
                        {

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        }
                    );

                }
            );


        }catch(error){

            console.log(
                collectionName +
                " / " +
                field +
                " query skipped:",
                error
            );

        }

    }


    return Array.from(
        records.values()
    );

}


/* =========================================================
   CREATE MEMBER DETAILS
========================================================= */

function createMemberDetails(
    user,
    stats
){

    return `

        <div class="detail-card">

            <div class="detail-head">

                <div>

                    <h2>
                        👤
                        ${escapeHTML(
                            user.name ||
                            "Unnamed User"
                        )}
                    </h2>

                    <p>
                        Complete SkyRent member record
                    </p>

                </div>


                <button
                    class="close-btn"
                    id="closeDetailsBtn"
                    type="button"
                >
                    Close
                </button>

            </div>


            <!-- SUMMARY -->

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Balance
                    </div>

                    <div class="stat-value">
                        ${money(user.balance)}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Deposited
                    </div>

                    <div class="stat-value">
                        ${money(
                            stats.totalDeposit
                        )}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Withdrawn
                    </div>

                    <div class="stat-value">
                        ${money(
                            stats.totalWithdrawal
                        )}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Investment
                    </div>

                    <div class="stat-value">
                        ${money(
                            stats.totalInvestment
                        )}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Active Investments
                    </div>

                    <div class="stat-value">
                        ${stats.activeInvestments}
                    </div>

                </div>

            </div>


            <!-- REGISTRATION -->

            <div class="detail-section">

                <h3>
                    👤 Registration & Account Information
                </h3>

                <div class="fields">

                    ${renderObjectFields(
                        user
                    )}

                </div>

            </div>


            <!-- WITHDRAWAL ACCOUNT -->

            <div class="detail-section">

                <h3>
                    🏦 Withdrawal Account
                </h3>

                <div class="fields">

                    ${renderWithdrawalAccount(
                        user
                    )}

                </div>

            </div>


            <!-- DEPOSITS -->

            <div class="detail-section">

                <h3>
                    💰 Deposits
                    (${stats.deposits.length})
                </h3>

                ${renderRecords(
                    stats.deposits,
                    "Deposit"
                )}

            </div>


            <!-- WITHDRAWALS -->

            <div class="detail-section">

                <h3>
                    💸 Withdrawals
                    (${stats.withdrawals.length})
                </h3>

                ${renderRecords(
                    stats.withdrawals,
                    "Withdrawal"
                )}

            </div>


            <!-- INVESTMENTS -->

            <div class="detail-section">

                <h3>
                    ✈️ Investments
                    (${stats.investments.length})
                </h3>

                ${renderRecords(
                    stats.investments,
                    "Investment"
                )}

            </div>


            <!-- EARNINGS -->

            <div class="detail-section">

                <h3>
                    📈 Earnings
                    (${stats.earnings.length})
                </h3>

                ${renderRecords(
                    stats.earnings,
                    "Earning"
                )}

            </div>


            <div class="notice">

                ℹ️ This page only displays member
                information and transaction records.
                It does not change the user's balance
                or transaction records.

            </div>

        </div>

    `;

}


/* =========================================================
   CLOSE DETAILS
========================================================= */

document.addEventListener(
    "click",
    function(event){

        if(
            event.target &&
            event.target.id ===
            "closeDetailsBtn"
        ){

            detailsArea.innerHTML = "";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


/* =========================================================
   WITHDRAWAL ACCOUNT
========================================================= */

function renderWithdrawalAccount(user){

    const account =
        user.withdrawalAccount;


    if(
        !account ||
        typeof account !== "object"
    ){

        return `

            <div class="field">

                <div class="field-label">
                    Status
                </div>

                <div class="field-value">
                    No withdrawal account saved
                </div>

            </div>

        `;

    }


    const entries =
        Object.entries(account);


    if(!entries.length){

        return `

            <div class="field">

                <div class="field-value">
                    No withdrawal account saved
                </div>

            </div>

        `;

    }


    return entries.map(
        function(entry){

            const key =
                entry[0];

            const value =
                entry[1];


            return `

                <div class="field">

                    <div class="field-label">
                        ${escapeHTML(
                            formatKey(key)
                        )}
                    </div>

                    <div class="field-value">
                        ${escapeHTML(
                            formatValue(value)
                        )}
                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =========================================================
   OBJECT FIELDS
========================================================= */

function renderObjectFields(
    object
){

    const entries =
        Object.entries(
            object || {}
        ).filter(
            function(entry){

                return (
                    entry[0] !==
                    "password"
                );

            }
        );


    if(!entries.length){

        return `

            <div class="field">

                <div class="field-value">
                    No information available.
                </div>

            </div>

        `;

    }


    return entries.map(
        function(entry){

            const key =
                entry[0];

            const value =
                entry[1];


            return `

                <div class="field">

                    <div class="field-label">
                        ${escapeHTML(
                            formatKey(key)
                        )}
                    </div>

                    <div class="field-value">
                        ${escapeHTML(
                            formatValue(value)
                        )}
                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =========================================================
   TRANSACTION RECORDS
========================================================= */

function renderRecords(
    records,
    type
){

    if(!records.length){

        return `

            <div class="empty">
                No ${type.toLowerCase()}
                records found.
            </div>

        `;

    }


    const sorted =
        [...records].sort(
            function(a,b){

                return (
                    getTime(
                        b.createdAt ||
                        b.timestamp ||
                        b.date ||
                        b.updatedAt
                    )
                    -
                    getTime(
                        a.createdAt ||
                        a.timestamp ||
                        a.date ||
                        a.updatedAt
                    )
                );

            }
        );


    return sorted.map(
        function(record){

            const amount =
                type === "Investment"
                    ? getInvestmentAmount(record)
                    : getAmount(record);


            const status =
                record.status ||
                record.state ||
                record.investmentStatus ||
                "";


            const plan =
                record.planName ||
                record.plan ||
                record.planId ||
                record.aircraft ||
                record.craft ||
                "";


            return `

                <div class="history-item">

                    <div class="history-top">

                        <div>

                            <div class="history-title">

                                ${escapeHTML(type)}

                                ${
                                    amount
                                        ? " • " +
                                          money(amount)
                                        : ""
                                }

                            </div>


                            <div class="history-sub">

                                ${escapeHTML(
                                    formatDate(
                                        record
                                    )
                                )}

                            </div>

                        </div>


                        ${
                            status
                                ? `

                                    <span
                                        class="status
                                        ${getStatusClass(
                                            status
                                        )}"
                                    >

                                        ${escapeHTML(
                                            String(
                                                status
                                            )
                                        )}

                                    </span>

                                  `
                                : ""
                        }

                    </div>


                    ${
                        plan
                            ? `

                                <div
                                    class="history-sub"
                                    style="margin-top:8px;"
                                >

                                    Plan / Craft:

                                    <strong>
                                        ${escapeHTML(
                                            plan
                                        )}
                                    </strong>

                                </div>

                              `
                            : ""
                    }


                    <details class="raw-fields">

                        <summary>
                            Show all record fields
                        </summary>

                        <div
                            class="fields"
                            style="margin-top:8px;"
                        >

                            ${renderObjectFields(
                                record
                            )}

                        </div>

                    </details>

                </div>

            `;

        }
    ).join("");

}


/* =========================================================
   APPROVED CHECK
========================================================= */

function isApproved(
    record
){

    const status =
        String(
            record.status ||
            record.state ||
            ""
        )
        .toLowerCase()
        .trim();


    return [

        "approved",

        "deposit successful",

        "withdrawal successful",

        "successful",

        "success",

        "completed",

        "complete"

    ].includes(status);

}


/* =========================================================
   ACTIVE INVESTMENT CHECK
========================================================= */

function isActiveInvestment(
    record
){

    const status =
        String(
            record.status ||
            record.state ||
            record.investmentStatus ||
            ""
        )
        .toLowerCase()
        .trim();


    if([

        "rejected",
        "cancelled",
        "canceled",
        "declined",
        "completed",
        "complete",
        "expired",
        "inactive"

    ].includes(status)){

        return false;

    }


    if([

        "active",
        "in progress",
        "running",
        "ongoing"

    ].includes(status)){

        return true;

    }


    if(
        record.active === true ||
        record.isActive === true
    ){

        return true;

    }


    return false;

}


/* =========================================================
   AMOUNT
========================================================= */

function getAmount(
    record
){

    return toNumber(

        record.amount ??
        record.requestedAmount ??
        record.depositAmount ??
        record.withdrawalAmount

    );

}


/* =========================================================
   INVESTMENT AMOUNT
========================================================= */

function getInvestmentAmount(
    record
){

    return toNumber(

        record.amount ??
        record.planAmount ??
        record.investmentAmount ??
        record.price ??
        record.purchaseAmount

    );

}


/* =========================================================
   NUMBER
========================================================= */

function toNumber(
    value
){

    const number =
        Number(value);


    return Number.isFinite(
        number
    )
        ? number
        : 0;

}


/* =========================================================
   MONEY
========================================================= */

function money(
    value
){

    return (

        "₱" +

        toNumber(value)
            .toLocaleString(
                "en-PH",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            )

    );

}


/* =========================================================
   FORMAT KEY
========================================================= */

function formatKey(
    key
){

    return String(key)

        .replace(
            /([A-Z])/g,
            " $1"
        )

        .replace(
            /[_-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()

        .replace(
            /\b\w/g,
            function(char){
                return char.toUpperCase();
            }
        );

}


/* =========================================================
   FORMAT VALUE
========================================================= */

function formatValue(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "—";

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        return value
            .toDate()
            .toLocaleString(
                "en-PH"
            );

    }


    if(
        typeof value ===
        "object"
    ){

        try{

            return JSON.stringify(
                value,
                null,
                2
            );

        }catch(error){

            return String(value);

        }

    }


    return String(value);

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    record
){

    const value =
        record.createdAt ??
        record.timestamp ??
        record.date ??
        record.updatedAt;


    if(!value){

        return "Date not available";

    }


    try{

        const date =
            typeof value.toDate ===
            "function"

                ? value.toDate()

                : new Date(value);


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Date not available";

        }


        return date.toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );


    }catch(error){

        return "Date not available";

    }

}


/* =========================================================
   GET TIME
========================================================= */

function getTime(
    value
){

    if(!value){

        return 0;

    }


    try{

        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .getTime();

        }


        const time =
            new Date(value)
                .getTime();


        return Number.isFinite(
            time
        )
            ? time
            : 0;


    }catch(error){

        return 0;

    }

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
){

    const value =
        String(
            status || ""
        )
        .toLowerCase()
        .trim();


    if([

        "approved",
        "deposit successful",
        "withdrawal successful",
        "successful",
        "success",
        "completed",
        "complete"

    ].includes(value)){

        return "status-approved";

    }


    if([

        "pending",
        "pending approval",
        "pending for approval",
        "waiting",
        "processing"

    ].includes(value)){

        return "status-pending";

    }


    if([

        "rejected",
        "cancelled",
        "canceled",
        "declined"

    ].includes(value)){

        return "status-rejected";

    }


    return "status-default";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
