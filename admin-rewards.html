/* =========================================================
   NORMALIZE PHONE
========================================================= */

function normalizePhone(
    phone
){

    return String(
        phone || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .replace(
        /^63/,
        "0"
    );

}



/* =========================================================
   FIND USER
========================================================= */

function findUserForReward(
    reward
){

    const rewardUid =
        reward.userId ||
        reward.uid ||
        reward.userUID ||
        reward.userUid ||
        "";


    const rewardPhone =
        normalizePhone(
            reward.userPhone ||
            reward.phone ||
            ""
        );


    if(rewardUid){

        const byUid =
            allUsers.find(
                user =>
                    user.uid ===
                    rewardUid
            );


        if(byUid){

            return byUid;

        }

    }


    if(rewardPhone){

        const byPhone =
            allUsers.find(
                user =>
                    normalizePhone(
                        user.phone
                    ) ===
                    rewardPhone
            );


        if(byPhone){

            return byPhone;

        }

    }


    return null;

}



/* =========================================================
   GET DIRECT REFERRER
========================================================= */

function getDirectReferrer(
    user
){

    if(!user){

        return null;

    }


    const refUid =
        user.referredByUid ||
        user.referrerUid ||
        user.referrerId ||
        user.referredBy ||
        "";


    if(refUid){

        const byUid =
            allUsers.find(
                member =>
                    member.uid ===
                    refUid
            );


        if(byUid){

            return byUid;

        }

    }


    const refPhone =
        normalizePhone(
            user.referredByPhone ||
            user.referrerPhone ||
            user.referrer ||
            ""
        );


    if(refPhone){

        const byPhone =
            allUsers.find(
                member =>
                    normalizePhone(
                        member.phone
                    ) ===
                    refPhone
            );


        if(byPhone){

            return byPhone;

        }

    }


    const refCode =
        String(
            user.referredByCode ||
            user.referrerCode ||
            user.referralBy ||
            ""
        )
        .trim()
        .toUpperCase();


    if(refCode){

        const byCode =
            allUsers.find(
                member =>
                    String(
                        member.referralCode ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    refCode
            );


        if(byCode){

            return byCode;

        }

    }


    return null;

}



/* =========================================================
   BUILD NETWORK
========================================================= */

function buildNetworkForUser(
    targetUser
){

    const levelA = [];

    const levelB = [];

    const levelC = [];


    if(!targetUser){

        return {
            levelA,
            levelB,
            levelC
        };

    }


    const targetUid =
        targetUser.uid ||
        "";


    const targetPhone =
        normalizePhone(
            targetUser.phone
        );


    /* =====================================================
       LEVEL A
    ===================================================== */

    allUsers.forEach(
        user => {

            if(
                user.uid ===
                targetUid
            ){

                return;

            }


            if(
                normalizePhone(
                    user.phone
                ) ===
                targetPhone
            ){

                return;

            }


            const referrer =
                getDirectReferrer(
                    user
                );


            if(!referrer){

                return;

            }


            const sameUid =
                referrer.uid &&
                referrer.uid ===
                targetUid;


            const samePhone =
                normalizePhone(
                    referrer.phone
                ) ===
                targetPhone;


            if(
                sameUid ||
                samePhone
            ){

                levelA.push(
                    user
                );

            }

        }
    );



    /* =====================================================
       LEVEL B
    ===================================================== */

    allUsers.forEach(
        user => {

            if(
                user.uid ===
                targetUid
            ){

                return;

            }


            if(
                levelA.some(
                    member =>
                        member.uid ===
                        user.uid
                )
            ){

                return;

            }


            const referrer =
                getDirectReferrer(
                    user
                );


            if(!referrer){

                return;

            }


            if(
                levelA.some(
                    member =>
                        member.uid ===
                        referrer.uid
                )
            ){

                levelB.push(
                    user
                );

            }

        }
    );



    /* =====================================================
       LEVEL C
    ===================================================== */

    allUsers.forEach(
        user => {

            if(
                user.uid ===
                targetUid
            ){

                return;

            }


            if(
                levelA.some(
                    member =>
                        member.uid ===
                        user.uid
                )
            ){

                return;

            }


            if(
                levelB.some(
                    member =>
                        member.uid ===
                        user.uid
                )
            ){

                return;

            }


            const referrer =
                getDirectReferrer(
                    user
                );


            if(!referrer){

                return;

            }


            if(
                levelB.some(
                    member =>
                        member.uid ===
                        referrer.uid
                )
            ){

                levelC.push(
                    user
                );

            }

        }
    );


    return {

        levelA,
        levelB,
        levelC

    };

}



/* =========================================================
   ACTIVE INVESTMENT CHECK
========================================================= */

function hasActiveInvestment(
    user
){

    if(!user){

        return false;

    }


    const uid =
        user.uid ||
        "";


    const phone =
        normalizePhone(
            user.phone
        );


    return allInvestments.some(
        investment => {

            const investmentUid =
                investment.userId ||
                investment.uid ||
                investment.userUID ||
                investment.userUid ||
                "";


            const investmentPhone =
                normalizePhone(
                    investment.phone ||
                    investment.userPhone ||
                    ""
                );


            const status =
                String(
                    investment.status ||
                    investment.investmentStatus ||
                    ""
                )
                .toLowerCase()
                .trim();


            const activeStatus =

                status === "active"

                ||

                status === "approved"

                ||

                status === "running"

                ||

                status === "in progress";


            const sameUser =

                (
                    investmentUid &&
                    investmentUid ===
                    uid
                )

                ||

                (
                    investmentPhone &&
                    investmentPhone ===
                    phone
                );


            return (
                sameUser &&
                activeStatus
            );

        }
    );

}



/* =========================================================
   INVESTED COUNT
========================================================= */

function getInvestedCount(
    members
){

    return members.filter(
        member =>
            hasActiveInvestment(
                member
            )
    ).length;

}



/* =========================================================
   CURRENT INVESTED NETWORK
========================================================= */

function getCurrentInvestedNetworkCount(
    reward
){

    const user =
        findUserForReward(
            reward
        );


    if(!user){

        return 0;

    }


    const network =
        buildNetworkForUser(
            user
        );


    const investedA =
        getInvestedCount(
            network.levelA
        );


    const investedB =
        getInvestedCount(
            network.levelB
        );


    const investedC =
        getInvestedCount(
            network.levelC
        );


    return (
        investedA +
        investedB +
        investedC
    );

}



/* =========================================================
   MONEY FORMAT
========================================================= */

function money(
    amount
){

    return "₱" +

        Number(
            amount || 0
        ).toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}



/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(
    timestamp
){

    if(!timestamp){

        return "—";

    }


    try{

        let date;


        if(
            timestamp.toDate
        ){

            date =
                timestamp.toDate();

        }

        else if(
            timestamp.seconds
        ){

            date =
                new Date(
                    timestamp.seconds *
                    1000
                );

        }

        else{

            date =
                new Date(
                    timestamp
                );

        }


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "—";

        }


        return date.toLocaleString(
            "en-PH",
            {
                month:"short",
                day:"numeric",
                year:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "—";

    }

}

   ADMIN CHECK
========================================================= */

/* =========================================================
   LOAD USERS + INVESTMENTS + REWARDS
========================================================= */

window.loadRewards =
async function(){

    try{

        /*
         * Load users.
         */

        const usersSnapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allUsers = [];


        usersSnapshot.forEach(
            snap => {

                allUsers.push({

                    uid:
                        snap.id,

                    ...snap.data()

                });

            }
        );



        /*
         * Load investments.
         */

        const investmentsSnapshot =
            await getDocs(
                collection(
                    db,
                    "investments"
                )
            );


        allInvestments = [];


        investmentsSnapshot.forEach(
            snap => {

                allInvestments.push({

                    id:
                        snap.id,

                    ...snap.data()

                });

            }
        );



        /*
         * Load rewards.
         */

        const rewardsSnapshot =
            await getDocs(
                collection(
                    db,
                    "networkRewards"
                )
            );


        allRewards = [];


        rewardsSnapshot.forEach(
            snap => {

                allRewards.push({

                    id:
                        snap.id,

                    ...snap.data()

                });

            }
        );


        allRewards.sort(
            (a,b) => {

                const aTime =
                    a.claimedAt &&
                    a.claimedAt.seconds
                        ?
                        a.claimedAt.seconds
                        :
                        0;


                const bTime =
                    b.claimedAt &&
                    b.claimedAt.seconds
                        ?
                        b.claimedAt.seconds
                        :
                        0;


                return (
                    bTime -
                    aTime
                );

            }
        );


        updateSummary();

        renderRewards();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "content"
        ).style.display =
            "block";

    }
    catch(error){

        console.error(
            "Reward loading error:",
            error
        );


        document.getElementById(
            "loading"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                Unable to load reward requests.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

};



/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary(){

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    allRewards.forEach(
        reward => {

            const status =
                String(
                    reward.status || ""
                )
                .toLowerCase()
                .trim();


            if(
                status === "pending"
            ){

                pending++;

            }

            else if(

                status === "approved"

                ||

                status === "collected"

                ||

                status === "claimed"

            ){

                approved++;

            }

            else if(
                status === "rejected"
            ){

                rejected++;

            }

        }
    );


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "approvedCount"
    ).textContent =
        approved;


    document.getElementById(
        "rejectedCount"
    ).textContent =
        rejected;


    document.getElementById(
        "totalCount"
    ).textContent =
        allRewards.length;

}

window.setFilter =
function(
    filter
){

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    const button =
        document.getElementById(
            "filter" +
            filter.charAt(0).toUpperCase() +
            filter.slice(1)
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    renderRewards();

};

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}



/* =========================================================
   APPROVE REWARD
========================================================= */

window.approveReward =
async function(
    rewardId
){

    const confirmed =
        confirm(
            "Approve this reward claim?\n\n" +
            "The reward will be marked as collected."
        );


    if(!confirmed){

        return;

    }


    try{

        const rewardRef =
            doc(
                db,
                "networkRewards",
                rewardId
            );


        await updateDoc(
            rewardRef,
            {

                status:
                    "approved",

                approvedAt:
                    serverTimestamp(),

                approvedBy:
                    currentAdmin.uid

            }
        );


        alert(
            "✅ Reward approved successfully."
        );


        await loadRewards();

    }
    catch(error){

        console.error(
            "Approve reward error:",
            error
        );


        alert(
            "Unable to approve reward.\n\n" +
            error.message
        );

    }

};



/* =========================================================
   OPEN REJECT MODAL
========================================================= */

window.openRejectModal =
function(
    rewardId
){

    rejectingRewardId =
        rewardId;


    document.getElementById(
        "rejectReason"
    ).value = "";


    document.getElementById(
        "rejectModal"
    ).classList.add(
        "show"
    );

};



/* =========================================================
   CLOSE REJECT MODAL
========================================================= */

window.closeRejectModal =
function(){

    rejectingRewardId =
        null;


    document.getElementById(
        "rejectModal"
    ).classList.remove(
        "show"
    );

};



/* =========================================================
   CONFIRM REJECT
========================================================= */

window.confirmReject =
async function(){

    if(
        !rejectingRewardId
    ){

        return;

    }


    const reason =
        document.getElementById(
            "rejectReason"
        ).value.trim();


    if(!reason){

        alert(
            "Please enter a rejection reason."
        );

        return;

    }


    try{

        const rewardRef =
            doc(
                db,
                "networkRewards",
                rejectingRewardId
            );


        await updateDoc(
            rewardRef,
            {

                status:
                    "rejected",

                rejectionReason:
                    reason,

                rejectedAt:
                    serverTimestamp(),

                rejectedBy:
                    currentAdmin.uid

            }
        );


        closeRejectModal();


        alert(
            "Reward claim rejected."
        );


        await loadRewards();

    }
    catch(error){

        console.error(
            "Reject reward error:",
            error
        );


        alert(
            "Unable to reject reward.\n\n" +
            error.message
        );

    }

};
