<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skyrent - Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>✈ Skyrent</h1>

    <p>Dream • Save • Fly • Earn</p>


    <div class="box">

        <h2>Welcome Back</h2>

        <input 
        type="tel"
        id="phone"
        placeholder="Phone Number">


        <input 
        type="password"
        id="password"
        placeholder="Password">


        <button onclick="login()">
            LOGIN
        </button>


        <hr>


        <h3>Create Account</h3>

        <input
        type="text"
        id="name"
        placeholder="Full Name">


        <input
        type="tel"
        id="registerPhone"
        placeholder="Phone Number">


        <input
        type="password"
        id="registerPassword"
        placeholder="Password">


        <button onclick="register()">
            REGISTER
        </button>

    </div>

</div>


<script src="js/database.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
