<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
    "Inter",
    "Segoe UI",
    Arial,
    sans-serif;

    min-height:100vh;

    background:
    radial-gradient(
        circle at 20% 10%,
        rgba(255,255,255,.8),
        transparent 25%
    ),
    linear-gradient(
        135deg,
        #052b78,
        #0074d9 55%,
        #7edfff
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow-x:hidden;
}


/* CLOUD GLOW */

body::before,
body::after{

    content:"";

    position:fixed;

    width:320px;
    height:160px;

    background:
    rgba(255,255,255,.25);

    border-radius:50%;

    filter:blur(30px);

    z-index:0;
}


body::before{

    top:5%;
    left:-100px;

}


body::after{

    bottom:5%;
    right:-100px;

}



/* MAIN GLASS CARD */

.container{

    width:100%;

    max-width:950px;

    min-height:600px;

    display:flex;

    background:
    rgba(255,255,255,.96);

    border-radius:30px;

    overflow:hidden;

    box-shadow:
    0 30px 70px rgba(0,0,0,.28);

    position:relative;

    z-index:1;

}



/* LEFT AIRCRAFT AREA */


.left{

    width:45%;

    background:

    linear-gradient(
        rgba(0,50,130,.55),
        rgba(0,120,220,.75)
    ),

    url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=80");

    background-size:cover;

    background-position:center;


    color:white;

    padding:50px 40px;


    display:flex;

    flex-direction:column;

    justify-content:center;

}



.logo{

    font-size:38px;

    font-weight:700;

    letter-spacing:.5px;

}


.logo span{

    color:#6bd8ff;

}



.tagline{

    margin-top:10px;

    letter-spacing:4px;

    font-size:12px;

    opacity:.9;

}



.left h1{

    margin-top:45px;

    font-size:40px;

    line-height:1.15;

    font-weight:600;

}



.left h1 span{

    color:#ffd83d;

}



.left p{

    margin-top:20px;

    line-height:1.7;

    font-size:16px;

    font-weight:300;

}



.features{

    margin-top:35px;

}


.features div{

    margin:12px 0;

    font-size:15px;

    font-weight:500;

}



/* RIGHT FORM */

.right{

    width:55%;

    padding:45px 55px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}



.form-title{

    text-align:center;

    margin-bottom:25px;

}


.form-title h2{

    color:#062b78;

    font-size:32px;

    font-weight:600;

}



.form-title p{

    color:#777;

    margin-top:8px;

    font-size:15px;

}



/* TABS */


.tabs{

    display:flex;

    background:#edf5ff;

    border-radius:14px;

    padding:5px;

    margin-bottom:25px;

}


.tab{

    flex:1;

    border:0;

    background:none;

    padding:14px;

    border-radius:10px;

    color:#14509b;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

}


.tab.active{

    background:#0752a5;

    color:white;

}



/* FORMS */


.form{

    display:none;

}


.form.active{

    display:block;

}


/* INPUTS */


.input-box{

    margin-bottom:18px;

}


.input-box label{

    display:block;

    color:#183c70;

    margin-bottom:7px;

    font-size:14px;

    font-weight:600;

}


.input-box input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:2px solid #dce7f5;

    outline:none;

    font-size:15px;

}



.input-box input:focus{

    border-color:#0874db;

}



.phone-input{

    display:flex;

    gap:8px;

}


.country-code{

    width:75px!important;

    background:#f1f6fc;

    text-align:center;

    font-weight:600;

}



/* PASSWORD */


.password-wrap{

    position:relative;

}


.password-wrap input{

    padding-right:50px;

}


.eye{

    position:absolute;

    right:15px;

    top:14px;

    cursor:pointer;

}



/* BUTTON */


.btn{

    width:100%;

    border:none;

    padding:15px;

    border-radius:12px;


    background:
    linear-gradient(
        135deg,
        #06499b,
        #0789e8
    );


    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}



.gold-btn{

    background:

    linear-gradient(
        135deg,
        #e9aa00,
        #ffd83d
    );

    color:#062b78;

}


 
/* FOOTER */

.footer{

    text-align:center;

    margin-top:25px;

    color:#888;

    font-size:12px;

}


.footer strong{

    color:#0755a8;

}



/* MOBILE */

@media(max-width:750px){


body{

    padding:12px;

}


.container{

    flex-direction:column;

    border-radius:22px;

}


.left{

    width:100%;

    min-height:300px;

    padding:35px 25px;

    text-align:center;

}


.logo{

    font-size:32px;

}


.left h1{

    font-size:32px;

}


.features{

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

}


.features div{

    font-size:12px;

}


.right{

    width:100%;

    padding:30px 22px;

}


.form-title h2{

    font-size:27px;

}


}

</style>

</head>


<body>


<div class="container">


<!-- LEFT SIDE -->

<div class="left">


<div class="logo">

✈ Sky<span>Rent</span>

</div>


<div class="tagline">

DREAM • SAVE • FLY • EARN

</div>


<h1>

Invest Today,

<br>

<span>Fly Tomorrow</span>

</h1>


<p>

Turn your savings into real opportunities.

Choose your craft and start your journey

with SkyRent.

</p>



<div class="features">

<div>✓ Save</div>

<div>✓ Invest</div>

<div>✓ Earn</div>

<div>✓ Fly</div>

</div>


</div>



<!-- RIGHT SIDE -->


<div class="right">


<div class="form-title">


<h2 id="title">

Welcome Back

</h2>


<p id="subtitle">

Login to your SkyRent account

</p>


</div>




<div class="tabs">


<button

class="tab active"

onclick="showLogin()">

LOGIN

</button>



<button

class="tab"

onclick="showRegister()">

REGISTER

</button>


</div>





<!-- LOGIN -->


<form id="loginForm" class="form active">


<div class="input-box">

<label>

Phone Number

</label>


<div class="phone-input">


<input

class="country-code"

value="+63"

readonly>


<input

type="tel"

placeholder="9XXXXXXXXX">


</div>


</div>




<div class="input-box">


<label>

Password

</label>


<div class="password-wrap">


<input

type="password"

id="loginPassword"

placeholder="Enter password">


<span

class="eye"

onclick="togglePassword('loginPassword',this)">

👁

</span>


</div>


</div>




<button

type="button"

class="btn">

✈ LOGIN

</button>


</form>





<!-- REGISTER -->


<form id="registerForm" class="form">


<div class="input-box">


<label>

Full Name

</label>


<input

<input
type="text"
id="registerName"
placeholder="Enter your name">


</div>




<div class="input-box">


<label>

Phone Number

</label>


<div class="phone-input">


<input

class="country-code"

value="+63"

readonly>


<input
type="tel"
id="registerPhone"
placeholder="9XXXXXXXXX">


</div>


</div>


<div class="input-box">

<label>
Referral Code (Optional)
</label>

<input
type="text"
id="referralCode"
placeholder="Enter referral code">

</div>



<div class="input-box">


<label>

Password

</label>


<div class="password-wrap">


<input

type="password"

id="registerPassword"

placeholder="Create password">


<span

class="eye"

onclick="togglePassword('registerPassword',this)">

👁

</span>


</div>


</div>




<button
type="button"
id="registerBtn"
class="btn gold-btn">

✈ CREATE ACCOUNT

</button>



</form>




<div class="footer">

<strong>

SkyRent

</strong>

© 2026

<br>

Dream • Save • Fly • Earn

</div>



</div>


</div>





<script>





function showLogin(){


document
.getElementById("loginForm")
.classList.add("active");


document
.getElementById("registerForm")
.classList.remove("active");


document
.querySelectorAll(".tab")[0]
.classList.add("active");


document
.querySelectorAll(".tab")[1]
.classList.remove("active");


document
.getElementById("title")
.innerText="Welcome Back";


document
.getElementById("subtitle")
.innerText="Login to your SkyRent account";


}



function showRegister(){


document
.getElementById("registerForm")
.classList.add("active");


document
.getElementById("loginForm")
.classList.remove("active");


document
.querySelectorAll(".tab")[1]
.classList.add("active");


document
.querySelectorAll(".tab")[0]
.classList.remove("active");


document
.getElementById("title")
.innerText="Join SkyRent";


document
.getElementById("subtitle")
.innerText="Create your account today";


}





function togglePassword(id,icon){


let input=document.getElementById(id);


if(input.type==="password"){


input.type="text";

icon.innerHTML="🙈";


}

else{


input.type="password";

icon.innerHTML="👁";


}


}

// AUTO FILL REFERRAL CODE FROM LINK
// Example: yoursite.com/?ref=ABC123

window.onload = function(){

    const params = new URLSearchParams(window.location.search);

    const referral = params.get("ref");

    if(referral){

        document.getElementById("referralCode").value =
        referral.toUpperCase();

    }

};



</script>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getAuth 
} 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
getFirestore 
} 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",
  authDomain: "skyrent-ea30c.firebaseapp.com",
  projectId: "skyrent-ea30c",
  storageBucket: "skyrent-ea30c.firebasestorage.app",
  messagingSenderId: "572678456448",
  appId: "1:572678456448:web:6b7132351515742dd09265"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


import { 
createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


document.getElementById("registerBtn").addEventListener("click", async()=>{

const name = document.getElementById("registerName").value;

const phone = document.getElementById("registerPhone").value;

const password = document.getElementById("registerPassword").value;

const referral = document.getElementById("referralCode").value;


if(!name || !phone || !password){

alert("Please complete all required fields");

return;

}


try{


// Firebase requires email, so we create a hidden email from phone

const email = phone + "@skyrent.com";


const userCredential = await createUserWithEmailAndPassword(
auth,
email,
password
);


const user = userCredential.user;


// Save user data

await setDoc(doc(db,"users",user.uid),{

name:name,

phone:"+63"+phone,

referralCode:referral,

bonus:50,

balance:50,

createdAt:new Date()

});


alert("Account created successfully! ₱50 bonus added.");


showLogin();


}

catch(error){

if(error.code === "auth/email-already-in-use"){

alert("This phone number is already registered. Please login or use another number.");

}

else if(error.code === "auth/weak-password"){

alert("Password is too weak. Please use at least 6 characters.");

}

else{

alert("Registration failed. Please try again.");

}

}


});



console.log("Firebase Connected");

</script>



</body>

</html>
