<!DOCTYPE html>
<html lang="en">

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Login</title>



<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

font-family:'Inter', Arial, Helvetica, sans-serif;

min-height:100vh;

background:
linear-gradient(
rgba(0,90,180,.65),
rgba(0,90,180,.85)
),
url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1200&q=80");

background-size:cover;

background-position:center;

}


.hero{

height:55vh;

color:white;

text-align:center;

padding:35px 20px;

}

.logo{

font-size:48px;

font-weight:600;

letter-spacing:-1px;

}

.logo span{

color:#63d5ff;

}


.tag{

letter-spacing:5px;

margin-top:10px;

font-size:14px;

}


.hero h1{

margin-top:70px;

font-size:45px;

font-weight:400;

letter-spacing:-1px;

}

.hero h1 span{

color:#ffd83d;

}


.hero p{

font-size:20px;

margin-top:25px;

line-height:1.6;

}


.features{

margin-top:40px;

font-weight:bold;

font-size:18px;

}


.card{

background:white;

border-radius:35px 35px 0 0;

min-height:50vh;

padding:35px 25px;

}


.title{

text-align:center;

}


.title h2{

font-size:38px;

color:#06377d;

font-weight:500;

letter-spacing:-0.5px;

}


.title p{

color:#777;

font-size:20px;

margin-top:10px;

}



.tabs{

display:flex;

background:#edf5ff;

border-radius:15px;

padding:5px;

margin:35px 0;

}


.tabs button{

flex:1;

border:0;

padding:18px;

font-weight:500;

font-size:18px;

border-radius:12px;

background:none;

color:#12519a;

}


.tabs .active{

background:#0756ad;

color:white;

}



.input{

margin-bottom:20px;

}


label{

display:block;

font-weight:500;

color:#173d70;

margin-bottom:8px;

}


.phone{

display:flex;

gap:10px;

}


input{

width:100%;

padding:18px;

border-radius:15px;

border:2px solid #dbe7f5;

font-size:17px;

outline:none;

}


.code{

width:80px;

background:#f4f8ff;

text-align:center;

font-weight:bold;

}


.password{

position:relative;

}


.eye{

position:absolute;

right:20px;

top:18px;

cursor:pointer;

}


.btn{

width:100%;

padding:18px;

border:0;

border-radius:15px;

background:linear-gradient(
135deg,
#06499b,
#0095ff
);

color:white;

font-size:18px;

font-weight:bold;

margin-top:10px;

}


.form{

display:none;

}


.form.active{

display:block;

}


</style>

</head>


<body>


<div class="hero">


<div class="logo">

✈ Sky<span>Rent</span>

</div>


<div class="tag">

DREAM • SAVE • FLY • EARN

</div>



<h1>

Invest Today,

<br>

<span>Fly Tomorrow</span>

</h1>


<p>

Turn your savings into real opportunities.

<br>

Choose your craft and start your journey with SkyRent.

</p>


<div class="features">

✓ Save &nbsp;&nbsp;

✓ Invest &nbsp;&nbsp;

✓ Earn &nbsp;&nbsp;

✓ Fly

</div>


</div>



<div class="card">


<div class="title">

<h2 id="title">

Welcome Back

</h2>


<p id="subtitle">

Login to your SkyRent account

</p>


</div>



<div class="tabs">

<button 
class="active"
onclick="showLogin()">

LOGIN

</button>


<button onclick="showRegister()">

REGISTER

</button>

</div>



<div id="login" class="form active">


<div class="input">

<label>

Phone Number

</label>


<div class="phone">

<input class="code" value="+63" readonly>

<input placeholder="9XXXXXXXXX">

</div>

</div>


<div class="input">

<label>

Password

</label>


<div class="password">

<input type="password" id="pass" placeholder="Enter your password">

<span class="eye" onclick="eye()">

👁

</span>


</div>

</div>



<button class="btn">

✈ LOGIN

</button>


</div>




<div id="register" class="form">


<div class="input">

<label>

Full Name

</label>

<input placeholder="Enter your name">

</div>



<div class="input">

<label>

Phone Number

</label>

<div class="phone">

<input class="code" value="+63" readonly>

<input placeholder="9XXXXXXXXX">

</div>

</div>



<div class="input">

<label>

Password

</label>

<input type="password" placeholder="Create password">

</div>



<button class="btn">

✈ CREATE ACCOUNT

</button>


</div>



</div>



<script>


function showLogin(){

document.getElementById("login")
.classList.add("active");

document.getElementById("register")
.classList.remove("active");


}


function showRegister(){

document.getElementById("register")
.classList.add("active");

document.getElementById("login")
.classList.remove("active");


}


function eye(){

let p=document.getElementById("pass");

p.type =
p.type==="password"
?
"text"
:
"password";

}


</script>


</body>

</html>
