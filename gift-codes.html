<script type="module">


/* =====================================================

/* =====================================================

const firebaseConfig = {

};



/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserData = null;



/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value){

    let number =
        Number(value);

    if(
        !Number.isFinite(number)
    ){

        number = 0;

    }

    return "₱" +
        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}



/* =====================================================
   NUMBER VALUE
===================================================== */

function numberValue(value){

    if(
        typeof value === "string"
    ){

        value =
            value
            .replace(/₱/g,"")
            .replace(/,/g,"")
            .trim();

    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}



/* =====================================================
   TIMESTAMP
===================================================== */

function timestampValue(value){

    if(!value){

        return 0;

    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(value instanceof Date){

        return value.getTime();

    }


    if(typeof value === "number"){

        return value;

    }


    if(typeof value === "string"){

        const parsed =
            Date.parse(value);

        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }


    return 0;

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    const time =
        timestampValue(value);


    if(!time){

        return "Processing";

    }


    return new Date(time)
        .toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );

}



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    if(!message){

        return;

    }


    message.textContent =
        text;


    message.className =

        type;

}



/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage(){

    const message =
        document.getElementById(
            "message"
        );


    if(message){

        message.textContent =
            "";

        message.className =
            "message";

    }

}



/* =====================================================
   UPDATE BALANCE DISPLAY
===================================================== */

function updateBalanceDisplay(){

    const balanceElement =
        document.getElementById(
            "balanceValue"
        );


    if(!balanceElement){

        return;

    }


    const balance =
        numberValue(
            currentUserData?.balance
        );


    balanceElement.textContent =

}



/* =====================================================
   LOAD USER DATA
===================================================== */

async function loadUserData(){

    if(!currentUser){

        return;

    }


    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const userSnap =
        await getDoc(
            userRef
        );


    if(!userSnap.exists()){

        throw new Error(
            "SkyRent user account was not found."
        );

    }


    currentUserData =
        userSnap.data();


    updateBalanceDisplay();

}



/* =====================================================
   GET GIFT CODE
===================================================== */

async function findGiftCode(code){

    /*
       First try document ID.

       This works when your admin creates
       the gift-code document using the code
       as its document ID.
    */

    const directRef =
        doc(
            db,
            "giftCodes",
            code
        );


    const directSnap =
        await getDoc(
            directRef
        );


    if(directSnap.exists()){

        return {

            id:directSnap.id,

            ref:directRef,

            data:directSnap.data()

        };

    }


    /*
       If the document ID isn't the code,
       search the "code" field.
    */

    const codesRef =
        collection(
            db,
            "giftCodes"
        );


    const codesQuery =
        query(
            codesRef,
            where(
                "code",
                "==",
                code
            )
        );


    const snapshot =
        await getDocs(
            codesQuery
        );


    if(snapshot.empty){

        return null;

    }


    const first =
        snapshot.docs[0];


    return {

        id:first.id,

        ref:first.ref,

        data:first.data()

    };

}



/* =====================================================
   REDEEM GIFT CODE
===================================================== */

async function redeemGiftCode(){

    if(!currentUser){

        showMessage(
            "Please login first.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "giftCode"
        );


    const button =
        document.getElementById(
            "redeemButton"
        );


    if(!input || !button){

        return;

    }


    const code =
        input.value
            .trim()
            .toUpperCase();


    clearMessage();


    if(!code){

        showMessage(
            "Please enter a gift code.",
            "error"
        );

        return;

    }


    /*
       Show loading.
    */

    button.disabled =
        true;

    button.classList.add(
        "loading"
    );

    button.innerHTML = `

        <span class="spinner"></span>

        <span>
            Redeeming Gift Code...
        </span>

    `;


    try{


        /*
           Find the gift code.
        */

        const gift =
            await findGiftCode(code);


        if(!gift){

            throw new Error(
                "Invalid gift code."
            );

        }


        const giftData =
            gift.data;


        /*
           Check active status.
        */

        if(
            giftData.active === false ||
            giftData.status === "inactive" ||
            giftData.status === "disabled"
        ){

            throw new Error(
                "This gift code is no longer active."
            );

        }


        /*
           Get reward amount.
        */

        const reward =
            numberValue(
                giftData.amount ??
                giftData.reward ??
                giftData.value
            );


        if(reward <= 0){

            throw new Error(
                "This gift code has an invalid reward amount."
            );

        }


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const giftRef =
            gift.ref;


        /*
           ================================================
           FIRESTORE TRANSACTION
           ================================================
        */

        const result =
            await runTransaction(
                db,
                async function(transaction){

                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    const giftSnap =
                        await transaction.get(
                            giftRef
                        );


                    if(!userSnap.exists()){

                        throw new Error(
                            "User account was not found."
                        );

                    }


                    if(!giftSnap.exists()){

                        throw new Error(
                            "Gift code was not found."
                        );

                    }


                    const userData =
                        userSnap.data();


                    const freshGiftData =
                        giftSnap.data();


                    /*
                       Check active status again
                       inside the transaction.
                    */

                    if(
                        freshGiftData.active === false ||
                        freshGiftData.status === "inactive" ||
                        freshGiftData.status === "disabled"
                    ){

                        throw new Error(
                            "This gift code is no longer active."
                        );

                    }


                    /*
                       =====================================
                       USED BY ARRAY
                       =====================================
                    */

                    let usedBy =
                        Array.isArray(
                            freshGiftData.usedBy
                        )
                        ? [
                            ...freshGiftData.usedBy
                        ]
                        : [];


                    /*
                       Prevent duplicate redemption.
                    */

                    if(
                        usedBy.includes(
                            currentUser.uid
                        )
                    ){

                        throw new Error(
                            "You have already redeemed this gift code."
                        );

                    }


                    /*
                       Some admin systems may use
                       maxUses instead.
                    */

                    const maxUses =
                        numberValue(
                            freshGiftData.maxUses
                        );


                    if(
                        maxUses > 0 &&
                        usedBy.length >= maxUses
                    ){

                        throw new Error(
                            "This gift code has reached its redemption limit."
                        );

                    }


                    /*
                       =====================================
                       GET CURRENT BALANCE
                       =====================================
                    */

                    const oldBalance =
                        numberValue(
                            userData.balance
                        );


                    const newBalance =
                        oldBalance +
                        reward;


                    /*
                       =====================================
                       UPDATE USER
                       =====================================
                    */

                    transaction.update(
                        userRef,
                        {
                            balance:newBalance
                        }
                    );


                    /*
                       =====================================
                       MARK CODE AS USED BY USER
                       =====================================
                    */

                    usedBy.push(
                        currentUser.uid
                    );


                    transaction.update(
                        giftRef,
                        {
                            usedBy:usedBy
                        }
                    );


                    return {

                        reward:reward,

                        newBalance:newBalance

                    };

                }
            );


        /*
           ================================================
           UPDATE LOCAL BALANCE
           ================================================
        */

        if(currentUserData){

            currentUserData.balance =
                result.newBalance;

        }


        updateBalanceDisplay();


        /*
           ================================================
           CREATE EARNINGS RECORD
           ================================================
        */

        try{

            await addDoc(
                collection(
                    db,
                    "earnings"
                ),
                {

                    userId:
                        currentUser.uid,

                    userPhone:
                        currentUserData?.phone || "",

                    userName:
                        currentUserData?.name || "",

                    type:
                        "gift code",

                    name:
                        "Gift Code",

                    amount:
                        result.reward,

                    giftCode:
                        code,

                    createdAt:
                        serverTimestamp()

                }
            );

        }
        catch(historyError){

            console.error(
                "Gift code earnings history error:",
                historyError
            );

        }


        /*
           ================================================
           SUCCESS
           ================================================
        */

        input.value =
            "";


        showMessage(
            "🎁 Gift code redeemed successfully! " +
            formatMoney(result.reward) +
            " has been added to your balance.",
            "success"
        );


        /*
           Reload history.
        */

        await loadRedeemedHistory();


    }
    catch(error){

        console.error(
            "Gift code redemption error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to redeem this gift code.",
            "error"
        );

    }
    finally{

        /*
           Restore button.
        */

        button.disabled =
            false;

        button.classList.remove(
            "loading"
        );

        button.innerHTML =
            "🎁 Redeem Gift Code";

    }

}



/* =====================================================
   LOAD REDEEMED HISTORY
===================================================== */

async function loadRedeemedHistory(){

    if(!currentUser){

        return;

    }


    const list =
        document.getElementById(
            "historyList"
        );


    if(!list){

        return;

    }


    list.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ⏳
            </div>

            <h3>
                Loading History
            </h3>

            <p>
                Please wait...
            </p>

        </div>

    `;


    try{


        /*
           Gift-code earnings are already
           saved in the earnings collection.

           We use that collection for the
           history so it matches earnings.html.
        */

        const earningsRef =
            collection(
                db,
                "earnings"
            );


        const earningsQuery =
            query(
                earningsRef,
                where(
                    "userId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                earningsQuery
            );


        const giftEarnings = [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                const type =
                    String(
                        data.type || ""
                    )
                    .toLowerCase();


                if(
                    type.includes("gift")
                ){

                    giftEarnings.push({

                        id:
                            docSnap.id,

                        ...data

                    });

                }

            }
        );


        giftEarnings.sort(
            function(a,b){

                return (
                    timestampValue(
                        b.createdAt
                    )
                    -
                    timestampValue(
                        a.createdAt
                    )
                );

            }
        );


        if(
            giftEarnings.length === 0
        ){

            list.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🎁
                    </div>

                    <h3>
                        No Gift Codes Yet
                    </h3>

                    <p>
                        Your redeemed gift codes
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML =
            "";


        giftEarnings.forEach(
            function(earning){

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "history-card";


                const code =
                    earning.giftCode ||
                    "Gift Code";


                const amount =
                    numberValue(
                        earning.amount
                    );


                card.innerHTML = `

                    <div class="history-left">

                        <div class="history-code">

                            🎁
                            ${escapeHTML(code)}

                        </div>

                        <div class="history-date">

                            ${formatDate(
                                earning.createdAt
                            )}

                        </div>

                    </div>


                    <div class="history-right">

                        <div class="history-amount">

                            +${formatMoney(amount)}

                        </div>

                        <div class="redeemed-label">

                            REDEEMED

                        </div>

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


    }
    catch(error){

        console.error(
            "Gift code history error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to Load History
                </h3>

                <p>
                    Please refresh the page
                    and try again.
                </p>

            </div>

        `;

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        try{

            await loadUserData();

            await loadRedeemedHistory();

        }
        catch(error){

            console.error(
                "Gift page initialization error:",
                error
            );


            showMessage(
                "Unable to load your SkyRent account.",
                "error"
            );

        }

    }
);
