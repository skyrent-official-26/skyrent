<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SkyRent - Password Reset</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =====================================================
   BODY
===================================================== */

body{
    font-family:"Inter","Segoe UI",Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #052b78,
        #0074d9 55%,
        #7edfff
    );
    padding:20px;
    color:#183c70;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    background:#ffffff;
    border-radius:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
    overflow:hidden;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(
        135deg,
        #06499b,
        #0789e8
    );
    color:white;
    padding:25px 22px;
    text-align:center;
}

.header h1{
    font-size:25px;
    margin-bottom:7px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    padding:20px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-box{
    position:relative;
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:15px 16px;
    border:2px solid #dce7f5;
    border-radius:14px;
    outline:none;
    font-size:15px;
}

.search-box input:focus{
    border-color:#0874db;
}

/* =====================================================
   MEMBER COUNT
===================================================== */

.member-count{
    font-size:13px;
    color:#718096;
    margin-bottom:12px;
}

/* =====================================================
   MEMBER CARD
===================================================== */

.member-card{
    border:1px solid #e1eaf5;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    background:#f9fcff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

/* =====================================================
   MEMBER INFO
===================================================== */

.member-info{
    min-width:0;
    flex:1;
}

.member-name{
    color:#062b78;
    font-size:16px;
    font-weight:700;
    margin-bottom:5px;
    word-break:break-word;
}

.member-phone{
    color:#68778c;
    font-size:14px;
}

/* =====================================================
   RESET BUTTON
===================================================== */

.reset-btn{
    border:none;
    padding:11px 14px;
    border-radius:11px;

    background:linear-gradient(
        135deg,
        #06499b,
        #0789e8
    );

    color:white;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

.reset-btn:active{
    transform:scale(.97);
}

.reset-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;
    padding:35px 20px;
    color:#65758b;
    font-size:14px;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;
    padding:35px 20px;
    color:#718096;
    font-size:14px;
}

/* =====================================================
   ERROR
===================================================== */

.error{
    background:#fff0f0;
    border:1px solid #ffcaca;
    color:#b42323;
    border-radius:13px;
    padding:15px;
    text-align:center;
    font-size:14px;
}

/* =====================================================
   MODAL
===================================================== */

.modal-overlay{
    position:fixed;
    inset:0;

    background:rgba(3,20,55,.68);

    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:9999;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:400px;

    background:white;

    border-radius:22px;

    padding:25px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

.modal h2{
    color:#062b78;
    font-size:22px;
    margin-bottom:7px;
}

.modal-subtitle{
    color:#718096;
    font-size:13px;
    margin-bottom:20px;
    line-height:1.5;
}

/* =====================================================
   FORM
===================================================== */

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    color:#183c70;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

/* =====================================================
   PASSWORD WRAPPER
===================================================== */

.password-wrap{
    position:relative;
    width:100%;
}

/* =====================================================
   PASSWORD INPUT
===================================================== */

.password-wrap input{
    width:100%;
    padding:14px 50px 14px 14px;

    border:2px solid #dce7f5;
    border-radius:12px;

    outline:none;

    font-size:15px;
}

.password-wrap input:focus{
    border-color:#0874db;
}

/* =====================================================
   SHOW / HIDE PASSWORD BUTTON
===================================================== */

.password-toggle{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    border:none;
    background:transparent;

    cursor:pointer;

    font-size:20px;

    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;
}

.password-toggle:active{
    background:#edf5ff;
}

/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-btn{
    flex:1;
    border:none;
    padding:14px;

    border-radius:12px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

.cancel-btn{
    background:#edf2f7;
    color:#425466;
}

.confirm-btn{
    background:linear-gradient(
        135deg,
        #06499b,
        #0789e8
    );
    color:white;
}

.confirm-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =====================================================
   MODAL MESSAGE
===================================================== */

.modal-message{
    margin-top:12px;

    font-size:13px;

    line-height:1.5;

    display:none;
}

.modal-message.error-message{
    display:block;
    color:#c62828;
}

.modal-message.success-message{
    display:block;
    color:#188044;
}

/* =====================================================
   SPINNER
===================================================== */

.spinner{
    display:inline-block;

    width:16px;
    height:16px;

    border:3px solid rgba(255,255,255,.35);

    border-top-color:#ffffff;

    border-radius:50%;

    animation:spin .8s linear infinite;

    vertical-align:middle;

    margin-right:7px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:520px){

    body{
        padding:10px;
    }

    .member-card{
        align-items:flex-start;
    }

    .reset-btn{
        padding:10px 11px;
        font-size:12px;
    }

    .member-name{
        font-size:15px;
    }

    .member-phone{
        font-size:13px;
    }

    .modal{
        padding:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <h1>
            🔐 Password Reset
        </h1>

        <p>
            SkyRent Member Account Management
        </p>

    </div>


    <div class="content">

        <!-- =================================================
             SEARCH
        ================================================= -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search name or phone number..."
                autocomplete="off"
            >

        </div>


        <!-- =================================================
             COUNT
        ================================================= -->

        <div
            class="member-count"
            id="memberCount"
        >
            Loading members...
        </div>


        <!-- =================================================
             MEMBERS
        ================================================= -->

        <div id="membersList">

            <div class="loading">
                Loading members...
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     RESET PASSWORD MODAL
===================================================== -->

<div
    id="resetModal"
    class="modal-overlay"
>

    <div class="modal">

        <h2>
            🔑 Reset Password
        </h2>


        <div
            class="modal-subtitle"
            id="selectedMember"
        >
            Member
        </div>


        <!-- =================================================
             NEW PASSWORD
        ================================================= -->

        <div class="input-group">

            <label>
                New Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="newPasswordToggle"
                    onclick="togglePassword(
                        'newPassword',
                        'newPasswordToggle'
                    )"
                    aria-label="Show or hide password"
                >
                    👁
                </button>

            </div>

        </div>


        <!-- =================================================
             CONFIRM PASSWORD
        ================================================= -->

        <div class="input-group">

            <label>
                Confirm New Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Re-enter new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="confirmPasswordToggle"
                    onclick="togglePassword(
                        'confirmNewPassword',
                        'confirmPasswordToggle'
                    )"
                    aria-label="Show or hide password"
                >
                    👁
                </button>

            </div>

        </div>


        <!-- =================================================
             MESSAGE
        ================================================= -->

        <div
            id="modalMessage"
            class="modal-message"
        ></div>


        <!-- =================================================
             BUTTONS
        ================================================= -->

        <div class="modal-buttons">

            <button
                type="button"
                class="modal-btn cancel-btn"
                id="cancelResetBtn"
            >
                Cancel
            </button>


            <button
                type="button"
                class="modal-btn confirm-btn"
                id="confirmResetBtn"
            >
                🔑 Reset Password
            </button>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getFunctions,
    httpsCallable
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const functions =
    getFunctions(app);


/* =====================================================
   ADMIN UID
===================================================== */

const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =====================================================
   ELEMENTS
===================================================== */

const membersList =
    document.getElementById(
        "membersList"
    );

const memberCount =
    document.getElementById(
        "memberCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const resetModal =
    document.getElementById(
        "resetModal"
    );

const selectedMember =
    document.getElementById(
        "selectedMember"
    );

const newPassword =
    document.getElementById(
        "newPassword"
    );

const confirmNewPassword =
    document.getElementById(
        "confirmNewPassword"
    );

const modalMessage =
    document.getElementById(
        "modalMessage"
    );

const confirmResetBtn =
    document.getElementById(
        "confirmResetBtn"
    );

const cancelResetBtn =
    document.getElementById(
        "cancelResetBtn"
    );


/* =====================================================
   MEMBERS
===================================================== */

let allMembers = [];

let selectedUser = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

window.togglePassword =
    function(
        inputId,
        buttonId
    ){

        const input =
            document.getElementById(
                inputId
            );

        const button =
            document.getElementById(
                buttonId
            );


        if(!input || !button){

            return;

        }


        if(input.type === "password"){

            input.type = "text";

            button.innerHTML = "🙈";

            button.setAttribute(
                "aria-label",
                "Hide password"
            );

        }
        else{

            input.type = "password";

            button.innerHTML = "👁";

            button.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    };


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers(){

    membersList.innerHTML = `

        <div class="loading">
            Loading members...
        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allMembers = [];


        snapshot.forEach(

            snap => {

                const data =
                    snap.data();


                allMembers.push({

                    uid:
                        snap.id,

                    name:
                        data.name ||
                        "Unnamed Member",

                    phone:
                        data.phone ||
                        ""

                });

            }

        );


        allMembers.sort(

            (a,b) =>

                String(a.name)

                    .localeCompare(
                        String(b.name)
                    )

        );


        renderMembers(
            allMembers
        );

    }
    catch(error){

        console.error(
            "Load members error:",
            error
        );


        membersList.innerHTML = `

            <div class="error">

                ❌ Unable to load members.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Firebase error"
                )}

            </div>

        `;


        memberCount.textContent =
            "Unable to load members.";

    }

}


/* =====================================================
   RENDER MEMBERS
===================================================== */

function renderMembers(
    members
){

    memberCount.textContent =

        `${members.length} member${
            members.length === 1
                ? ""
                : "s"
        }`;


    if(!members.length){

        membersList.innerHTML = `

            <div class="empty">

                No members found.

            </div>

        `;

        return;

    }


    membersList.innerHTML =

        members.map(

            member => `

                <div class="member-card">

                    <div class="member-info">

                        <div class="member-name">

                            ${escapeHTML(
                                member.name
                            )}

                        </div>

                        <div class="member-phone">

                            📱
                            ${escapeHTML(
                                member.phone ||
                                "No phone number"
                            )}

                        </div>

                    </div>


                    <button
                        type="button"
                        class="reset-btn"
                        data-uid="${escapeHTML(
                            member.uid
                        )}"
                    >

                        🔑 Reset

                    </button>

                </div>

            `

        ).join("");


    document
        .querySelectorAll(
            ".reset-btn"
        )
        .forEach(

            button => {

                button.addEventListener(

                    "click",

                    function(){

                        const uid =
                            this.dataset.uid;


                        const member =
                            allMembers.find(

                                item =>
                                    item.uid === uid

                            );


                        if(member){

                            openResetModal(
                                member
                            );

                        }

                    }

                );

            }

        );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(

    "input",

    function(){

        const search =
            this.value
                .trim()
                .toLowerCase();


        if(!search){

            renderMembers(
                allMembers
            );

            return;

        }


        const filtered =
            allMembers.filter(

                member => {

                    const name =
                        String(
                            member.name ||
                            ""
                        ).toLowerCase();


                    const phone =
                        String(
                            member.phone ||
                            ""
                        ).toLowerCase();


                    return (

                        name.includes(
                            search
                        )

                        ||

                        phone.includes(
                            search
                        )

                    );

                }

            );


        renderMembers(
            filtered
        );

    }

);


/* =====================================================
   OPEN RESET MODAL
===================================================== */

function openResetModal(
    member
){

    selectedUser =
        member;


    selectedMember.innerHTML = `

        Reset password for

        <strong>
            ${escapeHTML(
                member.name
            )}
        </strong>

        <br>

        📱
        ${escapeHTML(
            member.phone
        )}

    `;


    newPassword.value = "";

    confirmNewPassword.value = "";


    /* Reset password visibility */

    newPassword.type =
        "password";

    confirmNewPassword.type =
        "password";


    document.getElementById(
        "newPasswordToggle"
    ).innerHTML = "👁";


    document.getElementById(
        "confirmPasswordToggle"
    ).innerHTML = "👁";


    modalMessage.className =
        "modal-message";

    modalMessage.innerText =
        "";


    confirmResetBtn.disabled =
        false;

    confirmResetBtn.innerHTML =
        "🔑 Reset Password";


    resetModal.classList.add(
        "show"
    );


    setTimeout(

        () => {

            newPassword.focus();

        },

        100

    );

}


/* =====================================================
   CLOSE RESET MODAL
===================================================== */

function closeResetModal(){

    resetModal.classList.remove(
        "show"
    );


    selectedUser =
        null;


    newPassword.value =
        "";

    confirmNewPassword.value =
        "";


    newPassword.type =
        "password";

    confirmNewPassword.type =
        "password";


    document.getElementById(
        "newPasswordToggle"
    ).innerHTML = "👁";


    document.getElementById(
        "confirmPasswordToggle"
    ).innerHTML = "👁";


    modalMessage.className =
        "modal-message";

    modalMessage.innerText =
        "";

}


/* =====================================================
   CANCEL
===================================================== */

cancelResetBtn.addEventListener(

    "click",

    closeResetModal

);


/* =====================================================
   CLOSE WHEN CLICKING OUTSIDE
===================================================== */

resetModal.addEventListener(

    "click",

    function(event){

        if(
            event.target ===
            resetModal
        ){

            closeResetModal();

        }

    }

);


/* =====================================================
   RESET PASSWORD
===================================================== */

confirmResetBtn.addEventListener(

    "click",

    async function(){

        if(!selectedUser){

            return;

        }


        const password =
            newPassword.value;


        const confirmation =
            confirmNewPassword.value;


        /* =============================================
           PASSWORD LENGTH
        ============================================= */

        if(password.length < 6){

            showModalError(
                "Password must contain at least 6 characters."
            );

            return;

        }


        /* =============================================
           MATCH
        ============================================= */

        if(password !== confirmation){

            showModalError(
                "Passwords do not match."
            );

            return;

        }


        /* =============================================
           CONFIRM ACTION
        ============================================= */

        const confirmed =
            confirm(

                "Reset the password for " +

                selectedUser.name +

                "?\n\n" +

                "The member will need to use " +

                "the new password when logging in."

            );


        if(!confirmed){

            return;

        }


        confirmResetBtn.disabled =
            true;


        confirmResetBtn.innerHTML = `

            <span class="spinner"></span>

            RESETTING...

        `;


        modalMessage.className =
            "modal-message";


        modalMessage.innerText =
            "";


        try{

            /* =========================================
               CALL SECURE FIREBASE FUNCTION
            ========================================= */

            const resetMemberPassword =
                httpsCallable(
                    functions,
                    "resetMemberPassword"
                );


            const result =
                await resetMemberPassword({

                    targetUid:
                        selectedUser.uid,

                    newPassword:
                        password

                });


            console.log(
                "Password reset:",
                result.data
            );


            modalMessage.className =
                "modal-message success-message";


            modalMessage.innerText =
                "✅ Password reset successfully.";


            confirmResetBtn.innerHTML =
                "✓ Password Reset";


            setTimeout(

                () => {

                    closeResetModal();

                },

                1600

            );

        }
        catch(error){

            console.error(
                "Password reset error:",
                error
            );


            let message =
                "Unable to reset password.";


            if(
                error.code ===
                "functions/permission-denied"
            ){

                message =
                    "You are not authorized to reset passwords.";

            }
            else if(
                error.code ===
                "functions/unauthenticated"
            ){

                message =
                    "Your admin session has expired. Please login again.";

            }
            else if(
                error.code ===
                "functions/invalid-argument"
            ){

                message =
                    error.message ||
                    "Invalid password or member.";

            }
            else if(error.message){

                message =
                    error.message;

            }


            showModalError(
                message
            );


            confirmResetBtn.disabled =
                false;


            confirmResetBtn.innerHTML =
                "🔑 Reset Password";

        }

    }

);


/* =====================================================
   MODAL ERROR
===================================================== */

function showModalError(
    message
){

    modalMessage.className =
        "modal-message error-message";


    modalMessage.innerText =
        "❌ " + message;

}


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

onAuthStateChanged(

    auth,

    async function(user){

        if(!user){

            window.location.href =
                "admin-login.html";

            return;

        }


        console.log(
            "Currently logged-in Firebase UID:",
            user.uid
        );


        console.log(
            "Configured ADMIN_UID:",
            ADMIN_UID
        );


        if(
            user.uid !== ADMIN_UID
        ){

            document.getElementById(
                "membersList"
            ).innerHTML = `

                <div class="error">

                    ❌ Admin verification failed.

                    <br><br>

                    This page is using a different
                    ADMIN_UID.

                    <br><br>

                    <small>

                        Logged-in UID:

                        ${escapeHTML(
                            user.uid
                        )}

                    </small>

                </div>

            `;


            document.getElementById(
                "memberCount"
            ).textContent =
                "Admin verification failed.";


            return;

        }


        console.log(
            "✅ Admin verified."
        );


        await loadMembers();

    }

);

</script>

</body>

</html>
