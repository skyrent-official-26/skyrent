/* =====================================================

.empty-icon{

.loading{

/* =====================================================

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
    "skyrent-ea30c.firebaseapp.com",

    projectId:
    "skyrent-ea30c",

    storageBucket:
    "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
    "572678456448",

    appId:
    "1:572678456448:web:6b7132351515742dd09265"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentUserData = null;

let allEarnings = [];


/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value){

    let number =
        Number(value);

    if(!Number.isFinite(number)){

        number = 0;

    }

    return "₱" +
        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   NUMBER VALUE
===================================================== */

function numberValue(value){

    if(typeof value === "string"){

        value =
            value
            .replace(/₱/g,"")
            .replace(/,/g,"")
            .trim();

    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   TIMESTAMP VALUE
===================================================== */

function timestampValue(value){

    if(!value){

        return 0;

    }


    if(
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }


    if(value instanceof Date){

        return value.getTime();

    }


    if(typeof value === "number"){

        return value;

    }


    if(typeof value === "string"){

        const parsed =
            Date.parse(value);

        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }


    return 0;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    const time =
        timestampValue(value);


    if(!time){

        return "Processing";

    }


    return new Date(time)
        .toLocaleDateString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric"
            }
        );

}


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(){

    const loading =
        document.getElementById(
            "loading"
        );


    if(loading){

        loading.style.display =
            "block";

    }

}


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading(){

    const loading =
        document.getElementById(
            "loading"
        );


    if(loading){

        loading.style.display =
            "none";

    }

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(){

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    if(errorBox){

        errorBox.style.display =
            "block";

    }

}


/* =====================================================
   NORMALIZE EARNING TYPE
===================================================== */

function normalizeType(type){

    const value =
        String(type || "")
        .trim()
        .toLowerCase();


    if(
        value.includes("registration") ||
        value.includes("welcome") ||
        value.includes("bonus")
    ){

        return "Registration Bonus";

    }


    if(
        value.includes("daily") ||
        value.includes("investment")
    ){

        return "Daily Investment";

    }


    if(
        value.includes("gift")
    ){

        return "Gift Code";

    }


    if(
        value.includes("commission") ||
        value.includes("referral")
    ){

        return "Referral Commission";

    }


    return type ||
        "Earning";

}


/* =====================================================
   GET BADGE CLASS
===================================================== */

function getBadgeClass(type){

    const normalized =
        normalizeType(type);


    if(
        normalized === "Registration Bonus"
    ){

        return "badge-registration";

    }


    if(
        normalized === "Daily Investment"
    ){

        return "badge-daily";

    }


    if(
        normalized === "Gift Code"
    ){

        return "badge-gift";

    }


    if(
        normalized === "Referral Commission"
    ){

        return "badge-commission";

    }


    return "badge-other";

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUserData(){

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const userSnap =
        await getDoc(userRef);


    if(!userSnap.exists()){

        throw new Error(
            "SkyRent user account was not found."
        );

    }


    currentUserData =
        userSnap.data();

}


/* =====================================================
   ADD REGISTRATION BONUS
===================================================== */

function addRegistrationBonus(){

    if(!currentUserData){

        return;

    }


    const bonus =
        numberValue(
            currentUserData.bonus
        );


    if(bonus <= 0){

        return;

    }


    /*
       Prevent duplicate registration bonus
       if it already exists in earnings.
    */

    const alreadyExists =
        allEarnings.some(
            function(item){

                const type =
                    String(
                        item.type || ""
                    )
                    .toLowerCase();


                return (
                    type.includes("registration") ||
                    type.includes("welcome")
                );

            }
        );


    if(alreadyExists){

        return;

    }


    allEarnings.push({

        id:
            "registration-bonus",

        type:
            "Registration Bonus",

        name:
            "Registration Bonus",

        amount:
            bonus,

        createdAt:
            currentUserData.createdAt || null,

        isRegistrationBonus:
            true

    });

}


/* =====================================================
   LOAD NORMAL EARNINGS
===================================================== */

async function loadFirestoreEarnings(){

    const earningsRef =
        collection(
            db,
            "earnings"
        );


    const earningsQuery =
        query(
            earningsRef,

            where(
                "userId",
                "==",
                currentUser.uid
            )
        );


    const snapshot =
        await getDocs(
            earningsQuery
        );


    snapshot.forEach(
        function(docSnap){

            const data =
                docSnap.data();


            allEarnings.push({

                id:
                    docSnap.id,

                ...data

            });

        }
    );

}


/* =====================================================
   LOAD REFERRAL COMMISSIONS
===================================================== */

async function loadReferralCommissions(){

    const commissionsRef =
        collection(
            db,
            "commissions"
        );


    /*
       IMPORTANT:

       We are reading the existing commission
       records created by Crafts.

       We do NOT create or modify any records.
    */

    const commissionsQuery =
        query(
            commissionsRef,

            where(
                "referrerId",
                "==",
                currentUser.uid
            )
        );


    const snapshot =
        await getDocs(
            commissionsQuery
        );


    snapshot.forEach(
        function(docSnap){

            const data =
                docSnap.data();


            const status =
                String(
                    data.status || ""
                )
                .trim()
                .toLowerCase();


            /*
               Only credited commissions
               are counted.
            */

            if(status !== "credited"){

                return;

            }


            const amount =
                numberValue(
                    data.commissionAmount ??
                    data.amount ??
                    data.commission ??
                    0
                );


            if(amount <= 0){

                return;

            }


            /*
               Only store the information
               needed by the Earnings page.
            */

            allEarnings.push({

                id:
                    "commission-" +
                    docSnap.id,

                type:
                    "Referral Commission",

                name:
                    "Referral Commission",

                amount:
                    amount,

                createdAt:
                    data.createdAt ||
                    data.date ||
                    null,

                isReferralCommission:
                    true

            });

        }
    );

}


/* =====================================================
   SORT EARNINGS
===================================================== */

function sortEarnings(){

    allEarnings.sort(
        function(a,b){

            return (

                timestampValue(
                    b.createdAt
                )

                -

                timestampValue(
                    a.createdAt
                )

            );

        }
    );

}


/* =====================================================
   CREATE FLIGHT BOARD ROW
===================================================== */

function createEarningRow(earning){

    const row =
        document.createElement("div");


    row.className =
        "flight-row";


    const type =
        normalizeType(
            earning.type
        );


    /*
       Referral commissions only show:
       Referral Commission + amount.
    */

    const displayName =
        earning.isReferralCommission
            ? "Referral Commission"
            : (
                earning.name ||
                earning.planName ||
                type
            );


    const amount =
        numberValue(
            earning.amount
        );


    const badgeClass =
        getBadgeClass(type);


    const dateText =
        formatDate(
            earning.createdAt
        );


    row.innerHTML = `

        <div class="flight-date">

            ${escapeHTML(dateText)}

        </div>


        <div class="flight-type">

            <div class="flight-type-main">

                ${escapeHTML(displayName)}

            </div>


            <span
                class="flight-type-badge ${badgeClass}"
            >

                ${escapeHTML(type)}

            </span>

        </div>


        <div class="flight-amount">

            +${formatMoney(amount)}

        </div>

    `;


    return row;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   RENDER EARNINGS
===================================================== */

function renderEarnings(){

    const list =
        document.getElementById(
            "earningsList"
        );


    if(!list){

        return;

    }


    list.innerHTML = "";


    if(allEarnings.length === 0){

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    ✈
                </div>

                <h3>
                    No Earnings Yet
                </h3>

                <p>
                    Your SkyRent earnings
                    will appear here.
                </p>

            </div>

        `;


        updateSummary();

        return;

    }


    allEarnings.forEach(
        function(earning){

            const row =
                createEarningRow(
                    earning
                );


            list.appendChild(row);

        }
    );


    updateSummary();

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(){

    let total = 0;


    allEarnings.forEach(
        function(earning){

            total +=
                numberValue(
                    earning.amount
                );

        }
    );


    const totalElement =
        document.getElementById(
            "totalEarnings"
        );


    if(totalElement){

        totalElement.textContent =
            formatMoney(total);

    }


    const countElement =
        document.getElementById(
            "earningCount"
        );


    if(countElement){

        const count =
            allEarnings.length;


        countElement.textContent =
            count +
            (
                count === 1
                    ? " earning recorded"
                    : " earnings recorded"
            );

    }

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEarnings(){

    if(!currentUser){

        return;

    }


    showLoading();


    const list =
        document.getElementById(
            "earningsList"
        );


    if(list){

        list.innerHTML = "";

    }


    try{

        /*
           Always start clean.
        */

        allEarnings = [];


        /*
           Load user data.
        */

        await loadUserData();


        /*
           Load normal earnings.

           Includes:
           - Daily Investment
           - Gift Code
           - Other existing earnings
        */

        await loadFirestoreEarnings();


        /*
           Load existing referral commissions.

           This does NOT modify Crafts,
           Network, or Firestore commission records.
        */

        await loadReferralCommissions();


        /*
           Add registration bonus.
        */

        addRegistrationBonus();


        /*
           Newest earnings first.
        */

        sortEarnings();


        /*
           Display Flight Board.
        */

        renderEarnings();

    }

    catch(error){

        console.error(
            "SkyRent Earnings loading error:",
            error
        );


        showError();


        if(list){

            list.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Unable to Load Earnings
                    </h3>

                    <p>
                        Please refresh the page
                        and try again.
                    </p>

                </div>

            `;

        }

    }

    finally{

        hideLoading();

    }

}

/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        await loadEarnings();

    }
);


/* =====================================================
   REFRESH WHEN PAGE BECOMES VISIBLE
===================================================== */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            !document.hidden &&
            currentUser
        ){

            await loadEarnings();

        }

    }
);

</script>
