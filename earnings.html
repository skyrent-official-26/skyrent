<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent</title>

<!-- SKYRENT APP ICON/ EARNINGS -->
<link rel="icon" type="image/png" href="skyrent.png">
<link rel="apple-touch-icon" href="skyrent.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SkyRent">
   
<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f5f9;
    color:#202124;
}


/* =====================================================
   TOP HEADER
===================================================== */

.header{
    background:linear-gradient(135deg,#061d3d,#0a315d);
    color:white;
    padding:22px 18px 25px;
    border-radius:0 0 25px 25px;
}

.header-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.header-icon{
    width:50px;
    height:50px;
    border-radius:15px;
    background:rgba(255,255,255,.10);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
}

.header-text h1{
    margin:0;
    font-size:21px;
}

.header-text p{
    margin:5px 0 0;
    font-size:12px;
    color:#a9c9e9;
}


/* =====================================================
   TOTAL EARNINGS CARD
===================================================== */

.total-card{
    margin:18px 14px 20px;

    background:white;

    border-radius:23px;

    padding:20px;

    box-shadow:0 5px 18px rgba(0,0,0,.07);

    border:1px solid #e5e7eb;
}

.total-label{
    color:#777;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.total-amount{
    margin-top:7px;

    color:#0757c9;

    font-size:30px;
    font-weight:800;
}

.total-sub{
    margin-top:7px;

    color:#999;
    font-size:11px;
}


/* =====================================================
   EARNINGS TITLE
===================================================== */

.section-title{
    margin:0 18px 12px;

    font-size:18px;

    color:#333;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    display:none;

    margin:0 14px 20px;

    background:white;

    border-radius:20px;

    padding:25px 20px;

    text-align:center;

    color:#777;

    font-size:13px;
}

.loading-spinner{
    width:27px;
    height:27px;

    margin:0 auto 10px;

    border:3px solid #e5edf7;
    border-top:3px solid #087be1;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   EARNING LIST
===================================================== */

.earnings-list{
    padding:0 14px 105px;
}


/* =====================================================
   EARNING CARD
===================================================== */

.earning-card{
    background:white;

    border-radius:19px;

    padding:16px;

    margin-bottom:11px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    box-shadow:0 3px 12px rgba(0,0,0,.05);

    border:1px solid #e8ebef;
}

.earning-left{
    min-width:0;
    flex:1;
}

.earning-name{
    color:#222;

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.earning-type{
    margin-top:5px;

    color:#888;

    font-size:11px;

    line-height:16px;
}

.earning-date{
    margin-top:3px;

    color:#aaa;

    font-size:10px;
}

.earning-right{
    text-align:right;

    flex-shrink:0;
}

.earning-amount{
    color:#159447;

    font-size:16px;

    font-weight:800;
}


/* =====================================================
   TYPE BADGES
===================================================== */

.type-badge{
    display:inline-block;

    margin-top:6px;

    padding:4px 8px;

    border-radius:8px;

    font-size:9px;

    font-weight:700;
}

.type-registration{
    background:#eaf3ff;
    color:#0757c9;
}

.type-daily{
    background:#e9f9ef;
    color:#16803c;
}

.type-gift{
    background:#fff3cd;
    color:#a96500;
}

.type-other{
    background:#f1f3f5;
    color:#666;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{
    background:white;

    border-radius:23px;

    padding:42px 20px;

    text-align:center;

    margin-bottom:20px;
}

.empty-icon{
    font-size:48px;

    margin-bottom:10px;
}

.empty h3{
    margin:5px 0 8px;

    font-size:19px;

    color:#666;
}

.empty p{
    margin:0;

    color:#888;

    font-size:13px;
}


/* =====================================================
   ERROR
===================================================== */

.error-box{
    display:none;

    background:#feecec;

    color:#c62828;

    border:1px solid #f5c2c2;

    border-radius:17px;

    padding:15px;

    margin:0 14px 18px;

    text-align:center;

    font-size:12px;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:76px;

    background:white;

    border-top:1px solid #ddd;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    z-index:1000;
}

.nav-item{
    border:none;

    background:white;

    color:#999;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    font-size:10px;

    cursor:pointer;
}

.nav-icon{
    font-size:23px;

    line-height:25px;

    margin-bottom:3px;
}

.nav-item.active{
    color:#168bdc;
}

.nav-item.active .nav-icon{
    color:#168bdc;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px){

    .header-text h1{
        font-size:19px;
    }

    .total-amount{
        font-size:27px;
    }

    .earning-name{
        font-size:13px;
    }

    .earning-amount{
        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<section class="header">

    <div class="header-top">

        <div class="header-icon">
            💰
        </div>

        <div class="header-text">

            <h1>
                Earnings
            </h1>

            <p>
                Your complete SkyRent earnings history
            </p>

        </div>

    </div>

</section>


<!-- =====================================================
     TOTAL EARNINGS
===================================================== -->

<section class="total-card">

    <div class="total-label">
        Total Earnings
    </div>

    <div
        class="total-amount"
        id="totalEarnings"
    >
        ₱0
    </div>

    <div
        class="total-sub"
        id="earningCount"
    >
        0 earnings recorded
    </div>

</section>


<!-- =====================================================
     SECTION TITLE
===================================================== -->

<h2 class="section-title">
    Earnings History
</h2>


<!-- =====================================================
     LOADING
===================================================== -->

<div
    id="loading"
    class="loading"
>

    <div class="loading-spinner"></div>

    Loading your earnings...

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="errorBox"
    class="error-box"
>
    Unable to load your earnings. Please try again.
</div>


<!-- =====================================================
     EARNINGS LIST
===================================================== -->

<main
    id="earningsList"
    class="earnings-list"
></main>


<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">

    <button
        class="nav-item"
        onclick="goHome()"
    >
        <span class="nav-icon">
            ⌂
        </span>
        Home
    </button>


    <button
        class="nav-item"
        onclick="goCrafts()"
    >
        <span class="nav-icon">
            ✈
        </span>
        Crafts
    </button>


    <button
        class="nav-item"
        onclick="goInvestment()"
    >
        <span class="nav-icon">
            ▤
        </span>
        Investment
    </button>


    <button
        class="nav-item"
        onclick="goNetwork()"
    >
        <span class="nav-icon">
            ➤
        </span>
        Network
    </button>


    <button
        class="nav-item active"
        onclick="goMine()"
    >
        <span class="nav-icon">
            •••
        </span>
        Mine
    </button>

</nav>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
    "skyrent-ea30c.firebaseapp.com",

    projectId:
    "skyrent-ea30c",

    storageBucket:
    "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
    "572678456448",

    appId:
    "1:572678456448:web:6b7132351515742dd09265"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentUserData = null;

let allEarnings = [];



/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value){

    let number = Number(value);

    if(!Number.isFinite(number)){
        number = 0;
    }

    return "₱" +
        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}



/* =====================================================
   NUMBER VALUE
===================================================== */

function numberValue(value){

    if(typeof value === "string"){

        value =
            value
            .replace(/₱/g,"")
            .replace(/,/g,"")
            .trim();

    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}



/* =====================================================
   TIMESTAMP VALUE
===================================================== */

function timestampValue(value){

    if(!value){
        return 0;
    }


    if(
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }


    if(value instanceof Date){

        return value.getTime();

    }


    if(typeof value === "number"){

        return value;

    }


    if(typeof value === "string"){

        const parsed =
            Date.parse(value);

        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }


    return 0;

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    const time =
        timestampValue(value);

    if(!time){

        return "Processing";

    }


    return new Date(time)
        .toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );

}



/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(){

    const loading =
        document.getElementById("loading");

    if(loading){

        loading.style.display =
            "block";

    }

}



/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading(){

    const loading =
        document.getElementById("loading");

    if(loading){

        loading.style.display =
            "none";

    }

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showError(){

    const errorBox =
        document.getElementById("errorBox");

    if(errorBox){

        errorBox.style.display =
            "block";

    }

}



/* =====================================================
   NORMALIZE EARNING TYPE
===================================================== */

function normalizeType(type){

    const value =
        String(type || "")
        .trim()
        .toLowerCase();


    if(
        value.includes("registration") ||
        value.includes("welcome") ||
        value.includes("bonus")
    ){

        return "Registration Bonus";

    }


    if(
        value.includes("daily") ||
        value.includes("investment")
    ){

        return "Daily Investment Earning";

    }


    if(
        value.includes("gift")
    ){

        return "Gift Code";

    }


    return type ||
        "Earning";

}



/* =====================================================
   GET EARNING BADGE CLASS
===================================================== */

function getBadgeClass(type){

    const normalized =
        normalizeType(type);


    if(
        normalized === "Registration Bonus"
    ){

        return "type-registration";

    }


    if(
        normalized === "Daily Investment Earning"
    ){

        return "type-daily";

    }


    if(
        normalized === "Gift Code"
    ){

        return "type-gift";

    }


    return "type-other";

}



/* =====================================================
   LOAD USER
===================================================== */

async function loadUserData(){

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const userSnap =
        await getDoc(userRef);


    if(!userSnap.exists()){

        throw new Error(
            "SkyRent user account was not found."
        );

    }


    currentUserData =
        userSnap.data();

}



/* =====================================================
   ADD REGISTRATION BONUS
===================================================== */

function addRegistrationBonus(){

    if(!currentUserData){

        return;

    }


    /*
       Your registration code currently
       stores the welcome bonus as:

       bonus: 50

       We display that bonus here as the
       first earning.
    */

    const bonus =
        numberValue(
            currentUserData.bonus
        );


    if(bonus <= 0){

        return;

    }


    /*
       If a real registration bonus record
       already exists in the earnings
       collection, don't display it twice.
    */

    const alreadyExists =
        allEarnings.some(
            function(item){

                const type =
                    String(
                        item.type || ""
                    )
                    .toLowerCase();

                return (
                    type.includes("registration") ||
                    type.includes("welcome")
                );

            }
        );


    if(alreadyExists){

        return;

    }


    allEarnings.push({

        id:
            "registration-bonus",

        type:
            "Registration Bonus",

        name:
            "Registration Bonus",

        amount:
            bonus,

        createdAt:
            currentUserData.createdAt || null,

        isRegistrationBonus:
            true

    });

}



/* =====================================================
   LOAD FIRESTORE EARNINGS
===================================================== */

async function loadFirestoreEarnings(){

    const earningsRef =
        collection(
            db,
            "earnings"
        );


    const earningsQuery =
        query(
            earningsRef,
            where(
                "userId",
                "==",
                currentUser.uid
            )
        );


    const snapshot =
        await getDocs(
            earningsQuery
        );


    snapshot.forEach(
        function(docSnap){

            const data =
                docSnap.data();


            allEarnings.push({

                id:
                    docSnap.id,

                ...data

            });

        }
    );

}



/* =====================================================
   SORT EARNINGS
===================================================== */

function sortEarnings(){

    allEarnings.sort(
        function(a,b){

            return (
                timestampValue(
                    b.createdAt
                )
                -
                timestampValue(
                    a.createdAt
                )
            );

        }
    );

}



/* =====================================================
   CREATE EARNING CARD
===================================================== */

function createEarningCard(earning){

    const card =
        document.createElement("div");


    card.className =
        "earning-card";


    const type =
        normalizeType(
            earning.type
        );


    const name =
        earning.name ||
        earning.planName ||
        type;


    const amount =
        numberValue(
            earning.amount
        );


    const badgeClass =
        getBadgeClass(type);


    const dateText =
        formatDate(
            earning.createdAt
        );


    card.innerHTML = `

        <div class="earning-left">

            <div class="earning-name">
                ${escapeHTML(name)}
            </div>

            <div class="earning-type">

                <span
                    class="type-badge ${badgeClass}"
                >
                    ${escapeHTML(type)}
                </span>

            </div>

            <div class="earning-date">

                ${dateText}

            </div>

        </div>


        <div class="earning-right">

            <div class="earning-amount">

                +${formatMoney(amount)}

            </div>

        </div>

    `;


    return card;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================================
   RENDER EARNINGS
===================================================== */

function renderEarnings(){

    const list =
        document.getElementById(
            "earningsList"
        );


    if(!list){

        return;

    }


    list.innerHTML = "";


    if(allEarnings.length === 0){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💰
                </div>

                <h3>
                    No Earnings Yet
                </h3>

                <p>
                    Your SkyRent earnings
                    will appear here.
                </p>

            </div>

        `;

        updateSummary();

        return;

    }


    allEarnings.forEach(
        function(earning){

            const card =
                createEarningCard(
                    earning
                );

            list.appendChild(card);

        }
    );


    updateSummary();

}



/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(){

    let total = 0;


    allEarnings.forEach(
        function(earning){

            total +=
                numberValue(
                    earning.amount
                );

        }
    );


    const totalElement =
        document.getElementById(
            "totalEarnings"
        );


    if(totalElement){

        totalElement.textContent =
            formatMoney(total);

    }


    const countElement =
        document.getElementById(
            "earningCount"
        );


    if(countElement){

        const count =
            allEarnings.length;


        countElement.textContent =
            count +
            (
                count === 1
                    ? " earning recorded"
                    : " earnings recorded"
            );

    }

}



/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEarnings(){

    if(!currentUser){

        return;

    }


    showLoading();


    const list =
        document.getElementById(
            "earningsList"
        );


    if(list){

        list.innerHTML = "";

    }


    try{

        /*
           Start with a clean array
        */

        allEarnings = [];


        /*
           Load user information first
           so we can display the registration
           bonus.
        */

        await loadUserData();


        /*
           Load all existing earning records.
        */

        await loadFirestoreEarnings();


        /*
           Add the registration bonus
           if it exists.
        */

        addRegistrationBonus();


        /*
           Sort newest first.
        */

        sortEarnings();


        /*
           Display everything.
        */

        renderEarnings();


    }
    catch(error){

        console.error(
            "Earnings loading error:",
            error
        );


        showError();


        if(list){

            list.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Unable to Load Earnings
                    </h3>

                    <p>
                        Please refresh the page
                        and try again.
                    </p>

                </div>

            `;

        }

    }
    finally{

        hideLoading();

    }

}



/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.location.href =
        "dashboard.html";

}


function goCrafts(){

    window.location.href =
        "crafts.html";

}


function goInvestment(){

    window.location.href =
        "my-aircraft.html";

}


function goNetwork(){

    window.location.href =
        "network.html";

}


function goMine(){

    window.location.href =
        "dashboard.html";

}



/* =====================================================
   MAKE NAVIGATION AVAILABLE
===================================================== */

window.goHome =
    goHome;

window.goCrafts =
    goCrafts;

window.goInvestment =
    goInvestment;

window.goNetwork =
    goNetwork;

window.goMine =
    goMine;



/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        await loadEarnings();

    }
);


/* =====================================================
   REFRESH WHEN PAGE BECOMES VISIBLE
===================================================== */

document.addEventListener(
    "visibilitychange",
    async function(){

        if(
            !document.hidden &&
            currentUser
        ){

            await loadEarnings();

        }

    }
);


</script>

</body>
</html>
