<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Withdrawal History - SkyRent</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    background:
        linear-gradient(
            180deg,
            #eaf4ff 0%,
            #f5f9ff 45%,
            #eef6ff 100%
        );

    color:#172033;

    min-height:100vh;

    padding-bottom:82px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:
        linear-gradient(
            135deg,
            #0757c9 0%,
            #0b78ee 55%,
            #35a4ff 100%
        );

    color:white;

    padding:18px 18px 22px;

    border-radius:0 0 26px 26px;

    box-shadow:
        0 6px 20px rgba(0,70,160,.20);

    position:relative;

    overflow:hidden;
}


/* Decorative header circle */

.header::after{
    content:"";

    position:absolute;

    width:130px;
    height:130px;

    right:-45px;
    top:-60px;

    background:rgba(255,255,255,.10);

    border-radius:50%;
}


.header-top{
    display:flex;

    align-items:center;

    gap:12px;

    position:relative;

    z-index:2;
}


.back-btn{
    width:40px;
    height:40px;

    border:none;

    border-radius:13px;

    background:rgba(255,255,255,.18);

    color:white;

    font-size:25px;

    line-height:40px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;
}


.back-btn:active{
    transform:scale(.94);
}


.header-title{
    font-size:20px;

    font-weight:700;
}


.header-subtitle{
    font-size:12px;

    opacity:.85;

    margin-top:3px;
}


/* =====================================================
   MAIN
===================================================== */

.container{
    width:100%;

    max-width:650px;

    margin:auto;

    padding:18px 15px 30px;
}


/* =====================================================
   AVAILABLE BALANCE CARD
===================================================== */

.balance-card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #0757c9 0%,
            #0b78ee 55%,
            #38a3ff 100%
        );

    color:white;

    border-radius:22px;

    padding:22px;

    margin-bottom:23px;

    box-shadow:
        0 9px 25px rgba(7,87,201,.23);
}


/* Decorative circles */

.balance-card::before{
    content:"";

    position:absolute;

    width:145px;
    height:145px;

    right:-55px;
    top:-68px;

    background:rgba(255,255,255,.12);

    border-radius:50%;
}


.balance-card::after{
    content:"";

    position:absolute;

    width:95px;
    height:95px;

    right:45px;
    bottom:-58px;

    background:rgba(255,255,255,.08);

    border-radius:50%;
}


.balance-label{
    position:relative;

    z-index:2;

    font-size:13px;

    color:rgba(255,255,255,.85);

    margin-bottom:7px;
}


.balance{
    position:relative;

    z-index:2;

    color:white;

    font-size:31px;

    font-weight:800;

    letter-spacing:.2px;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{
    font-size:17px;

    font-weight:700;

    margin:4px 2px 12px;

    color:#172033;
}


/* =====================================================
   WITHDRAWAL LIST
===================================================== */

.withdrawal-list{
    display:flex;

    flex-direction:column;

    gap:12px;
}


/* =====================================================
   TRANSACTION CARD
===================================================== */

.withdrawal-item{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #eef6ff 100%
        );

    border-radius:18px;

    padding:17px 16px;

    border:1px solid #dbeafe;

    box-shadow:
        0 6px 18px rgba(30,80,140,.09);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}


.withdrawal-item:active{
    transform:scale(.985);

    box-shadow:
        0 3px 12px rgba(30,80,140,.08);
}


/* Decorative blue circle */

.withdrawal-item::before{
    content:"";

    position:absolute;

    width:95px;
    height:95px;

    right:-40px;
    top:-45px;

    background:#dbeafe;

    border-radius:50%;

    opacity:.65;
}


/* Left blue accent */

.withdrawal-item::after{
    content:"";

    position:absolute;

    left:0;

    top:0;

    bottom:0;

    width:4px;

    background:#0b78ee;

    border-radius:18px 0 0 18px;
}


/* =====================================================
   TRANSACTION LEFT SIDE
===================================================== */

.transaction-left{
    position:relative;

    z-index:2;

    min-width:0;
}


.transaction-date{
    font-size:13px;

    font-weight:600;

    color:#52657d;

    line-height:1.4;

    margin-bottom:7px;
}


/* =====================================================
   AMOUNT
===================================================== */

.transaction-amount{
    position:relative;

    z-index:2;

    background:white;

    padding:9px 12px;

    border-radius:12px;

    font-size:19px;

    font-weight:800;

    color:#0757c9;

    white-space:nowrap;

    box-shadow:
        0 3px 10px rgba(7,87,201,.08);

    border:1px solid #dbeafe;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    font-size:10px;

    font-weight:700;

    letter-spacing:.1px;
}


/* Pending */

.status.pending{
    background:#fff4d6;

    color:#a66b00;

    border:1px solid #ffe3a3;
}


/* Successful */

.status.success{
    background:#e8f8ef;

    color:#16834b;

    border:1px solid #bce8ce;
}


/* Failed */

.status.rejected{
    background:#ffe9e9;

    color:#d62828;

    border:1px solid #ffc7c7;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{
    background:
        linear-gradient(
            135deg,
            #ffffff,
            #eef6ff
        );

    border:1px solid #dbeafe;

    border-radius:18px;

    padding:32px 20px;

    text-align:center;

    color:#718096;

    font-size:14px;

    box-shadow:
        0 5px 16px rgba(30,80,140,.07);
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;

    padding:28px;

    color:#718096;

    font-size:14px;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:67px;

    background:
        rgba(255,255,255,.97);

    border-top:1px solid #e1eaf5;

    display:flex;

    justify-content:space-around;

    align-items:center;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.07);

    z-index:100;
}


.nav-item{
    text-decoration:none;

    color:#718096;

    font-size:11px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    min-width:55px;

    height:55px;

    transition:.2s;
}


.nav-icon{
    font-size:21px;

    line-height:20px;
}


.nav-item.active{
    color:#0757c9;

    font-weight:700;
}


.nav-item.active .nav-icon{
    transform:translateY(-1px);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px){

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .withdrawal-item{
        padding:15px 13px;
        gap:9px;
    }

    .transaction-amount{
        font-size:17px;
        padding:8px 9px;
    }

    .transaction-date{
        font-size:12px;
    }

    .status{
        font-size:9px;
        padding:5px 8px;
    }

    .balance{
        font-size:28px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-top">

        <button
            class="back-btn"
            onclick="history.back()">

            ‹

        </button>


        <div>

            <div class="header-title">
                Withdrawal History
            </div>

            <div class="header-subtitle">
                Your withdrawal transactions
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <!-- AVAILABLE BALANCE -->

    <div class="balance-card">

        <div class="balance-label">
            Available Balance
        </div>

        <div
            class="balance"
            id="availableBalance">

            ₱0.00

        </div>

    </div>



    <!-- WITHDRAWAL TRANSACTIONS -->

    <div class="section-title">
        Withdrawal Transactions
    </div>


    <div
        id="withdrawalList"
        class="withdrawal-list">

        <div class="loading">
            Loading withdrawal history...
        </div>

    </div>


</div>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<div class="bottom-nav">


    <a
        href="dashboard.html"
        class="nav-item">

        <div class="nav-icon">
            ⌂
        </div>

        <div>
            Home
        </div>

    </a>


    <a
        href="crafts.html"
        class="nav-item">

        <div class="nav-icon">
            ✈
        </div>

        <div>
            Crafts
        </div>

    </a>


    <a
        href="network.html"
        class="nav-item">

        <div class="nav-icon">
            👥
        </div>

        <div>
            Network
        </div>

    </a>


    <a
        href="earnings.html"
        class="nav-item">

        <div class="nav-icon">
            ₱
        </div>

        <div>
            Earnings
        </div>

    </a>


    <a
        href="withdrawal.html"
        class="nav-item active">

        <div class="nav-icon">
            ↗
        </div>

        <div>
            Withdraw
        </div>

    </a>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =====================================================
   ELEMENTS
===================================================== */

const balanceElement =
    document.getElementById(
        "availableBalance"
    );


const withdrawalList =
    document.getElementById(
        "withdrawalList"
    );



/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(value){

    const amount =
        Number(value || 0);

    return "₱" +
        amount.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}



/* =====================================================
   GET WITHDRAWAL DATE
===================================================== */

function getWithdrawalDate(data){

    const timestamp =
        data.requestedAt ||
        data.createdAt ||
        data.timestamp;


    if(!timestamp){

        return "Date unavailable";

    }


    try{

        let date;


        if(
            timestamp &&
            typeof timestamp.toDate ===
            "function"
        ){

            date =
                timestamp.toDate();

        }

        else if(
            timestamp instanceof Date
        ){

            date =
                timestamp;

        }

        else{

            date =
                new Date(timestamp);

        }


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "Date unavailable";

        }


        return date.toLocaleString(
            "en-PH",
            {
                month:"short",
                day:"numeric",
                year:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );


    }

    catch(error){

        return "Date unavailable";

    }

}



/* =====================================================
   GET STATUS
===================================================== */

function getStatus(data){

    const rawStatus =
        String(
            data.status ||
            "pending"
        )
        .trim()
        .toLowerCase();



    /* SUCCESS */

    if(

        rawStatus === "approved" ||

        rawStatus === "success" ||

        rawStatus === "successful" ||

        rawStatus ===
        "withdrawal successful" ||

        rawStatus === "completed" ||

        rawStatus === "complete"

    ){

        return {

            text:
                "Withdrawal Successful",

            className:
                "success"

        };

    }



    /* REJECTED */

    if(

        rawStatus === "rejected" ||

        rawStatus === "reject" ||

        rawStatus === "cancelled" ||

        rawStatus === "canceled" ||

        rawStatus === "declined" ||

        rawStatus === "failed"

    ){

        return {

            text:
                "Withdrawal Failed",

            className:
                "rejected"

        };

    }



    /* PENDING */

    return {

        text:
            "Pending for Approval",

        className:
            "pending"

    };

}



/* =====================================================
   LOAD AVAILABLE BALANCE
===================================================== */

async function loadBalance(user){

    try{

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if(
            userSnap.exists()
        ){

            const data =
                userSnap.data();


            balanceElement.textContent =
                formatMoney(
                    data.balance
                );

        }

        else{

            balanceElement.textContent =
                "₱0.00";

        }


    }

    catch(error){

        console.error(
            "Balance loading error:",
            error
        );


        balanceElement.textContent =
            "₱0.00";

    }

}



/* =====================================================
   LOAD WITHDRAWALS
===================================================== */

async function loadWithdrawals(user){

    try{

        withdrawalList.innerHTML = `

            <div class="loading">
                Loading withdrawal history...
            </div>

        `;



        const withdrawalsRef =
            collection(
                db,
                "withdrawals"
            );



        const withdrawalQuery =
            query(
                withdrawalsRef,

                where(
                    "uid",
                    "==",
                    user.uid
                )
            );



        const snapshot =
            await getDocs(
                withdrawalQuery
            );



        const withdrawals = [];



        snapshot.forEach(
            withdrawalDoc => {

                const data =
                    withdrawalDoc.data();


                withdrawals.push({

                    id:
                        withdrawalDoc.id,

                    ...data

                });

            }
        );



        /* =================================================
           SORT NEWEST FIRST
        ================================================= */

        withdrawals.sort(
            (a,b) => {

                function getTime(item){

                    const value =
                        item.requestedAt ||
                        item.createdAt ||
                        item.timestamp;


                    if(

                        value &&

                        typeof value.toMillis ===
                        "function"

                    ){

                        return value.toMillis();

                    }


                    if(

                        value &&

                        typeof value.toDate ===
                        "function"

                    ){

                        return value
                            .toDate()
                            .getTime();

                    }


                    const date =
                        new Date(value);


                    return isNaN(
                        date.getTime()
                    )
                    ? 0
                    : date.getTime();

                }


                return (
                    getTime(b) -
                    getTime(a)
                );

            }
        );



        /* =================================================
           NO TRANSACTIONS
        ================================================= */

        if(
            withdrawals.length === 0
        ){

            withdrawalList.innerHTML = `

                <div class="empty">

                    No withdrawal transactions yet.

                </div>

            `;

            return;

        }



        /* =================================================
           DISPLAY TRANSACTIONS
        ================================================= */

        withdrawalList.innerHTML = "";



        withdrawals.forEach(
            withdrawal => {


                const amount =
                    Number(

                        withdrawal.amount ??
                        withdrawal.amountValue ??
                        0

                    );



                const status =
                    getStatus(
                        withdrawal
                    );



                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "withdrawal-item";



                item.innerHTML = `

                    <div class="transaction-left">

                        <div class="transaction-date">

                            ${getWithdrawalDate(
                                withdrawal
                            )}

                        </div>


                        <span class="status ${
                            status.className
                        }">

                            ${status.text}

                        </span>

                    </div>


                    <div class="transaction-amount">

                        ${formatMoney(
                            amount
                        )}

                    </div>

                `;



                withdrawalList.appendChild(
                    item
                );

            }
        );


    }

    catch(error){

        console.error(
            "Withdrawal history error:",
            error
        );


        withdrawalList.innerHTML = `

            <div class="empty">

                Unable to load withdrawal history.

                <br><br>

                Please try again.

            </div>

        `;

    }

}



/* =====================================================
   LOAD PAGE
===================================================== */

async function loadPage(user){

    await Promise.all([

        loadBalance(user),

        loadWithdrawals(user)

    ]);

}



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,

    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        await loadPage(
            user
        );

    }
);



/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    async () => {

        const user =
            auth.currentUser;


        if(user){

            await loadPage(
                user
            );

        }

    },

    30000
);



/* =====================================================
   STORAGE REFRESH
===================================================== */

window.addEventListener(
    "storage",

    async () => {

        const user =
            auth.currentUser;


        if(user){

            await loadPage(
                user
            );

        }

    }
);


</script>

</body>
