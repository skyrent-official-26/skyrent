<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Withdrawal History - SkyRent</title> <style> /* ========================= RESET ========================= */ *{ margin:0; padding:0; box-sizing:border-box; } body{ font-family:Arial, Helvetica, sans-serif; background:#f3f7fc; color:#172033; padding-bottom:90px; } /* ========================= HEADER ========================= */ .header{ background: linear-gradient( 135deg, #0757c9, #1475e8 ); color:white; padding: 22px 20px 30px; border-bottom-left-radius:32px; border-bottom-right-radius:32px; box-shadow: 0 10px 25px rgba(7,87,201,.18); } .back-row{ display:flex; align-items:center; gap:13px; } .back-button{ width:43px; height:43px; border:none; border-radius:14px; background: rgba(255,255,255,.18); color:white; font-size:23px; cursor:pointer; } .header h1{ margin-top:20px; font-size:27px; font-weight:900; } .header p{ margin-top:6px; font-size:13px; opacity:.9; } /* ========================= CONTAINER ========================= */ .container{ width:92%; max-width:520px; margin: -20px auto 0; position:relative; z-index:5; } /* ========================= HISTORY CARD ========================= */ .history-card{ margin-top:14px; background:white; border-radius:23px; padding:18px; box-shadow: 0 9px 25px rgba(30,70,120,.08); } .history-title{ font-size:20px; font-weight:900; margin-bottom:15px; } /* ========================= SUMMARY ========================= */ .summary{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; } .summary-box{ background:#f5f8fd; border:1px solid #e7edf5; border-radius:13px; padding:11px; } .summary-label{ display:block; color:#8a929e; font-size:9px; font-weight:800; margin-bottom:5px; } .summary-value{ color:#0757c9; font-size:16px; font-weight:900; } /* ========================= LIST HEADER ========================= */ .list-header{ display:grid; grid-template-columns: 1.05fr 1fr 1.15fr 1.35fr; gap:7px; padding: 9px 10px; background:#eef5ff; border-radius:10px; color:#6f7b8b; font-size:8px; font-weight:900; text-transform:uppercase; } /* ========================= WITHDRAWAL ROW ========================= */ .withdrawal-row{ display:grid; grid-template-columns: 1.05fr 1fr 1.15fr 1.35fr; gap:7px; align-items:center; padding: 13px 10px; border-bottom: 1px solid #edf1f5; } .withdrawal-row:last-child{ border-bottom:none; } /* ========================= AMOUNT ========================= */ .row-amount{ color:#0757c9; font-size:15px; font-weight:900; } /* ========================= RECEIVED ========================= */ .row-received{ color:#188044; font-size:12px; font-weight:900; } /* ========================= TIME ========================= */ .row-time{ color:#667180; font-size:10px; line-height:1.35; } /* ========================= STATUS ========================= */ .status{ display:inline-block; padding: 6px 7px; border-radius:10px; text-align:center; font-size:10px; font-weight:900; line-height:1.2; } .status.pending{ background:#fff5d6; color:#9a7200; border: 1px solid #f0d889; } .status.success{ background:#eaf9ef; color:#188044; border: 1px solid #ccefd8; } .status.rejected{ background:#fff0f0; color:#c62828; border: 1px solid #ffd3d3; } /* ========================= EMPTY ========================= */ .empty-history{ text-align:center; padding: 35px 15px; color:#858d99; } .empty-icon{ font-size:38px; margin-bottom:8px; } .empty-history h3{ color:#172033; font-size:16px; margin-bottom:5px; } .empty-history p{ font-size:11px; } /* ========================= LOADING ========================= */ .loading-history{ text-align:center; padding: 30px 15px; color:#7d8794; font-size:12px; } /* ========================= REFRESH ========================= */ .refresh-button{ width:100%; margin-top:14px; border:none; border-radius:13px; padding:13px; background:#eef5ff; color:#0757c9; font-size:13px; font-weight:900; cursor:pointer; } .refresh-button:active{ transform:scale(.98); } .refresh-button:disabled{ opacity:.6; cursor:not-allowed; } /* ========================= BOTTOM NAV ========================= */ .bottom-nav{ position:fixed; left:0; right:0; bottom:0; height:78px; background: rgba(255,255,255,.97); border-top: 1px solid #e8edf4; box-shadow: 0 -5px 20px rgba(20,60,110,.10); display:grid; grid-template-columns: repeat(5,1fr); z-index:9999; backdrop-filter:blur(10px); } .nav-item{ border:none; background:transparent; color:#89919d; font-size:10px; font-weight:bold; cursor:pointer; padding-top:9px; } .nav-icon{ display:block; font-size:21px; margin-bottom:4px; } .nav-item.active{ color:#0757c9; } /* ========================= MOBILE ========================= */ @media (max-width:380px){ .history-card{ padding:14px; } .list-header, .withdrawal-row{ grid-template-columns: 1fr 1fr 1fr 1.2fr; } .row-amount{ font-size:12px; } .row-received{ font-size:11px; } .row-time{ font-size:8px; } .status{ font-size:7px; padding:5px; } } </style> </head> <body> <!-- ========================= HEADER ========================= --> <header class="header"> <div class="back-row"> <button class="back-button" onclick="goBack()"> ← </button> <div> <strong> SkyRent </strong> </div> </div> <h1> Withdrawal History </h1> <p> View your withdrawal requests and status. </p> </header> <main class="container"> <div class="history-card"> <div class="history-title"> Withdrawal Records </div> <!-- ========================= SUMMARY ========================= --> <div class="summary"> <div class="summary-box"> <span class="summary-label"> AVAILABLE BALANCE </span> <div class="summary-value" id="availableBalance"> ₱0.00 </div> </div> <div class="summary-box"> <span class="summary-label"> REQUESTS </span> <div class="summary-value" id="totalRequests"> 0 </div> </div> </div> <!-- ========================= LIST HEADER ========================= --> <div class="list-header"> <div> Withdrawal </div> <div> Received </div> <div> Time </div> <div> Status </div> </div> <!-- ========================= RECORD LIST ========================= --> <div id="withdrawalList"> <div class="loading-history"> Loading withdrawal history... </div> </div> <!-- ========================= REFRESH ========================= --> <button class="refresh-button" id="refreshButton" onclick="loadWithdrawalHistory()"> 🔄 Refresh History </button> </div> </main> <!-- ========================= BOTTOM NAV ========================= --> <nav class="bottom-nav"> <button class="nav-item" onclick="goHome()"> <span class="nav-icon"> 🏠 </span> Home </button> <button class="nav-item" onclick="goCrafts()"> <span class="nav-icon"> ✈️ </span> Crafts </button> <button class="nav-item" onclick="goNetwork()"> <span class="nav-icon"> 👥 </span> Network </button> <button class="nav-item" onclick="goEarnings()"> <span class="nav-icon"> 📊 </span> Earnings </button> <button class="nav-item active" onclick="goWithdraw()"> <span class="nav-icon"> 💸 </span> Withdraw </button> </nav> <!-- ===================================================== FIREBASE ===================================================== --> <script type="module"> /* ===================================================== FIREBASE IMPORTS ===================================================== */ import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ===================================================== FIREBASE CONFIG ===================================================== */ const firebaseConfig = { apiKey: "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8", authDomain: "skyrent-ea30c.firebaseapp.com", projectId: "skyrent-ea30c", storageBucket: "skyrent-ea30c.firebasestorage.app", messagingSenderId: "572678456448", appId: "1:572678456448:web:6b7132351515742dd09265" }; /* ===================================================== INITIALIZE FIREBASE ===================================================== */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ===================================================== GLOBAL ===================================================== */ let currentUser = null; /* ===================================================== FORMAT MONEY ===================================================== */ function formatMoney(value){ return Number(value || 0).toLocaleString( "en-PH", { style:"currency", currency:"PHP", minimumFractionDigits:2, maximumFractionDigits:2 } ); } /* ===================================================== FORMAT FIRESTORE TIME ===================================================== */ function formatDateTime(timestamp){ if(!timestamp){ return "Unknown"; } let date = null; /* FIRESTORE TIMESTAMP */ if( timestamp && typeof timestamp.toDate === "function" ){ date = timestamp.toDate(); } /* JAVASCRIPT DATE */ else if( timestamp instanceof Date ){ date = timestamp; } /* STRING / NUMBER */ else{ date = new Date(timestamp); } if( !date || isNaN(date.getTime()) ){ return "Unknown"; } return date.toLocaleString( "en-PH", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true } ); } /* ===================================================== DISPLAY STATUS ===================================================== */ function getDisplayStatus(withdrawal){ if(!withdrawal){ return "Pending for Approval"; } const status = String( withdrawal.status || "" ) .toLowerCase() .trim(); /* SUCCESS */ if( status === "approved" || status === "successful" || status === "success" || status === "withdrawal successful" || status === "completed" || status === "complete" ){ return "Withdrawal Successful"; } /* REJECTED */ if( status === "rejected" || status === "reject" || status === "cancelled" || status === "canceled" || status === "declined" ){ return "Withdrawal Rejected"; } /* DEFAULT */ return "Pending for Approval"; } /* ===================================================== STATUS CLASS ===================================================== */ function getStatusClass(status){ if( status === "Withdrawal Successful" ){ return "success"; } if( status === "Withdrawal Rejected" ){ return "rejected"; } return "pending"; } /* ===================================================== LOAD BALANCE ===================================================== */ async function loadAvailableBalance(){ if(!currentUser){ return; } try{ const userRef = doc( db, "users", currentUser.uid ); const snapshot = await getDoc(userRef); if(!snapshot.exists()){ document.getElementById( "availableBalance" ).innerText = "₱0.00"; return; } const data = snapshot.data(); const balance = Number( data.balance || 0 ); document.getElementById( "availableBalance" ).innerText = formatMoney(balance); }catch(error){ console.error( "Balance loading error:", error ); document.getElementById( "availableBalance" ).innerText = "₱0.00"; } } /* ===================================================== SHOW EMPTY ===================================================== */ function showEmptyHistory(){ const list = document.getElementById( "withdrawalList" ); list.innerHTML = ` <div class="empty-history"> <div class="empty-icon"> 💸 </div> <h3> No Withdrawal Records </h3> <p> Your withdrawal requests will appear here. </p> </div> `; } /* ===================================================== LOAD WITHDRAWAL HISTORY ===================================================== */ async function loadWithdrawalHistory(){ if(!currentUser){ return; } const list = document.getElementById( "withdrawalList" ); const refreshButton = document.getElementById( "refreshButton" ); /* REFRESH BUTTON */ refreshButton.disabled = true; refreshButton.innerText = "🔄 Loading..."; /* SHOW LOADING */ list.innerHTML = ` <div class="loading-history"> Loading withdrawal history... </div> `; try{ /* LOAD BALANCE */ await loadAvailableBalance(); /* WITHDRAWALS COLLECTION */ const withdrawalsRef = collection( db, "withdrawals" ); /* GET CURRENT USER'S WITHDRAWALS */ const withdrawalQuery = query( withdrawalsRef, where( "uid", "==", currentUser.uid ) ); const snapshot = await getDocs( withdrawalQuery ); /* NO RECORDS */ if(snapshot.empty){ document.getElementById( "totalRequests" ).innerText = "0"; showEmptyHistory(); return; } /* CONVERT TO ARRAY */ const withdrawals = []; snapshot.forEach( function(withdrawalDoc){ const data = withdrawalDoc.data(); withdrawals.push({ id: withdrawalDoc.id, ...data }); } ); /* NEWEST FIRST */ withdrawals.sort( function(a,b){ function getTime(item){ const timestamp = item.requestedAt || item.createdAt; if( timestamp && typeof timestamp.toDate === "function" ){ return timestamp .toDate() .getTime(); } const date = new Date( timestamp || 0 ); return date.getTime() || 0; } return ( getTime(b) - getTime(a) ); } ); /* REQUEST COUNT */ document.getElementById( "totalRequests" ).innerText = withdrawals.length; /* CLEAR LIST */ list.innerHTML = ""; /* CREATE ROWS */ withdrawals.forEach( function(withdrawal){ /* WITHDRAWAL AMOUNT */ const withdrawalAmount = Number( withdrawal.amount || withdrawal.amountValue || 0 ); /* NET AMOUNT */ let netAmount = Number( withdrawal.netAmount ); /* OLD RECORD FALLBACK */ if( !Number.isFinite(netAmount) ){ netAmount = withdrawalAmount - ( withdrawalAmount * 0.10 ); } /* STATUS */ const displayStatus = getDisplayStatus( withdrawal ); const statusClass = getStatusClass( displayStatus ); /* DATE */ const withdrawalDate = withdrawal.requestedAt || withdrawal.createdAt; /* CREATE ROW */ const row = document.createElement( "div" ); row.className = "withdrawal-row"; row.innerHTML = ` <div class="row-amount"> ${formatMoney( withdrawalAmount )} </div> <div class="row-received"> ${formatMoney( netAmount )} </div> <div class="row-time"> ${formatDateTime( withdrawalDate )} </div> <div> <span class="status ${statusClass}"> ${displayStatus} </span> </div> `; list.appendChild(row); } ); }catch(error){ console.error( "Withdrawal history error:", error ); document.getElementById( "totalRequests" ).innerText = "0"; list.innerHTML = ` <div class="empty-history"> <div class="empty-icon"> ⚠️ </div> <h3> Unable to Load History </h3> <p> Please try refreshing the page. </p> </div> `; }finally{ refreshButton.disabled = false; refreshButton.innerText = "🔄 Refresh History"; } } /* ===================================================== NAVIGATION ===================================================== */ window.goBack = function(){ window.location.href = "dashboard.html"; }; window.goHome = function(){ window.location.href = "dashboard.html"; }; window.goCrafts = function(){ window.location.href = "crafts.html"; }; window.goNetwork = function(){ window.location.href = "network.html"; }; window.goEarnings = function(){ window.location.href = "earnings.html"; }; window.goWithdraw = function(){ window.location.href = "withdrawal.html"; }; /* ===================================================== AUTH STATE ===================================================== */ onAuthStateChanged( auth, async function(user){ if(!user){ currentUser = null; window.location.href = "index.html"; return; } currentUser = user; await loadWithdrawalHistory(); } ); /* ===================================================== AUTO REFRESH ===================================================== */ setInterval( function(){ if(currentUser){ loadWithdrawalHistory(); } }, 30000 ); /* ===================================================== STORAGE EVENT ===================================================== */ window.addEventListener( "storage", function(){ if(currentUser){ loadWithdrawalHistory(); } } ); </script> </body> </html>
