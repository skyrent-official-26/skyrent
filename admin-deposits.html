<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Admin - Deposits</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f7ff;
    color:#1e293b;
}

/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(135deg,#075985,#0284c7);
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
    opacity:.9;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:15px;
}


/* =========================
   BACK BUTTON
========================= */

.back-btn{
    display:inline-block;
    border:none;
    background:white;
    color:#075985;
    padding:9px 14px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.back-btn:hover{
    background:#e0f2fe;
}


/* =========================
   SUMMARY
========================= */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.summary-card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border-left:4px solid #0284c7;
}

.summary-card:nth-child(2){
    border-left-color:#7c3aed;
}

.summary-card:nth-child(3){
    border-left-color:#16a34a;
}

.summary-card h3{
    margin:0;
    font-size:13px;
    color:#64748b;
}

.summary-value{
    margin-top:7px;
    font-size:21px;
    font-weight:bold;
    color:#075985;
}

.summary-card:nth-child(2) .summary-value{
    color:#6d28d9;
}

.summary-card:nth-child(3) .summary-value{
    color:#15803d;
}


/* =========================
   SEARCH
========================= */

.search-box{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.search-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:9px;
}

.search-row{
    display:flex;
    gap:8px;
}

.search-input{
    flex:1;
    width:100%;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.search-input:focus{
    border-color:#0284c7;
    box-shadow:0 0 0 2px rgba(2,132,199,.1);
}

.clear-btn{
    border:none;
    background:#64748b;
    color:white;
    padding:0 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.clear-btn:hover{
    background:#475569;
}


/* =========================
   USER SEARCH RESULT
========================= */

.user-result{
    display:none;
    margin-top:15px;
}

.user-result-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
    color:#075985;
}

.user-info{
    background:#f8fafc;
    border-radius:9px;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #e2e8f0;
}

.user-info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:5px 0;
    font-size:13px;
}

.user-info-row span:first-child{
    color:#64748b;
}

.user-info-row span:last-child{
    font-weight:bold;
}


/* =========================
   SECTION
========================= */

.section-title{
    font-size:19px;
    font-weight:bold;
    margin:5px 0 12px;
}


/* =========================
   DEPOSIT CARD
========================= */

.deposit-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.deposit-card{
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border-left:4px solid #f59e0b;
}

.deposit-row{
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr 1.2fr;
    gap:10px;
    align-items:center;
}

.deposit-field{
    min-width:0;
}

.deposit-label{
    display:block;
    font-size:11px;
    color:#64748b;
    margin-bottom:4px;
}

.deposit-value{
    font-size:14px;
    font-weight:bold;
    word-break:break-word;
}

.amount{
    color:#075985;
    font-size:16px;
}


/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    text-align:center;
}

.status-pending{
    background:#fff7ed;
    color:#c2410c;
}

.status-approved{
    background:#ecfdf5;
    color:#047857;
}

.status-rejected{
    background:#fef2f2;
    color:#b91c1c;
}


/* =========================
   ACTIONS
========================= */

.actions{
    display:flex;
    gap:6px;
    margin-top:12px;
    padding-top:11px;
    border-top:1px solid #e2e8f0;
}

.action-btn{
    border:none;
    padding:8px 14px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.approve-btn{
    background:#16a34a;
    color:white;
}

.approve-btn:hover{
    background:#15803d;
}

.reject-btn{
    background:#dc2626;
    color:white;
}

.reject-btn:hover{
    background:#b91c1c;
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    padding:30px 15px;
    text-align:center;
    border-radius:12px;
    color:#64748b;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.empty-icon{
    font-size:35px;
    margin-bottom:8px;
}


/* =========================
   SEARCH RECORD
========================= */

.history-card{
    background:white;
    border-radius:12px;
    padding:13px;
    margin-bottom:9px;
    border:1px solid #e2e8f0;
}

.history-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.history-field label{
    display:block;
    font-size:10px;
    color:#64748b;
    margin-bottom:4px;
}

.history-field strong{
    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .summary{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .summary-card{
        padding:11px;
    }

    .summary-card h3{
        font-size:11px;
    }

    .summary-value{
        font-size:17px;
    }

    .deposit-row{
        grid-template-columns:1fr 1fr;
        gap:11px;
    }

    .history-row{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:500px){

    .container{
        padding:11px;
    }

    .header h1{
        font-size:20px;
    }

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-card{
        padding:9px;
    }

    .summary-card h3{
        font-size:10px;
    }

    .summary-value{
        font-size:15px;
    }

    .search-row{
        gap:6px;
    }

    .clear-btn{
        padding:0 11px;
    }

    .deposit-row{
        grid-template-columns:1fr 1fr;
    }

    .deposit-value{
        font-size:13px;
    }

    .amount{
        font-size:15px;
    }

    .history-row{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>
        💰 Deposit Management
    </h1>

    <p>
        Review and approve deposit requests
    </p>

</div>


<div class="container">


    <!-- =========================
         BACK
    ========================= -->

    <button
        class="back-btn"
        onclick="location.href='admin.html'"
    >

        ← Back to Dashboard

    </button>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                Total Deposit Amount
            </h3>

            <div
                class="summary-value"
                id="totalDeposit"
            >

                ₱0.00

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Total Deposits
            </h3>

            <div
                class="summary-value"
                id="totalDeposits"
            >

                0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Approved Deposits
            </h3>

            <div
                class="summary-value"
                id="approvedDeposits"
            >

                0

            </div>

        </div>

    </div>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-box">

        <div class="search-title">

            🔎 Search User Deposit History

        </div>


        <div class="search-row">

            <input
                type="text"
                id="searchPhone"
                class="search-input"
                placeholder="Enter user phone number..."
                oninput="searchUser()"
            >

            <button
                class="clear-btn"
                onclick="clearSearch()"
            >

                Clear

            </button>

        </div>


        <!-- SEARCH RESULT -->

        <div
            class="user-result"
            id="userResult"
        >

            <div
                class="user-result-title"
                id="userResultTitle"
            >

                Deposit History

            </div>


            <div id="userInfo"></div>

            <div id="userDepositHistory"></div>

        </div>

    </div>


    <!-- =========================
         PENDING APPROVAL
    ========================= -->

    <div class="section-title">

        Deposits Needing Approval

    </div>


    <div
        class="deposit-list"
        id="pendingList"
    ></div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ADMIN UID
=====================================================

   IMPORTANT:

   Replace this value with the UID
   of your Firebase admin account.

===================================================== */
const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =====================================================
   CURRENT ADMIN
===================================================== */

let currentAdmin = null;


/* =====================================================
   ALL DEPOSITS
===================================================== */

let allDeposits = [];


/* =====================================================
   NUMBER FORMAT
===================================================== */

function getNumber(value){

    if(
        value === null ||
        value === undefined
    ){

        return 0;

    }


    return Number(

        String(value)
            .replace(/[₱,\s]/g,"")

    ) || 0;

}


/* =====================================================
   MONEY FORMAT
===================================================== */

function money(value){

    return "₱" +

        getNumber(value).toLocaleString(

            "en-PH",

            {

                minimumFractionDigits:2,

                maximumFractionDigits:2

            }

        );

}


/* =====================================================
   DATE VALUE
===================================================== */

function getDateValue(deposit){

    if(!deposit){

        return 0;

    }


    const values = [

        deposit.createdAt,

        deposit.requestedAt,

        deposit.submittedAt,

        deposit.depositTime,

        deposit.depositedAt,

        deposit.requestTime,

        deposit.dateTime,

        deposit.date_time,

        deposit.timestamp,

        deposit.date,

        deposit.time

    ];


    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined
        ){

            continue;

        }


        /*
           Firestore Timestamp
        */

        if(
            typeof value.toMillis ===
            "function"
        ){

            return value.toMillis();

        }


        if(
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .getTime();

        }


        const date =
            new Date(value);


        if(
            !isNaN(
                date.getTime()
            )
        ){

            return date.getTime();

        }

    }


    return 0;

}


/* =====================================================
   DISPLAY DATE
===================================================== */

function getRequestTime(deposit){

    const timestamp =
        getDateValue(deposit);


    if(!timestamp){

        return "Time not recorded";

    }


    return new Date(timestamp)
        .toLocaleString(

            "en-PH",

            {

                year:"numeric",

                month:"short",

                day:"numeric",

                hour:"numeric",

                minute:"2-digit",

                second:"2-digit"

            }

        );

}


/* =====================================================
   STATUS HELPERS
===================================================== */

function normalizeStatus(status){

    return String(
        status || ""
    )
    .toLowerCase()
    .trim();

}


function isRejected(status){

    const value =
        normalizeStatus(status);


    return (

        value === "rejected" ||

        value === "cancelled" ||

        value === "canceled" ||

        value === "declined"

    );

}


function isApproved(status){

    const value =
        normalizeStatus(status);


    return (

        value === "approved" ||

        value === "deposit successful" ||

        value === "successful" ||

        value === "completed"

    );

}


function isPending(status){

    return (

        !isApproved(status) &&

        !isRejected(status)

    );

}


/* =====================================================
   STATUS HTML
===================================================== */

function statusHTML(status){

    if(
        isApproved(status)
    ){

        return `

            <span class="status status-approved">

                Approved

            </span>

        `;

    }


    if(
        isRejected(status)
    ){

        return `

            <span class="status status-rejected">

                Rejected

            </span>

        `;

    }


    return `

        <span class="status status-pending">

            Pending Approval

        </span>

    `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   FIREBASE AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        /*
           ADMIN SECURITY CHECK
        */

        if(
            user.uid !==
            ADMIN_UID
        ){

            alert(
                "Access denied. Admin account required."
            );


            try{

                await signOut(auth);

            }catch(error){

                console.error(
                    error
                );

            }


            window.location.href =
                "index.html";

            return;

        }


        currentAdmin =
            user;


        console.log(
            "Admin authenticated:",
            user.uid
        );


        await loadDeposits();

    }
);


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits(){

    const list =
        document.getElementById(
            "pendingList"
        );


    try{

        list.innerHTML = `

            <div class="empty">

                Loading deposits...

            </div>

        `;


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "deposits"
                )

            );


        allDeposits = [];


        snapshot.forEach(
            function(docSnapshot){

                allDeposits.push({

                    id:
                        docSnapshot.id,

                    ...docSnapshot.data()

                });

            }
        );


        /*
           Newest first
        */

        allDeposits.sort(
            function(a,b){

                return (

                    getDateValue(b) -

                    getDateValue(a)

                );

            }
        );


        updateSummary();

        renderPendingDeposits();


        /*
           Keep search results updated
        */

        const searchInput =
            document.getElementById(
                "searchPhone"
            );


        if(
            searchInput &&
            searchInput.value.trim() !== ""
        ){

            searchUser();

        }

    }

    catch(error){

        console.error(
            "Load deposits error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ⚠️

                </div>

                <strong>

                    Unable to load deposits

                </strong>

                <div
                    style="
                        margin-top:7px;
                        font-size:12px;
                    "
                >

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    let totalAmount = 0;

    let approvedCount = 0;


    allDeposits.forEach(
        function(deposit){

            const amount =
                getNumber(
                    deposit.amount
                );


            const status =
                deposit.status || "";


            if(
                !isRejected(status)
            ){

                totalAmount +=
                    amount;

            }


            if(
                isApproved(status)
            ){

                approvedCount++;

            }

        }
    );


    document.getElementById(
        "totalDeposit"
    ).textContent =
        money(totalAmount);


    document.getElementById(
        "totalDeposits"
    ).textContent =
        allDeposits.length;


    document.getElementById(
        "approvedDeposits"
    ).textContent =
        approvedCount;

}


/* =====================================================
   RENDER PENDING
===================================================== */

function renderPendingDeposits(){

    const list =
        document.getElementById(
            "pendingList"
        );


    const pending =
        allDeposits.filter(
            function(deposit){

                return isPending(
                    deposit.status
                );

            }
        );


    if(
        pending.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ✅

                </div>

                <strong>

                    No pending deposits

                </strong>

                <div
                    style="
                        margin-top:5px;
                        font-size:12px;
                    "
                >

                    There are currently no deposit requests
                    waiting for approval.

                </div>

            </div>

        `;

        return;

    }


    list.innerHTML =
        pending.map(
            function(deposit){

                return createPendingCard(
                    deposit
                );

            }
        ).join("");

}


/* =====================================================
   CREATE PENDING CARD
===================================================== */

function createPendingCard(deposit){

    const name =
        deposit.userName ||
        deposit.name ||
        "—";


    const phone =
        deposit.phone ||
        deposit.mobile ||
        deposit.userPhone ||
        "—";


    const email =
        deposit.email ||
        "—";


    const amount =
        getNumber(
            deposit.amount
        );


    return `

        <div class="deposit-card">

            <div class="deposit-row">


                <!-- USER -->

                <div class="deposit-field">

                    <span class="deposit-label">

                        User

                    </span>

                    <div class="deposit-value">

                        ${escapeHTML(name)}

                    </div>

                </div>


                <!-- PHONE -->

                <div class="deposit-field">

                    <span class="deposit-label">

                        User Phone

                    </span>

                    <div class="deposit-value">

                        ${escapeHTML(phone)}

                    </div>

                </div>


                <!-- AMOUNT -->

                <div class="deposit-field">

                    <span class="deposit-label">

                        Deposit Amount

                    </span>

                    <div class="deposit-value amount">

                        ${money(amount)}

                    </div>

                </div>


                <!-- STATUS -->

                <div class="deposit-field">

                    <span class="deposit-label">

                        Status

                    </span>

                    <div>

                        ${statusHTML(
                            deposit.status
                        )}

                    </div>

                </div>


            </div>


            <!-- EXTRA INFORMATION -->

            <div
                style="
                    margin-top:10px;
                    font-size:12px;
                    color:#64748b;
                "
            >

                <strong>
                    Email:
                </strong>

                ${escapeHTML(email)}

                <br>

                <strong>
                    Request Time:
                </strong>

                ${escapeHTML(
                    getRequestTime(
                        deposit
                    )
                )}

            </div>


            <!-- ACTIONS -->

            <div class="actions">

                <button
                    class="action-btn approve-btn"
                    onclick="approveDeposit('${deposit.id}')"
                >

                    ✓ Approve

                </button>


                <button
                    class="action-btn reject-btn"
                    onclick="rejectDeposit('${deposit.id}')"
                >

                    ✕ Reject

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

window.approveDeposit =
async function(depositId){

    if(!currentAdmin){

        alert(
            "Admin authentication is required."
        );

        return;

    }


    if(
        currentAdmin.uid !==
        ADMIN_UID
    ){

        alert(
            "You are not authorized."
        );

        return;

    }


    const deposit =
        allDeposits.find(
            function(item){

                return item.id ===
                    depositId;

            }
        );


    if(!deposit){

        alert(
            "Deposit record not found."
        );

        return;

    }


    /*
       Must still be pending
    */

    if(
        !isPending(
            deposit.status
        )
    ){

        alert(
            "This deposit has already been processed."
        );

        return;

    }


    const amount =
        getNumber(
            deposit.amount
        );


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        alert(
            "Invalid deposit amount."
        );

        return;

    }


    /*
       User UID comes directly
       from the deposit document.
    */

    const userId =
        deposit.userId ||
        deposit.uid;


    if(!userId){

        alert(
            "This deposit does not contain a user ID."
        );

        return;

    }


    const confirmed =
        confirm(

            "Approve this deposit?\n\n" +

            "Amount: " +
            money(amount) +

            "\n\n" +

            "This amount will be added to the user's balance."

        );


    if(!confirmed){

        return;

    }


    try{

        /*
           Deposit document
        */

        const depositRef =
            doc(
                db,
                "deposits",
                depositId
            );


        /*
           User document
        */

        const userRef =
            doc(
                db,
                "users",
                userId
            );


        /*
           ATOMIC FIRESTORE TRANSACTION
        */

        await runTransaction(
            db,
            async function(transaction){

                /*
                   READ THE FRESH DEPOSIT
                */

                const freshDeposit =
                    await transaction.get(
                        depositRef
                    );


                if(
                    !freshDeposit.exists()
                ){

                    throw new Error(
                        "Deposit record no longer exists."
                    );

                }


                const freshData =
                    freshDeposit.data();


                /*
                   ONLY PENDING DEPOSITS
                   CAN BE APPROVED
                */

                if(
                    freshData.status !==
                    "Pending Approval"
                ){

                    throw new Error(
                        "This deposit has already been processed."
                    );

                }


                /*
                   EXTRA DOUBLE-CREDIT
                   PROTECTION
                */

                if(
                    freshData.credited ===
                    true
                ){

                    throw new Error(
                        "This deposit has already been credited."
                    );

                }


                /*
                   READ USER
                */

                const userSnapshot =
                    await transaction.get(
                        userRef
                    );


                if(
                    !userSnapshot.exists()
                ){

                    throw new Error(
                        "User account was not found."
                    );

                }


                const userData =
                    userSnapshot.data();


                /*
                   CURRENT USER BALANCE
                */

                const currentBalance =
                    getNumber(
                        userData.balance
                    );


                /*
                   NEW BALANCE
                */

                const newBalance =
                    currentBalance +
                    amount;


                /*
                   UPDATE USER BALANCE
                */

                transaction.update(
                    userRef,
                    {

                        balance:
                            newBalance

                    }
                );


                /*
                   UPDATE DEPOSIT
                */

                transaction.update(
                    depositRef,
                    {

                        status:
                            "Approved",

                        approved:
                            true,

                        credited:
                            true,

                        approvedAt:
                            serverTimestamp(),

                        approvedBy:
                            currentAdmin.uid

                    }
                );

            }
        );


        /*
           SUCCESS
        */

        alert(

            "Deposit approved successfully!\n\n" +

            money(amount) +

            " has been credited to the user's balance."

        );


        /*
           Reload
        */

        await loadDeposits();

    }

    catch(error){

        console.error(
            "Approve deposit error:",
            error
        );


        alert(

            "Deposit approval failed.\n\n" +

            error.message

        );

    }

};


/* =====================================================
   REJECT DEPOSIT
===================================================== */

window.rejectDeposit =
async function(depositId){

    if(!currentAdmin){

        alert(
            "Admin authentication is required."
        );

        return;

    }


    if(
        currentAdmin.uid !==
        ADMIN_UID
    ){

        alert(
            "You are not authorized."
        );

        return;

    }


    const deposit =
        allDeposits.find(
            function(item){

                return item.id ===
                    depositId;

            }
        );


    if(!deposit){

        alert(
            "Deposit record not found."
        );

        return;

    }


    if(
        !isPending(
            deposit.status
        )
    ){

        alert(
            "This deposit has already been processed."
        );

        return;

    }


    const confirmed =
        confirm(
            "Reject this deposit?"
        );


    if(!confirmed){

        return;

    }


    try{

        const depositRef =
            doc(
                db,
                "deposits",
                depositId
            );


        /*
           Transaction makes sure
           the deposit is still pending.
        */

        await runTransaction(
            db,
            async function(transaction){

                const freshDeposit =
                    await transaction.get(
                        depositRef
                    );


                if(
                    !freshDeposit.exists()
                ){

                    throw new Error(
                        "Deposit record no longer exists."
                    );

                }


                const data =
                    freshDeposit.data();


                if(
                    data.status !==
                    "Pending Approval"
                ){

                    throw new Error(
                        "This deposit has already been processed."
                    );

                }


                /*
                   REJECTION DOES NOT
                   TOUCH USER BALANCE.
                */

                transaction.update(
                    depositRef,
                    {

                        status:
                            "Rejected",

                        approved:
                            false,

                        credited:
                            false,

                        rejectedAt:
                            serverTimestamp(),

                        rejectedBy:
                            currentAdmin.uid

                    }
                );

            }
        );


        alert(
            "Deposit rejected."
        );


        await loadDeposits();

    }

    catch(error){

        console.error(
            "Reject deposit error:",
            error
        );


        alert(

            "Unable to reject deposit.\n\n" +

            error.message

        );

    }

};


/* =====================================================
   SEARCH USER
===================================================== */

window.searchUser =
function(){

    const input =
        document.getElementById(
            "searchPhone"
        ).value.trim();


    const result =
        document.getElementById(
            "userResult"
        );


    if(
        input === ""
    ){

        result.style.display =
            "none";

        return;

    }


    const search =
        normalizePhone(
            input
        );


    const userDeposits =
        allDeposits.filter(
            function(deposit){

                const phone =
                    deposit.phone ||
                    deposit.mobile ||
                    deposit.userPhone ||
                    "";


                return normalizePhone(
                    phone
                ).includes(search);

            }
        );


    result.style.display =
        "block";


    if(
        userDeposits.length === 0
    ){

        document.getElementById(
            "userResultTitle"
        ).textContent =
            "No user found";


        document.getElementById(
            "userInfo"
        ).innerHTML = "";


        document.getElementById(
            "userDepositHistory"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    🔎

                </div>

                No deposit records found
                for this phone number.

            </div>

        `;

        return;

    }


    const first =
        userDeposits[0];


    const phone =
        first.phone ||
        first.mobile ||
        first.userPhone ||
        "—";


    const name =
        first.userName ||
        first.name ||
        "—";


    const email =
        first.email ||
        "—";


    let userTotal = 0;

    let userApproved = 0;

    let userPending = 0;

    let userRejected = 0;


    userDeposits.forEach(
        function(deposit){

            const amount =
                getNumber(
                    deposit.amount
                );


            const status =
                deposit.status || "";


            if(
                !isRejected(status)
            ){

                userTotal +=
                    amount;

            }


            if(
                isApproved(status)
            ){

                userApproved++;

            }

            else if(
                isRejected(status)
            ){

                userRejected++;

            }

            else{

                userPending++;

            }

        }
    );


    document.getElementById(
        "userResultTitle"
    ).textContent =
        "Deposit History — " +
        phone;


    document.getElementById(
        "userInfo"
    ).innerHTML = `

        <div class="user-info">


            <div class="user-info-row">

                <span>
                    Name
                </span>

                <span>
                    ${escapeHTML(name)}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    User Phone
                </span>

                <span>
                    ${escapeHTML(phone)}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Email
                </span>

                <span>
                    ${escapeHTML(email)}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Total Deposit
                </span>

                <span>
                    ${money(userTotal)}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Number of Deposits
                </span>

                <span>
                    ${userDeposits.length}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Approved
                </span>

                <span>
                    ${userApproved}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Pending
                </span>

                <span>
                    ${userPending}
                </span>

            </div>


            <div class="user-info-row">

                <span>
                    Rejected
                </span>

                <span>
                    ${userRejected}
                </span>

            </div>


        </div>

    `;


    /*
       Newest first
    */

    userDeposits.sort(
        function(a,b){

            return (

                getDateValue(b) -

                getDateValue(a)

            );

        }
    );


    document.getElementById(
        "userDepositHistory"
    ).innerHTML =

        userDeposits.map(
            function(deposit){

                return createHistoryCard(
                    deposit
                );

            }
        ).join("");

};

/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

    if(
        phone === null ||
        phone === undefined
    ){

        return "";

    }


    let value =
        String(phone)
            .trim()
            .replace(
                /[^\d]/g,
                ""
            );


    /*
       639XXXXXXXXX
       becomes
       9XXXXXXXXX
    */

    if(
        value.startsWith("63")
    ){

        value =
            value.substring(2);

    }


    /*
       09XXXXXXXXX
       becomes
       9XXXXXXXXX
    */

    if(
        value.startsWith("0")
    ){

        value =
            value.substring(1);

    }


    return value;

}
