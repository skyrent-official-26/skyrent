/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value){

    let number = Number(value);

    if(!Number.isFinite(number)){
        number = 0;
    }

    return "₱" +
        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   SAFE NUMBER
===================================================== */

function numberValue(value){

    if(typeof value === "string"){

        value =
            value
                .replace(/₱/g,"")
                .replace(/,/g,"")
                .trim();

    }

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   FIRESTORE TIMESTAMP
===================================================== */

function timestampValue(value){

    if(!value){
        return 0;
    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(value instanceof Date){

        return value.getTime();

    }


    if(typeof value === "number"){

        return value;

    }


    if(typeof value === "string"){

        const parsed =
            Date.parse(value);

        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }


    return 0;

}


/* =====================================================
   FORMAT PURCHASE DATE
===================================================== */

function formatPurchaseDateTime(investment){

    const time =
        timestampValue(
            investment.purchaseDate ||
            investment.purchasedAt ||
            investment.startDate ||
            investment.startedAt
        );


    if(!time){
        return "Not available";
    }


    return new Date(time)
        .toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );

}


/* =====================================================
   GET PLAN NUMBER
===================================================== */

function getPlanNumber(investment){

    const planId =
        String(
            investment.planId ||
            ""
        );


    const match =
        planId.match(/\d+/);


    if(match){
        return match[0];
    }


    const name =
        String(
            investment.planName ||
            ""
        );


    const nameMatch =
        name.match(/\d+/);


    if(nameMatch){
        return nameMatch[0];
    }


    return "";

}


/* =====================================================
   DAILY INCOME
===================================================== */

function getDailyIncome(investment){

    return numberValue(
        investment.dailyIncome ??
        investment.daily ??
        0
    );

}


/* =====================================================
   INVESTMENT AMOUNT
===================================================== */

function getInvestmentAmount(investment){

    return numberValue(
        investment.amount ??
        investment.price ??
        0
    );

}


/* =====================================================
   TOTAL RETURN
===================================================== */

function getTotalReturn(investment){

    return numberValue(
        investment.totalReturn ??
        investment.total ??
        0
    );

}


/* =====================================================
   CYCLE
===================================================== */

function getCycle(investment){

    const cycle =
        numberValue(
            investment.cycleDays ??
            investment.cycle ??
            30
        );


    return cycle > 0
        ? cycle
        : 30;

}


/* =====================================================
   EARNED DAYS
===================================================== */

function getEarnedDays(investment){

    const days =
        numberValue(
            investment.earnedDays
        );


    return Math.max(
        0,
        Math.min(
            days,
            getCycle(investment)
        )
    );

}


/* =====================================================
   PURCHASE TIME
===================================================== */

function getPurchaseTime(investment){

    return timestampValue(
        investment.startDate ||
        investment.purchaseDate ||
        investment.purchasedAt ||
        investment.startedAt
    );

}


/* =====================================================
   NEXT CLAIM TIME
===================================================== */

function getNextClaimTime(investment){

    const purchaseTime =
        getPurchaseTime(
            investment
        );


    const earnedDays =
        getEarnedDays(
            investment
        );


    const cycle =
        getCycle(
            investment
        );


    if(!purchaseTime){
        return null;
    }


    if(earnedDays >= cycle){
        return null;
    }


    const DAY =
        24 * 60 * 60 * 1000;


    return (
        purchaseTime +
        ((earnedDays + 1) * DAY)
    );

}


/* =====================================================
   NORMALIZE STATUS
===================================================== */

function normalizeStatus(status){

    const value =
        String(
            status || "active"
        )
        .trim()
        .toLowerCase();


    if(value === "completed"){
        return "Completed";
    }


    if(
        value === "rejected" ||
        value === "declined" ||
        value === "cancelled"
    ){

        return "Rejected";

    }


    if(
        value === "pending" ||
        value === "pending approval"
    ){

        return "Pending Approval";

    }


    return "Active";

}


/* =====================================================
   UPDATE COMPLETION
===================================================== */

function updateCompletion(investment){

    const cycle =
        getCycle(
            investment
        );


    const earned =
        getEarnedDays(
            investment
        );


    if(earned >= cycle){

        investment.earnedDays =
            cycle;

        investment.remainingDays =
            0;

        investment.status =
            "Completed";

        return true;

    }


    investment.remainingDays =
        cycle - earned;


    return false;

}

/* =====================================================
   LOAD INVESTMENTS
===================================================== */

async function loadInvestments(){

    if(!currentUser){

        investments = [];

        return;

    }


    showFirebaseLoading();


    try{

        const investmentsRef =
            collection(
                db,
                "investments"
            );


        const investmentsQuery =
            query(
                investmentsRef,
                where(
                    "userId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                investmentsQuery
            );


        investments = [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                investments.push({

                    id:
                        docSnap.id,

                    ...data

                });

            }
        );


        investments.sort(
            function(a,b){

                return (
                    getPurchaseTime(b) -
                    getPurchaseTime(a)
                );

            }
        );


        investments.forEach(
            function(investment){

                investment.status =
                    normalizeStatus(
                        investment.status
                    );


                updateCompletion(
                    investment
                );

            }
        );

    }

    catch(error){

        console.error(
            "Firebase investment loading error:",
            error
        );


        investments = [];


        showPopup(
            "Unable to load your investments."
        );

    }

    finally{

        hideFirebaseLoading();

    }

}

function renderInvestments(){

    const list =
        document.getElementById(
            "investmentList"
        );


    if(!list){
        return;
    }


    list.innerHTML = "";


    if(
        investments.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✈️
                </div>

                <h3>
                    No Investments Yet
                </h3>

                <p>
                    Purchase a craft to start your investment.
                </p>

            </div>

        `;

        return;

    }


    investments.forEach(
        function(investment,index){

            const card =
                createInvestmentCard(
                    investment,
                    index
                );


            if(card){

                list.appendChild(
                    card
                );

            }

        }
    );

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(){

    const activeCount =
        investments.filter(
            function(investment){

                return (
                    normalizeStatus(
                        investment.status
                    ) === "Active"
                );

            }
        ).length;


    const activeAircraft =
        document.getElementById(
            "activeAircraft"
        );


    if(activeAircraft){

        activeAircraft.textContent =
            activeCount;

    }


    const activeDevices =
        document.getElementById(
            "activeDevices"
        );


    if(activeDevices){

        activeDevices.textContent =
            activeCount;

    }


    let totalIncome = 0;


    investments.forEach(
        function(investment){

            totalIncome +=
                numberValue(
                    investment.claimedTotal ||
                    0
                );

        }
    );


    const totalIncomeElement =
        document.getElementById(
            "totalIncome"
        );


    if(totalIncomeElement){

        totalIncomeElement.textContent =
            formatMoney(
                totalIncome
            );

    }


    let earliest = null;


    investments.forEach(
        function(investment){

            if(
                normalizeStatus(
                    investment.status
                ) !== "Active"
            ){

                return;

            }


            const next =
                getNextClaimTime(
                    investment
                );


            if(
                next &&
                (
                    earliest === null ||
                    next < earliest
                )
            ){

                earliest = next;

            }

        }
    );


    const nextFlight =
        document.getElementById(
            "nextFlight"
        );


    if(nextFlight){

        if(earliest === null){

            nextFlight.textContent =
                "—";

        }

        else{

            const remaining =
                earliest -
                Date.now();


            if(remaining <= 0){

                nextFlight.textContent =
                    "READY";

            }

            else{

                nextFlight.textContent =
                    "24H";

            }

        }

    }

}


/* =====================================================
   UPDATE COUNTDOWNS
===================================================== */

function updateCountdowns(){

    investments.forEach(
        function(investment,index){

            if(
                normalizeStatus(
                    investment.status
                ) !== "Active"
            ){

                return;

            }


            const timer =
                document.getElementById(
                    "timer-" + index
                );


            const box =
                document.getElementById(
                    "countdown-" + index
                );


            const button =
                document.getElementById(
                    "collect-" + index
                );


            if(
                !timer ||
                !box ||
                !button
            ){

                return;

            }


            /*
             * Do not overwrite button
             * while Firebase collection
             * is running.
             */

            if(
                button.classList.contains(
                    "collecting"
                )
            ){

                return;

            }


            const nextClaim =
                getNextClaimTime(
                    investment
                );


            if(!nextClaim){

                timer.textContent =
                    "COMPLETED";

                button.disabled =
                    true;

                return;

            }


            const remaining =
                nextClaim -
                Date.now();


            if(remaining <= 0){

                timer.textContent =
                    "READY TO COLLECT";


                box.classList.add(
                    "ready"
                );


                button.disabled =
                    false;


                button.innerHTML =
                    "💰 Collect Earnings";

            }

            else{

                box.classList.remove(
                    "ready"
                );


                button.disabled =
                    true;


                button.innerHTML =
                    "🔒 Collect Earnings";


                const hours =
                    Math.floor(
                        remaining /
                        (1000 * 60 * 60)
                    );


                const minutes =
                    Math.floor(
                        (
                            remaining %
                            (1000 * 60 * 60)
                        ) /
                        (1000 * 60)
                    );


                const seconds =
                    Math.floor(
                        (
                            remaining %
                            (1000 * 60)
                        ) /
                        1000
                    );


                timer.textContent =
                    String(hours)
                        .padStart(2,"0")
                    +
                    ":"
                    +
                    String(minutes)
                        .padStart(2,"0")
                    +
                    ":"
                    +
                    String(seconds)
                        .padStart(2,"0");

            }

        }
    );


    updateSummary();

}


/* =====================================================
   COLLECT EARNINGS
===================================================== */

async function collectEarning(index){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const investment =
        investments[index];


    if(!investment){

        alert(
            "Investment record not found."
        );

        return;

    }


    if(
        normalizeStatus(
            investment.status
        ) !== "Active"
    ){

        alert(
            "This investment is not active."
        );

        return;

    }


    /*
     * Prevent duplicate clicks.
     */

    const button =
        document.getElementById(
            "collect-" + index
        );


    if(
        button &&
        button.classList.contains(
            "collecting"
        )
    ){

        return;

    }


    /*
     * Check local timer first.
     */

    const nextClaim =
        getNextClaimTime(
            investment
        );


    if(
        !nextClaim ||
        Date.now() < nextClaim
    ){

        alert(
            "Your next earning is not ready yet."
        );

        return;

    }


    const daily =
        getDailyIncome(
            investment
        );


    if(daily <= 0){

        alert(
            "Daily earning amount is invalid."
        );

        return;

    }


    /* =================================================
       START LOADING
    ================================================= */

    if(button){

        button.disabled =
            true;


        button.classList.add(
            "collecting"
        );


        button.innerHTML = `

            <span class="collect-spinner"></span>

            <span>
                Collecting Earnings...
            </span>

        `;

    }


    /*
     * Keep loading active through
     * the complete async process.
     */

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const investmentRef =
            doc(
                db,
                "investments",
                investment.id
            );


        /* =================================================
           FIREBASE TRANSACTION
        ================================================= */

        const result =
            await runTransaction(
                db,
                async function(transaction){

                    /*
                     * READ USER FIRST
                     */

                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    /*
                     * READ INVESTMENT
                     */

                    const investmentSnap =
                        await transaction.get(
                            investmentRef
                        );


                    if(
                        !userSnap.exists()
                    ){

                        throw new Error(
                            "User account not found."
                        );

                    }


                    if(
                        !investmentSnap.exists()
                    ){

                        throw new Error(
                            "Investment record not found."
                        );

                    }


                    const userData =
                        userSnap.data();


                    const investmentData =
                        investmentSnap.data();


                    /*
                     * VERIFY STATUS
                     */

                    const firebaseStatus =
                        normalizeStatus(
                            investmentData.status
                        );


                    if(
                        firebaseStatus !==
                        "Active"
                    ){

                        throw new Error(
                            "This investment is no longer active."
                        );

                    }


                    /*
                     * CURRENT EARNED DAYS
                     */

                    const earnedDays =
                        getEarnedDays(
                            investmentData
                        );


                    const cycle =
                        getCycle(
                            investmentData
                        );


                    /*
                     * DO NOT ALLOW
                     * COLLECTION AFTER DAY 30.
                     */

                    if(
                        earnedDays >=
                        cycle
                    ){

                        throw new Error(
                            "This investment cycle is already completed."
                        );

                    }


                    /*
                     * ORIGINAL PURCHASE TIME
                     */

                    const startTime =
                        getPurchaseTime(
                            investmentData
                        );


                    if(!startTime){

                        throw new Error(
                            "Investment start time is missing."
                        );

                    }


                    /*
                     * FIXED 24-HOUR SCHEDULE
                     */

                    const DAY =
                        24 *
                        60 *
                        60 *
                        1000;


                    const claimTime =
                        startTime +
                        (
                            (earnedDays + 1) *
                            DAY
                        );


                    /*
                     * SERVER-SIDE DATE CHECK
                     */

                    if(
                        Date.now() <
                        claimTime
                    ){

                        throw new Error(
                            "Your next earning is not ready yet."
                        );

                    }


                    /*
                     * DAILY EARNING
                     */

                    const earning =
                        getDailyIncome(
                            investmentData
                        );


                    if(earning <= 0){

                        throw new Error(
                            "Daily earning amount is invalid."
                        );

                    }


                    /*
                     * CURRENT BALANCE
                     */

                    const oldBalance =
                        numberValue(
                            userData.balance
                        );


                    /*
                     * NEW BALANCE
                     */

                    const newBalance =
                        oldBalance +
                        earning;


                    /*
                     * MOVE EXACTLY ONE DAY
                     */

                    const newEarnedDays =
                        earnedDays + 1;


                    /*
                     * TOTAL CLAIMED
                     */

                    const oldClaimedTotal =
                        numberValue(
                            investmentData.claimedTotal
                        );


                    const newClaimedTotal =
                        oldClaimedTotal +
                        earning;


                    /*
                     * FINAL DAY
                     */

                    const completed =
                        newEarnedDays >=
                        cycle;


                    /*
                     * UPDATE USER BALANCE
                     */

                    transaction.update(
                        userRef,
                        {
                            balance:
                                newBalance
                        }
                    );


                    /*
                     * UPDATE INVESTMENT
                     */

                    transaction.update(
                        investmentRef,
                        {

                            earnedDays:
                                newEarnedDays,

                            claimedTotal:
                                newClaimedTotal,

                            remainingDays:
                                Math.max(
                                    0,
                                    cycle -
                                    newEarnedDays
                                ),

                            lastClaimAt:
                                serverTimestamp(),

                            status:
                                completed
                                    ? "Completed"
                                    : "Active"

                        }
                    );


                    return {

                        earning:
                            earning,

                        newBalance:
                            newBalance,

                        newEarnedDays:
                            newEarnedDays,

                        completed:
                            completed

                    };

                }
            );


        /* =================================================
           SAVE EARNINGS HISTORY
        ================================================= */

        try{

            await addDoc(
                collection(
                    db,
                    "earnings"
                ),
                {

                    userId:
                        currentUser.uid,

                    userPhone:
                        currentUserData?.phone ||
                        "",

                    userName:
                        currentUserData?.name ||
                        "",

                    investmentId:
                        investment.id,

                    planId:
                        investment.planId ||
                        "",

                    planName:
                        investment.planName ||
                        "Aircraft Investment",

                    amount:
                        result.earning,

                    type:
                        "daily investment earning",

                    createdAt:
                        serverTimestamp()

                }
            );

        }

        catch(historyError){

            console.error(
                "Earnings history error:",
                historyError
            );

        }


        /*
         * UPDATE LOCAL BALANCE
         */

        if(currentUserData){

            currentUserData.balance =
                result.newBalance;

        }


        /*
         * RELOAD DATA BEFORE
         * SHOWING SUCCESS.
         */

        await loadInvestments();


        renderInvestments();

        updateSummary();

        updateCountdowns();


        /*
         * REFRESH INCOME HISTORY
         */

        const incomeSection =
            document.getElementById(
                "incomeSection"
            );


        if(
            incomeSection &&
            incomeSection.style.display !==
            "none"
        ){

            await renderIncomeHistory();

        }


        /* =================================================
           REMOVE LOADING
        ================================================= */

        if(button){

            button.classList.remove(
                "collecting"
            );

        }


        /*
         * SUCCESS MESSAGE APPEARS
         * ONLY AFTER PROCESSING FINISHES.
         */

        showPopup(
            "💰 " +
            formatMoney(
                result.earning
            ) +
            " added to your available balance!"
        );

    }

    catch(error){

        console.error(
            "Collect earning error:",
            error
        );


        /*
         * REMOVE LOADING STATE
         */

        if(button){

            button.classList.remove(
                "collecting"
            );


            button.disabled =
                false;


            button.innerHTML =
                "💰 Collect Earnings";

        }


        /*
         * RELOAD FIREBASE DATA
         */

        await loadInvestments();


        renderInvestments();

        updateSummary();

        updateCountdowns();


        /*
         * SHOW ERROR
         */

        alert(
            error.message ||
            "Unable to collect earnings."
        );

    }

}


/* =====================================================
   INCOME HISTORY
   ONLY AIRCRAFT / INVESTMENT EARNINGS
   REGISTRATION BONUS EXCLUDED
===================================================== */

async function renderIncomeHistory(){

    const list =
        document.getElementById(
            "incomeList"
        );


    if(!list){
        return;
    }


    list.innerHTML = "";


    if(!currentUser){
        return;
    }


    try{

        const earningsQuery =
            query(
                collection(
                    db,
                    "earnings"
                ),
                where(
                    "userId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                earningsQuery
            );


        const earnings = [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                /*
                 * ONLY include genuine
                 * aircraft/investment earnings.
                 */

                const earningType =
                    String(
                        data.type || ""
                    )
                    .trim()
                    .toLowerCase();


                const hasInvestment =
                    !!data.investmentId;


                const isAircraftEarning =
                    earningType ===
                    "daily investment earning"
                    &&
                    hasInvestment;


                /*
                 * Registration bonuses
                 * and other non-aircraft
                 * earnings are ignored.
                 */

                if(!isAircraftEarning){
                    return;
                }


                earnings.push({

                    id:
                        docSnap.id,

                    ...data

                });

            }
        );


        earnings.sort(
            function(a,b){

                return (
                    timestampValue(
                        b.createdAt
                    )
                    -
                    timestampValue(
                        a.createdAt
                    )
                );

            }
        );


        /* =================================================
           NO AIRCRAFT EARNINGS
        ================================================= */

        if(
            earnings.length === 0
        ){

            list.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        💰
                    </div>

                    <h3>
                        No Aircraft Earnings Yet
                    </h3>

                    <p>
                        Your collected aircraft earnings
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        /* =================================================
           DISPLAY AIRCRAFT EARNINGS
        ================================================= */

        earnings.forEach(
            function(earning){

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "income-card";


                const date =
                    timestampValue(
                        earning.createdAt
                    );


                const dateText =
                    date

                    ?

                    new Date(date)
                        .toLocaleString(
                            "en-PH",
                            {

                                year:"numeric",

                                month:"short",

                                day:"numeric",

                                hour:"2-digit",

                                minute:"2-digit",

                                hour12:true

                            }
                        )

                    :

                    "Processing";


                card.innerHTML = `

                    <div class="income-left">

                        <strong>
                            ${
                                earning.planName ||
                                "Aircraft Earnings"
                            }
                        </strong>

                        <span>
                            Daily investment earning •
                            ${dateText}
                        </span>

                    </div>


                    <div class="income-amount">

                        ${formatMoney(
                            earning.amount
                        )}

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );

    }

    catch(error){

        console.error(
            "Earnings history error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to Load Earnings
                </h3>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER ALL
===================================================== */

async function renderAll(){

    await loadInvestments();

    renderInvestments();

    await renderIncomeHistory();

    updateSummary();

    updateCountdowns();

}


/* =====================================================
   TABS
===================================================== */

function showProgress(){

    const progress =
        document.getElementById(
            "progressSection"
        );


    const income =
        document.getElementById(
            "incomeSection"
        );


    const progressTab =
        document.getElementById(
            "progressTab"
        );


    const incomeTab =
        document.getElementById(
            "incomeTab"
        );


    if(progress){

        progress.style.display =
            "block";

    }


    if(income){

        income.style.display =
            "none";

    }


    if(progressTab){

        progressTab.classList.add(
            "active"
        );

    }


    if(incomeTab){

        incomeTab.classList.remove(
            "active"
        );

    }

}


async function showIncome(){

    const progress =
        document.getElementById(
            "progressSection"
        );


    const income =
        document.getElementById(
            "incomeSection"
        );


    const progressTab =
        document.getElementById(
            "progressTab"
        );


    const incomeTab =
        document.getElementById(
            "incomeTab"
        );


    if(progress){

        progress.style.display =
            "none";

    }


    if(income){

        income.style.display =
            "block";

    }


    if(progressTab){

        progressTab.classList.remove(
            "active"
        );

    }


    if(incomeTab){

        incomeTab.classList.add(
            "active"
        );

    }


    await renderIncomeHistory();

}


/* =====================================================
   POPUP
===================================================== */

let popupTimeout = null;


function showPopup(message){

    const popup =
        document.getElementById(
            "popup"
        );


    if(!popup){
        return;
    }


    popup.textContent =
        message;


    popup.classList.add(
        "show"
    );


    clearTimeout(
        popupTimeout
    );


    popupTimeout =
        setTimeout(
            function(){

                popup.classList.remove(
                    "show"
                );

            },
            3000
        );

}

/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "/";

            return;

        }


        currentUser =
            user;


        showFirebaseLoading();


        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                throw new Error(
                    "SkyRent user account was not found."
                );

            }


            currentUserData =
                userSnap.data();


            await renderAll();

        }

        catch(error){

            console.error(
                "My Aircraft initialization error:",
                error
            );


            hideFirebaseLoading();


            showPopup(
                "Unable to load your SkyRent account."
            );

        }

    }
);

    1000
);

===================================================== */

document.addEventListener(

    async function(){

            currentUser
        ){

            await renderAll();

        }

    }
);
