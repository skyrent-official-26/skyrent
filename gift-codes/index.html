<script type="module">


/* =====================================================

    getDocs,

}
from

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserData = null;


/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value){

    let number =
        Number(value);

    if(!Number.isFinite(number)){

        number = 0;

    }

    return "₱" +

        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   NUMBER VALUE
===================================================== */

function numberValue(value){

    if(
        typeof value ===
        "string"
    ){

        value =
            value
                .replace(/₱/g,"")
                .replace(/,/g,"")
                .trim();

    }


    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   TIMESTAMP VALUE
===================================================== */

function timestampValue(value){

    if(!value){

        return 0;

    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value instanceof Date
    ){

        return value.getTime();

    }


    if(
        typeof value ===
        "number"
    ){

        return value;

    }


    if(
        typeof value ===
        "string"
    ){

        const parsed =
            Date.parse(value);


        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }


    return 0;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    const time =
        timestampValue(value);


    if(!time){

        return "Processing";

    }


    return new Date(time)
        .toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    if(!message){

        return;

    }


    message.textContent =
        text;


    message.className =
        "message " +
        type;

}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage(){

    const message =
        document.getElementById(
            "message"
        );


    if(message){

        message.textContent =
            "";

        message.className =
            "message";

    }

}


/* =====================================================
   UPDATE BALANCE DISPLAY
===================================================== */

function updateBalanceDisplay(){

    const balanceElement =
        document.getElementById(
            "balanceValue"
        );


    if(!balanceElement){

        return;

    }


    const balance =
        numberValue(
            currentUserData?.balance
        );


    balanceElement.textContent =
        formatMoney(
            balance
        );

}


/* =====================================================
   LOAD USER DATA
===================================================== */

async function loadUserData(){

    if(!currentUser){

        return;

    }


    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const userSnap =
        await getDoc(
            userRef
        );


    if(!userSnap.exists()){

        throw new Error(
            "SkyRent user account was not found."
        );

    }


    currentUserData =
        userSnap.data();


    updateBalanceDisplay();

}


/* =====================================================
   FIND GIFT CODE
===================================================== */

async function findGiftCode(code){

    /*
       First try document ID.
    */

    const directRef =
        doc(
            db,
            "giftCodes",
            code
        );


    const directSnap =
        await getDoc(
            directRef
        );


    if(directSnap.exists()){

        return {

            id:
                directSnap.id,

            ref:
                directRef,

            data:
                directSnap.data()

        };

    }


    /*
       Otherwise search code field.
    */

    const codesRef =
        collection(
            db,
            "giftCodes"
        );


    const codesQuery =
        query(
            codesRef,
            where(
                "code",
                "==",
                code
            )
        );


    const snapshot =
        await getDocs(
            codesQuery
        );


    if(snapshot.empty){

        return null;

    }


    const first =
        snapshot.docs[0];


    return {

        id:
            first.id,

        ref:
            first.ref,

        data:
            first.data()

    };

}


/* =====================================================
   SELECT RANDOM REMAINING REWARD
===================================================== */

function selectRandomReward(
    rewardPool
){

    if(
        !Array.isArray(
            rewardPool
        )
    ){

        throw new Error(
            "This gift code has no reward pool."
        );

    }


    /*
       Calculate total remaining slots.
    */

    let totalRemaining = 0;


    rewardPool.forEach(
        function(item){

            const remaining =
                Math.max(
                    0,
                    Math.floor(
                        numberValue(
                            item.remaining
                        )
                    )
                );


            totalRemaining +=
                remaining;

        }
    );


    if(
        totalRemaining <= 0
    ){

        throw new Error(
            "This gift code is FULL. All rewards have already been claimed."
        );

    }


    /*
       Random position.
    */

    let randomPosition =
        Math.floor(
            Math.random() *
            totalRemaining
        );


    /*
       Find selected reward.
    */

    for(
        let i = 0;
        i < rewardPool.length;
        i++
    ){

        const remaining =
            Math.max(
                0,
                Math.floor(
                    numberValue(
                        rewardPool[i].remaining
                    )
                )
            );


        if(
            remaining <= 0
        ){

            continue;

        }


        if(
            randomPosition <
            remaining
        ){

            return i;

        }


        randomPosition -=
            remaining;

    }


    throw new Error(
        "Unable to select a reward."
    );

}


/* =====================================================
   REDEEM GIFT CODE
===================================================== */

async function redeemGiftCode(){

    if(!currentUser){

        showMessage(
            "Please login first.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "giftCode"
        );


    const button =
        document.getElementById(
            "redeemButton"
        );


    if(
        !input ||
        !button
    ){

        return;

    }


    const code =
        input.value
            .trim()
            .toUpperCase();


    clearMessage();


    if(!code){

        showMessage(
            "Please enter a gift code.",
            "error"
        );

        return;

    }


    /*
       Loading state.
    */

    button.disabled =
        true;


    button.classList.add(
        "loading"
    );


    button.innerHTML = `

        <span class="spinner"></span>

        <span>
            Redeeming Gift Code...
        </span>

    `;


    try{

        /*
           Find gift code.
        */

        const gift =
            await findGiftCode(
                code
            );


        if(!gift){

            throw new Error(
                "Invalid gift code."
            );

        }


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const giftRef =
            gift.ref;


        /*
           FIRESTORE TRANSACTION
        */

        const result =
            await runTransaction(
                db,
                async function(transaction){

                    /*
                       READ USER
                    */

                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    /*
                       READ GIFT CODE
                    */

                    const giftSnap =
                        await transaction.get(
                            giftRef
                        );


                    if(
                        !userSnap.exists()
                    ){

                        throw new Error(
                            "User account was not found."
                        );

                    }


                    if(
                        !giftSnap.exists()
                    ){

                        throw new Error(
                            "Gift code was not found."
                        );

                    }


                    const userData =
                        userSnap.data();


                    const giftData =
                        giftSnap.data();


                    /*
                       CHECK GIFT STATUS
                    */

                    if(

                        giftData.active === false ||

                        giftData.status ===
                            "inactive" ||

                        giftData.status ===
                            "disabled" ||

                        giftData.status ===
                            "full"

                    ){

                        throw new Error(
                            "This gift code is no longer available."
                        );

                    }


                    /*
                       USED BY
                    */

                    let usedBy =
                        Array.isArray(
                            giftData.usedBy
                        )

                        ? [
                            ...giftData.usedBy
                        ]

                        : [];


                    /*
                       PREVENT DUPLICATE CLAIM
                    */

                    if(
                        usedBy.includes(
                            currentUser.uid
                        )
                    ){

                        throw new Error(
                            "You have already redeemed this gift code."
                        );

                    }


                    /*
                       REWARD POOL
                    */

                    let rewardPool =

                        Array.isArray(
                            giftData.rewardPool
                        )

                        ?

                        giftData.rewardPool.map(
                            function(item){

                                return {

                                    amount:
                                        numberValue(
                                            item.amount
                                        ),

                                    quantity:
                                        Math.max(
                                            0,
                                            Math.floor(
                                                numberValue(
                                                    item.quantity
                                                )
                                            )
                                        ),

                                    remaining:
                                        Math.max(
                                            0,
                                            Math.floor(
                                                numberValue(
                                                    item.remaining
                                                )
                                            )
                                        )

                                };

                            }
                        )

                        :

                        [];


                    if(
                        rewardPool.length === 0
                    ){

                        throw new Error(
                            "This gift code has no reward pool."
                        );

                    }


                    /*
                       TOTAL REMAINING SLOTS
                    */

                    let totalRemaining =
                        0;


                    rewardPool.forEach(
                        function(item){

                            totalRemaining +=
                                Math.max(
                                    0,
                                    numberValue(
                                        item.remaining
                                    )
                                );

                        }
                    );


                    if(
                        totalRemaining <= 0
                    ){

                        throw new Error(
                            "This gift code is FULL. All rewards have already been claimed."
                        );

                    }


                    /*
                       SELECT RANDOM REWARD
                    */

                    const selectedIndex =
                        selectRandomReward(
                            rewardPool
                        );


                    const selectedReward =
                        numberValue(
                            rewardPool[
                                selectedIndex
                            ].amount
                        );


                    if(
                        selectedReward <= 0
                    ){

                        throw new Error(
                            "Selected reward amount is invalid."
                        );

                    }


                    /*
                       REMOVE ONE REWARD SLOT
                    */

                    rewardPool[
                        selectedIndex
                    ].remaining -= 1;


                    if(
                        rewardPool[
                            selectedIndex
                        ].remaining < 0
                    ){

                        rewardPool[
                            selectedIndex
                        ].remaining = 0;

                    }


                    /*
                       NEW COUNTS
                    */

                    const oldClaimCount =
                        numberValue(
                            giftData.claimCount
                        );


                    const newClaimCount =
                        oldClaimCount + 1;


                    const newRemainingSlots =
                        Math.max(
                            0,
                            totalRemaining - 1
                        );


                    /*
                       NEW GIFT STATUS
                    */

                    const newStatus =
                        newRemainingSlots <= 0
                            ? "full"
                            : "active";


                    /*
                       USER BALANCE
                    */

                    const oldBalance =
                        numberValue(
                            userData.balance
                        );


                    const newBalance =
                        oldBalance +
                        selectedReward;


                    /*
                       USER TOTAL EARNINGS
                    */

                    const oldTotalEarnings =
                        numberValue(
                            userData.totalEarnings
                        );


                    const newTotalEarnings =
                        oldTotalEarnings +
                        selectedReward;


                    /*
                       UPDATE USER
                    */

                    transaction.update(
                        userRef,
                        {

                            balance:
                                newBalance,

                            totalEarnings:
                                newTotalEarnings

                        }
                    );


                    /*
                       ADD USER TO USED BY
                    */

                    usedBy.push(
                        currentUser.uid
                    );


                    /*
                       UPDATE GIFT CODE
                    */

                    transaction.update(
                        giftRef,
                        {

                            rewardPool:
                                rewardPool,

                            claimCount:
                                newClaimCount,

                            remainingSlots:
                                newRemainingSlots,

                            status:
                                newStatus,

                            usedBy:
                                usedBy

                        }
                    );


                    /*
                       CREATE CLAIM RECORD
                    */

                    const claimRef =
                        doc(
                            collection(
                                db,
                                "giftCodeClaims"
                            )
                        );


                    transaction.set(
                        claimRef,
                        {

                            giftCodeId:
                                giftRef.id,

                            code:
                                giftData.code ||
                                code,

                            userId:
                                currentUser.uid,

                            userName:
                                userData.name ||
                                "",

                            phone:
                                userData.phone ||
                                "",

                            amount:
                                selectedReward,

                            claimedAt:
                                serverTimestamp(),

                            status:
                                "claimed"

                        }
                    );


                    /*
                       CREATE EARNINGS RECORD
                    */

                    const earningsRef =
                        doc(
                            collection(
                                db,
                                "earnings"
                            )
                        );


                    transaction.set(
                        earningsRef,
                        {

                            userId:
                                currentUser.uid,

                            userPhone:
                                userData.phone ||
                                "",

                            userName:
                                userData.name ||
                                "",

                            type:
                                "gift code",

                            name:
                                "Gift Code",

                            source:
                                "Gift Code",

                            description:
                                "Gift Code Reward",

                            amount:
                                selectedReward,

                            giftCode:
                                giftData.code ||
                                code,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    /*
                       RETURN RESULT
                    */

                    return {

                        reward:
                            selectedReward,

                        newBalance:
                            newBalance,

                        newTotalEarnings:
                            newTotalEarnings,

                        newClaimCount:
                            newClaimCount,

                        newRemainingSlots:
                            newRemainingSlots,

                        code:
                            giftData.code ||
                            code

                    };

                }
            );


        /*
           UPDATE LOCAL USER DATA
        */

        if(
            currentUserData
        ){

            currentUserData.balance =
                result.newBalance;


            currentUserData.totalEarnings =
                result.newTotalEarnings;

        }


        updateBalanceDisplay();


        /*
           SUCCESS
        */

        input.value = "";


        showMessage(

            "🎁 Gift code redeemed successfully! " +

            formatMoney(
                result.reward
            ) +

            " has been added to your Available Balance and Earnings.",

            "success"

        );


        /*
           RELOAD HISTORY
        */

        await loadRedeemedHistory();


    }
    catch(error){

        console.error(
            "Gift code redemption error:",
            error
        );


        showMessage(

            error.message ||

            "Unable to redeem this gift code.",

            "error"

        );

    }
    finally{

        /*
           RESTORE BUTTON
        */

        button.disabled =
            false;


        button.classList.remove(
            "loading"
        );


        button.innerHTML =
            "🎁 Redeem Gift Code";

    }

}


/* =====================================================
   LOAD REDEEMED HISTORY
===================================================== */

async function loadRedeemedHistory(){

    if(!currentUser){

        return;

    }


    const list =
        document.getElementById(
            "historyList"
        );


    if(!list){

        return;

    }


    list.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ⏳
            </div>

            <h3>
                Loading History
            </h3>

            <p>
                Please wait...
            </p>

        </div>

    `;


    try{

        /*
           Get user's earnings.
        */

        const earningsRef =
            collection(
                db,
                "earnings"
            );


        const earningsQuery =
            query(
                earningsRef,
                where(
                    "userId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                earningsQuery
            );


        const giftEarnings =
            [];


        snapshot.forEach(
            function(docSnap){

                const data =
                    docSnap.data();


                const type =
                    String(
                        data.type || ""
                    )
                    .toLowerCase();


                const name =
                    String(
                        data.name || ""
                    )
                    .toLowerCase();


                if(

                    type.includes("gift") ||

                    name.includes("gift")

                ){

                    giftEarnings.push({

                        id:
                            docSnap.id,

                        ...data

                    });

                }

            }
        );


        /*
           Newest first.
        */

        giftEarnings.sort(
            function(a,b){

                return (

                    timestampValue(
                        b.createdAt
                    )

                    -

                    timestampValue(
                        a.createdAt
                    )

                );

            }
        );


        /*
           No history.
        */

        if(
            giftEarnings.length === 0
        ){

            list.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🎁
                    </div>

                    <h3>
                        No Gift Codes Yet
                    </h3>

                    <p>
                        Your redeemed gift codes
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML =
            "";


        /*
           Display each gift reward.
        */

        giftEarnings.forEach(
            function(earning){

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "history-card";


                const code =
                    earning.giftCode ||
                    "Gift Code";


                const amount =
                    numberValue(
                        earning.amount
                    );


                card.innerHTML = `

                    <div class="history-left">

                        <div class="history-code">

                            🎁

                            ${escapeHTML(
                                code
                            )}

                        </div>

                        <div class="history-date">

                            ${formatDate(
                                earning.createdAt
                            )}

                        </div>

                    </div>


                    <div class="history-right">

                        <div class="history-amount">

                            +${formatMoney(
                                amount
                            )}

                        </div>

                        <div class="redeemed-label">

                            REDEEMED

                        </div>

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


    }
    catch(error){

        console.error(
            "Gift code history error:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to Load History
                </h3>

                <p>
                    Please refresh the page
                    and try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
