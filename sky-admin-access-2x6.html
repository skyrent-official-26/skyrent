<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent Admin Login</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #075985 0%,
            #0284c7 50%,
            #38bdf8 100%
        );

    padding: 20px;
}


/* =========================
   LOGIN BOX
========================= */

.login-box {
    width: 100%;
    max-width: 380px;

    background: #ffffff;

    border-radius: 20px;

    padding: 30px 25px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);
}


/* =========================
   LOGO
========================= */

.logo {
    width: 78px;
    height: 78px;

    margin: 0 auto 16px;

    border-radius: 50%;

    background: #075985;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    box-shadow:
        0 6px 18px rgba(7, 89, 133, 0.30);
}

.logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 8px;
}


/* =========================
   TITLE
========================= */

h1 {
    color: #0f172a;

    font-size: 24px;
    font-weight: 700;

    margin-bottom: 6px;
}


.subtitle {
    color: #64748b;

    font-size: 13px;

    margin-bottom: 25px;
}


/* =========================
   INPUT GROUP
========================= */

.input-group {
    text-align: left;

    margin-bottom: 16px;
}


.input-group label {
    display: block;

    color: #334155;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 7px;
}


.input-group input {
    width: 100%;

    height: 48px;

    padding: 0 13px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    outline: none;

    background: #ffffff;

    color: #0f172a;

    font-size: 14px;

    transition: 0.2s;
}


.input-group input::placeholder {
    color: #94a3b8;
}


.input-group input:focus {
    border-color: #0284c7;

    box-shadow:
        0 0 0 3px rgba(2, 132, 199, 0.12);
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn {
    width: 100%;

    height: 48px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #075985,
            #0284c7
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    margin-top: 5px;

    box-shadow:
        0 6px 15px rgba(2, 132, 199, 0.25);

    transition: 0.2s;
}


.login-btn:hover {
    background:
        linear-gradient(
            135deg,
            #064e73,
            #0369a1
        );
}


.login-btn:active {
    transform: scale(0.98);
}


.login-btn:disabled {
    opacity: 0.75;

    cursor: not-allowed;
}


/* =========================
   SPINNER
========================= */

.spinner {
    display: inline-block;

    width: 16px;
    height: 16px;

    border: 3px solid rgba(255, 255, 255, 0.35);

    border-top-color: #ffffff;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;

    vertical-align: middle;

    margin-right: 7px;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.error {
    display: none;

    margin-top: 15px;

    padding: 11px;

    border-radius: 9px;

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #dc2626;

    font-size: 12px;

    font-weight: 600;

    line-height: 1.4;
}


.error.show {
    display: block;
}


/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 22px;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {
        padding: 16px;
    }

    .login-box {
        padding: 27px 20px;

        border-radius: 18px;
    }

    .logo {
        width: 72px;
        height: 72px;
    }

    h1 {
        font-size: 22px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="skyrent-logo.png"
            alt="SkyRent Logo"
        >

    </div>


    <!-- TITLE -->

    <h1>
        SkyRent Admin
    </h1>

    <div class="subtitle">
        Administrator Login
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <div class="input-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login to Admin Panel
        </button>


    </form>


    <!-- ERROR -->

    <div
        class="error"
        id="errorMessage"
    ></div>


    <!-- FOOTER -->

    <div class="footer">
        SkyRent Admin Panel
    </div>


</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   ADMIN DETAILS
========================================= */

const ADMIN_EMAIL =
    "admin@skyrent.com";

const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");


/* =========================================
   ERROR
========================================= */

function showError(message) {

    errorMessage.textContent = message;

    errorMessage.classList.add("show");

}


function hideError() {

    errorMessage.textContent = "";

    errorMessage.classList.remove("show");

}


/* =========================================
   RESET BUTTON
========================================= */

function resetLoginButton() {

    loginButton.disabled = false;

    loginButton.innerHTML =
        "🔐 Login to Admin Panel";

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideError();

        const email =
            usernameInput.value
            .trim()
            .toLowerCase();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showError(
                "❌ Please enter your email and password."
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.innerHTML =
            '<span class="spinner"></span> Logging in...';


        try {

            /* =========================
               FIREBASE LOGIN
            ========================= */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            console.log(
                "Firebase login successful:",
                user.email
            );

            console.log(
                "Firebase UID:",
                user.uid
            );


            /* =========================
               VERIFY EMAIL
            ========================= */

            if (
                !user.email ||
                user.email.toLowerCase()
                !== ADMIN_EMAIL.toLowerCase()
            ) {

                showError(
                    "❌ Access denied. This account is not the administrator."
                );

                resetLoginButton();

                return;
            }


            /* =========================
               VERIFY UID
            ========================= */

            if (
                user.uid !== ADMIN_UID
            ) {

                showError(
                    "❌ Access denied. This account is not the administrator."
                );

                resetLoginButton();

                return;
            }


            /* =========================
               ADMIN VERIFIED
            ========================= */

            sessionStorage.setItem(
                "skyRentAdminLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "skyRentAdminUID",
                user.uid
            );


            console.log(
                "✅ ADMIN VERIFIED"
            );


            /* =========================
               REDIRECT
            ========================= */

            window.location.href =
                "admin.html";

        }

        catch (error) {

            console.error(
                "Firebase admin login error:",
                error
            );


            resetLoginButton();


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                showError(
                    "❌ Incorrect email or password."
                );

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                showError(
                    "❌ Admin account was not found in Firebase."
                );

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                showError(
                    "❌ Incorrect password."
                );

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                showError(
                    "❌ Too many login attempts. Please try again later."
                );

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                showError(
                    "❌ Network error. Please check your internet connection."
                );

            }

            else {

                showError(
                    "❌ Login failed. Please try again."
                );

            }

        }

    }
);

</script>

</body>

</html>
