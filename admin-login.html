<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SkyRent Admin Login</title>

<!-- =========================
     ADMIN PWA
========================= -->

<link rel="manifest" href="admin-manifest.json">

<meta name="theme-color" content="#0757c9">

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="SkyRent Admin"
>

<!-- Admin icon -->
<link
    rel="icon"
    type="image/png"
    href="admin-icon-192.png"
>

<link
    rel="apple-touch-icon"
    href="admin-icon-192.png"
>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #075985,
            #0284c7,
            #38bdf8
        );

    padding:20px;
}


/* =========================
   LOGIN BOX
========================= */

.login-box{

    width:100%;

    max-width:380px;

    background:white;

    border-radius:18px;

    padding:30px 25px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.20);

    text-align:center;
}


/* =========================
   LOGO
========================= */

.logo{

    width:70px;

    height:70px;

    margin:
        0 auto 15px;

    border-radius:50%;

    background:#075985;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 5px 15px
        rgba(7,89,133,.25);

    overflow:hidden;
}


.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    padding:8px;
}


/* =========================
   TITLE
========================= */

h1{

    color:#0f172a;

    font-size:24px;

    margin-bottom:5px;
}


.subtitle{

    color:#64748b;

    font-size:13px;

    margin-bottom:25px;
}


/* =========================
   INPUT GROUP
========================= */

.input-group{

    text-align:left;

    margin-bottom:15px;
}


.input-group label{

    display:block;

    font-size:13px;

    font-weight:bold;

    color:#334155;

    margin-bottom:6px;
}


.input-group input{

    width:100%;

    padding:13px 12px;

    border:
        1px solid #cbd5e1;

    border-radius:9px;

    outline:none;

    font-size:14px;

    transition:.2s;
}


.input-group input:focus{

    border-color:#0284c7;

    box-shadow:
        0 0 0 3px
        rgba(2,132,199,.12);
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    border:none;

    background:#075985;

    color:white;

    padding:13px;

    border-radius:9px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

    transition:.2s;
}


.login-btn:hover{

    background:#0369a1;
}


.login-btn:active{

    transform:scale(.98);
}


.login-btn:disabled{

    opacity:.75;

    cursor:not-allowed;

    pointer-events:none;
}


/* =========================
   LOADING SPINNER
========================= */

.spinner{

    display:inline-block;

    width:16px;

    height:16px;

    border:
        3px solid
        rgba(255,255,255,.35);

    border-top-color:white;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    vertical-align:middle;

    margin-right:7px;
}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =========================
   ERROR MESSAGE
========================= */

.error{

    display:none;

    margin-top:15px;

    padding:10px;

    border-radius:8px;

    background:#fef2f2;

    color:#dc2626;

    font-size:12px;

    font-weight:bold;
}


.error.show{

    display:block;
}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:20px;

    font-size:11px;

    color:#94a3b8;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .login-box{

        padding:25px 20px;

    }

    h1{

        font-size:22px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN BOX
========================= -->

<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="skyrent-logo.png"
            alt="SkyRent Logo"
        >

    </div>


    <!-- TITLE -->

    <h1>

        SkyRent Admin

    </h1>


    <div class="subtitle">

        Administrator Login

    </div>


    <!-- =========================
         LOGIN FORM
    ========================= -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="input-group">

            <label for="username">

                Username

            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >

            🔐 Login to Admin Panel

        </button>


    </form>


    <!-- ERROR MESSAGE -->

    <div
        class="error"
        id="errorMessage"
    >

        ❌ Incorrect username or password.

    </div>


    <!-- FOOTER -->

    <div class="footer">

        SkyRent Admin Panel

    </div>


</div>


<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3m1O7YLEaFAa4e8",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};



/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);



/* =========================================
   ADMIN DETAILS
========================================= */

const ADMIN_EMAIL =
    "admin@skyrent.com";


const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";



/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");


const usernameInput =
    document.getElementById("username");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginBtn");


const errorMessage =
    document.getElementById("errorMessage");



/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

}



/* =========================================
   HIDE ERROR
========================================= */

function hideError(){

    errorMessage.style.display =
        "none";

}



/* =========================================
   RESET LOGIN BUTTON
========================================= */

function resetLoginButton(){

    loginButton.disabled =
        false;

    loginButton.innerHTML =
        "🔐 Login to Admin Panel";

}



/* =========================================
   LOGIN FORM
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideError();


        /* ================================
           GET INPUTS
        ================================= */

        const email =
            usernameInput
                .value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;



        /* ================================
           CHECK INPUT
        ================================= */

        if(
            !email ||
            !password
        ){

            showError(
                "❌ Please enter your email and password."
            );

            return;

        }



        /* ================================
           BUTTON LOADING
        ================================= */

        loginButton.disabled =
            true;


        loginButton.innerHTML =
            '<span class="spinner"></span> Logging in...';



        try{


            /* ================================
               FIREBASE LOGIN
            ================================= */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;



            console.log(
                "Firebase login successful:",
                user.email
            );


            console.log(
                "Firebase UID:",
                user.uid
            );



            /* ================================
               VERIFY ADMIN EMAIL
            ================================= */

            if(
                !user.email ||
                user.email.toLowerCase()
                !== ADMIN_EMAIL
            ){

                showError(
                    "❌ Access denied. This account is not the administrator."
                );

                resetLoginButton();

                return;

            }



            /* ================================
               VERIFY ADMIN UID
            ================================= */

            if(
                user.uid !== ADMIN_UID
            ){

                showError(
                    "❌ Access denied. This account is not the administrator."
                );

                resetLoginButton();

                return;

            }



            /* ================================
               ADMIN VERIFIED
            ================================= */

            sessionStorage.setItem(
                "skyRentAdminLoggedIn",
                "true"
            );


            sessionStorage.setItem(
                "skyRentAdminUID",
                user.uid
            );


            console.log(
                "✅ ADMIN VERIFIED"
            );



            /* ================================
               REDIRECT TO ADMIN DASHBOARD
            ================================= */

            window.location.href =
                "admin.html";


        }

        catch(error){

            console.error(
                "Firebase admin login error:",
                error
            );


            resetLoginButton();



            /* ================================
               FIREBASE ERRORS
            ================================= */

            if(
                error.code ===
                "auth/invalid-credential"
            ){

                showError(
                    "❌ Incorrect email or password."
                );

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                showError(
                    "❌ Admin account was not found in Firebase."
                );

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                showError(
                    "❌ Incorrect password."
                );

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                showError(
                    "❌ Too many login attempts. Please try again later."
                );

            }

            else{

                showError(
                    "❌ Login failed. Please try again."
                );

            }

        }

    }
);



</script>


</body>

</html>
