<!DOCTYPE html>

<html lang="en">

<head>

<title>SkyRent Actual Funds</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#eef6ff;
    color:#222;
    padding:15px;
}

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.header{
    background:linear-gradient(
        135deg,
        #0757c9,
        #1597ff
    );
    color:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.header h1{
    font-size:23px;
    margin-bottom:6px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

.auth-box{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    font-size:13px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.auth-ok{
    color:#176b2c;
    background:#eaf8ee;
}

.auth-error{
    color:#a51d2d;
    background:#fff0f1;
}

.loading{
    color:#0757c9;
    background:#eaf4ff;
}

.summary{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.summary-card{
    background:white;
    border-radius:15px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.summary-title{
    font-size:11px;
    color:#777;
    margin-bottom:8px;
}

.summary-value{
    font-size:19px;
    font-weight:bold;
    color:#0757c9;
}

.remaining .summary-value{
    color:#16843b;
}

.section{
    background:white;
    border-radius:17px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.section h2{
    color:#0757c9;
    font-size:18px;
    margin-bottom:14px;
}

.empty{
    text-align:center;
    padding:25px 10px;
    color:#888;
    font-size:14px;
}

.record{
    border:1px solid #e5eaf0;
    border-radius:13px;
    padding:13px;
    margin-bottom:10px;
    background:#fbfdff;
}

.record:last-child{
    margin-bottom:0;
}

.record-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
}

.record-id{
    font-size:11px;
    color:#777;
    word-break:break-all;
}

.amount{
    font-size:17px;
    font-weight:bold;
    color:#0757c9;
    white-space:nowrap;
}

.detail{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:8px;
}

.detail-box{
    background:#f4f7fa;
    padding:8px;
    border-radius:8px;
}

.detail-label{
    font-size:10px;
    color:#888;
    margin-bottom:3px;
}

.detail-value{
    font-size:12px;
    word-break:break-word;
}

.refresh{
    width:100%;
    border:none;
    background:#0757c9;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:15px;
}

.refresh:disabled{
    opacity:.6;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:
            1fr;
    }

    .summary-card{
        padding:13px;
    }

    .detail{
        grid-template-columns:
            1fr;
    }

}

</style>

</head>

<body>

<div class="container">

```

</div>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =================================
   SAME FIREBASE CONFIG
================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDAbHsV-S363u-sGCBo3mO1Y7YLEaFAa4e",

    authDomain:
        "skyrent-ea30c.firebaseapp.com",

    projectId:
        "skyrent-ea30c",

    storageBucket:
        "skyrent-ea30c.firebasestorage.app",

    messagingSenderId:
        "572678456448",

    appId:
        "1:572678456448:web:6b7132351515742dd09265"

};


const ADMIN_UID =
    "28zzG9NB46gRkwia7WtOxS1lQNa2";


/* =================================
   FIREBASE
================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =================================
   ELEMENTS
================================= */

const authBox =
    document.getElementById(
        "authBox"
    );

const depositTotal =
    document.getElementById(
        "depositTotal"
    );

const withdrawalTotal =
    document.getElementById(
        "withdrawalTotal"
    );

const remainingTotal =
    document.getElementById(
        "remainingTotal"
    );

const depositList =
    document.getElementById(
        "depositList"
    );

const withdrawalList =
    document.getElementById(
        "withdrawalList"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );


/* =================================
   FORMAT MONEY
================================= */

function money(value){

    const number =
        Number(value) || 0;

    return "₱" +
        number.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =================================
   GET AMOUNT
================================= */

function getAmount(data){

    const fields = [

        "amount",
        "depositAmount",
        "withdrawalAmount",
        "amountValue",
        "requestedAmount",
        "investmentAmount",
        "planAmount",
        "price",
        "value"

    ];


    for(
        const field of fields
    ){

        if(
            data[field] !==
            undefined &&
            data[field] !== null &&
            data[field] !== ""
        ){

            const value =
                Number(data[field]);

            if(
                !isNaN(value)
            ){

                return value;

            }

        }

    }

    return 0;

}


/* =================================
   CHECK UNMARKED
================================= */

function isUnmarked(data){

    const type =
        data.transactionType;


    /*
     * ONLY these are unmarked:
     *
     * undefined
     * null
     * empty string
     */

    return (
        type === undefined ||
        type === null ||
        String(type).trim() === ""
    );

}


/* =================================
   FORMAT DATE
================================= */

function formatDate(value){

    if(!value){
        return "—";
    }


    try{

        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .toLocaleString();

        }


        if(
            value instanceof Date
        ){

            return value
                .toLocaleString();

        }


        return String(value);

    }
    catch(error){

        return "—";

    }

}


/* =================================
   FIND USER DISPLAY
================================= */

function getUserValue(
    data,
    fields
){

    for(
        const field of fields
    ){

        if(
            data[field] !==
            undefined &&
            data[field] !== null &&
            data[field] !== ""
        ){

            return data[field];

        }

    }

    return "—";

}


/* =================================
   LOAD DEPOSITS
================================= */

async function loadDeposits(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "deposits"
            )
        );


    const records = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            /*
             * IMPORTANT:
             *
             * Test and Actual are
             * automatically excluded.
             *
             * Only unmarked records
             * are included.
             */

            if(
                isUnmarked(data)
            ){

                records.push({

                    id:item.id,
                    data:data

                });

            }

        }
    );


    return records;

}


/* =================================
   LOAD WITHDRAWALS
================================= */

async function loadWithdrawals(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "withdrawals"
            )
        );


    const records = [];


    snapshot.forEach(
        item => {

            const data =
                item.data();


            /*
             * Only unmarked
             * withdrawals.
             */

            if(
                isUnmarked(data)
            ){

                records.push({

                    id:item.id,
                    data:data

                });

            }

        }
    );


    return records;

}


/* =================================
   RENDER DEPOSITS
================================= */

function renderDeposits(
    records
){

    if(
        records.length === 0
    ){

        depositList.innerHTML = `

            <div class="empty">

                No unmarked deposits found.

            </div>

        `;

        return 0;

    }


    let total = 0;


    depositList.innerHTML =
        records.map(
            record => {

                const data =
                    record.data;

                const amount =
                    getAmount(data);

                total += amount;


                const reference =
                    getUserValue(
                        data,
                        [
                            "reference",
                            "referenceNumber",
                            "refNumber",
                            "transactionReference"
                        ]
                    );


                const phone =
                    getUserValue(
                        data,
                        [
                            "phone",
                            "phoneNumber",
                            "userPhone"
                        ]
                    );


                const name =
                    getUserValue(
                        data,
                        [
                            "name",
                            "userName",
                            "fullName"
                        ]
                    );


                const date =
                    getUserValue(
                        data,
                        [
                            "createdAt",
                            "timestamp",
                            "date"
                        ]
                    );


                return `

                    <div class="record">

                        <div class="record-top">

                            <div class="record-id">

                                ID:
                                ${escapeHtml(
                                    record.id
                                )}

                            </div>

                            <div class="amount">

                                ${money(amount)}

                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-box">

                                <div class="detail-label">
                                    NAME
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(name)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    PHONE
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(phone)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    REFERENCE
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(reference)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    DATE
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(
                                        formatDate(date)
                                    )}

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");


    return total;

}


/* =================================
   RENDER WITHDRAWALS
================================= */

function renderWithdrawals(
    records
){

    if(
        records.length === 0
    ){

        withdrawalList.innerHTML = `

            <div class="empty">

                No unmarked withdrawals found.

            </div>

        `;

        return 0;

    }


    let total = 0;


    withdrawalList.innerHTML =
        records.map(
            record => {

                const data =
                    record.data;

                const amount =
                    getAmount(data);

                total += amount;


                const phone =
                    getUserValue(
                        data,
                        [
                            "phone",
                            "phoneNumber",
                            "userPhone"
                        ]
                    );


                const name =
                    getUserValue(
                        data,
                        [
                            "name",
                            "userName",
                            "fullName"
                        ]
                    );


                const account =
                    getUserValue(
                        data,
                        [
                            "accountNumber",
                            "withdrawalAccount",
                            "account",
                            "gcashNumber",
                            "mayaNumber"
                        ]
                    );


                const date =
                    getUserValue(
                        data,
                        [
                            "createdAt",
                            "timestamp",
                            "date"
                        ]
                    );


                return `

                    <div class="record">

                        <div class="record-top">

                            <div class="record-id">

                                ID:
                                ${escapeHtml(
                                    record.id
                                )}

                            </div>

                            <div class="amount">

                                ${money(amount)}

                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-box">

                                <div class="detail-label">
                                    NAME
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(name)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    PHONE
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(phone)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    ACCOUNT
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(account)}

                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    DATE
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(
                                        formatDate(date)
                                    )}

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");


    return total;

}


/* =================================
   LOAD EVERYTHING
================================= */

async function loadActualFunds(){

    refreshButton.disabled =
        true;

    refreshButton.textContent =
        "⏳ Loading...";


    depositList.innerHTML = `

        <div class="empty">
            Loading deposits...
        </div>

    `;


    withdrawalList.innerHTML = `

        <div class="empty">
            Loading withdrawals...
        </div>

    `;


    try{

        const deposits =
            await loadDeposits();


        const withdrawals =
            await loadWithdrawals();


        const depositAmount =
            renderDeposits(
                deposits
            );


        const withdrawalAmount =
            renderWithdrawals(
                withdrawals
            );


        const remaining =
            depositAmount -
            withdrawalAmount;


        depositTotal.textContent =
            money(depositAmount);


        withdrawalTotal.textContent =
            money(withdrawalAmount);


        remainingTotal.textContent =
            money(remaining);


        authBox.className =
            "auth-box auth-ok";


        authBox.innerHTML = `

            <strong>
                ✅ Firebase connected
            </strong>

            <br>

            Showing only unmarked
            deposit and withdrawal records.

            <br>

            Deposits found:
            ${deposits.length}

            &nbsp; | &nbsp;

            Withdrawals found:
            ${withdrawals.length}

        `;


    }
    catch(error){

        console.error(
            "Actual Funds Error:",
            error
        );


        authBox.className =
            "auth-box auth-error";


        authBox.innerHTML = `

            <strong>
                ❌ Unable to load Firebase data
            </strong>

            <br><br>

            ${escapeHtml(
                error.message
            )}

        `;


        depositList.innerHTML = `

            <div class="empty">

                Unable to load deposits.

            </div>

        `;


        withdrawalList.innerHTML = `

            <div class="empty">

                Unable to load withdrawals.

            </div>

        `;

    }


    refreshButton.disabled =
        false;

    refreshButton.textContent =
        "🔄 Refresh";

}


/* =================================
   AUTH
================================= */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "Actual Funds Firebase user:",
            user
        );


        /*
         * We do NOT redirect.
         * We do NOT sign out.
         *
         * The page simply tries to
         * read the data when Firebase
         * provides an authenticated user.
         */

        if(!user){

            /*
             * Since your classifier already
             * works, this message simply
             * tells us Firebase did not
             * provide the session here.
             */

            authBox.className =
                "auth-box auth-error";


            authBox.innerHTML = `

                <strong>
                    ⚠️ Firebase session not detected
                </strong>

                <br><br>

                Firebase did not provide a
                signed-in user to this page.

            `;


            refreshButton.disabled =
                true;


            return;

        }


        /*
         * Verify administrator.
         */

        if(
            user.uid !==
            ADMIN_UID
        ){

            authBox.className =
                "auth-box auth-error";


            authBox.innerHTML = `

                <strong>
                    ❌ Access Denied
                </strong>

                <br><br>

                Firebase user detected,
                but this account is not
                the administrator.

            `;


            refreshButton.disabled =
                true;


            return;

        }


        /*
         * Administrator confirmed.
         */

        authBox.className =
            "auth-box auth-ok";


        authBox.innerHTML = `

            <strong>
                ✅ Administrator verified
            </strong>

            <br>

            Loading unmarked funds...

        `;


        refreshButton.disabled =
            false;


        await loadActualFunds();

    }
);


/* =================================
   REFRESH BUTTON
================================= */

refreshButton.addEventListener(
    "click",
    async function(){

        const user =
            auth.currentUser;


        if(!user){

            authBox.className =
                "auth-box auth-error";


            authBox.innerHTML = `

                <strong>
                    ⚠️ Firebase session not detected
                </strong>

                <br><br>

                Please open the page from
                the working admin dashboard.

            `;

            return;

        }


        if(
            user.uid !==
            ADMIN_UID
        ){

            return;

        }


        await loadActualFunds();

    }
);

</script>
