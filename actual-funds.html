<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SkyRent - Unmarked Funds</title> <style> *{ box-sizing:border-box; margin:0; padding:0; } body{ font-family:Arial,sans-serif; background:#f4f8fc; color:#222; } header{ background:linear-gradient(135deg,#0757c9,#168cff); color:white; padding:20px; position:sticky; top:0; z-index:10; box-shadow:0 3px 12px rgba(0,0,0,.15); } .header-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; } header h1{ font-size:21px; } .back-btn{ background:white; color:#0757c9; text-decoration:none; padding:9px 13px; border-radius:9px; font-size:13px; font-weight:bold; } .container{ max-width:900px; margin:auto; padding:18px; } .loading{ text-align:center; padding:60px 20px; color:#666; } .loading-spinner{ width:38px; height:38px; border:4px solid #ddd; border-top-color:#0757c9; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 15px; } @keyframes spin{ to{ transform:rotate(360deg); } } #error{ display:none; background:#ffebee; color:#c62828; padding:15px; border-radius:10px; margin-bottom:15px; } .summary-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; } .summary-card{ background:white; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.07); } .summary-card .label{ font-size:12px; color:#777; margin-bottom:7px; } .summary-card .value{ font-size:20px; font-weight:bold; } .deposit-value{ color:#168447; } .withdraw-value{ color:#d32f2f; } .net-value{ color:#0757c9; } .section{ margin-top:22px; } .section-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; } .section-title h2{ font-size:18px; } .count{ background:#e8f1ff; color:#0757c9; padding:5px 9px; border-radius:20px; font-size:12px; font-weight:bold; } .record{ background:white; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.07); } .record-top{ display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; } .record-name{ font-size:16px; font-weight:bold; } .amount{ font-size:17px; font-weight:bold; white-space:nowrap; } .deposit-amount{ color:#168447; } .withdraw-amount{ color:#d32f2f; } .row{ display:flex; justify-content:space-between; gap:15px; padding:7px 0; border-top:1px solid #f0f0f0; font-size:13px; } .row .label{ color:#777; } .row .value{ text-align:right; word-break:break-word; } .status{ display:inline-block; padding:4px 8px; border-radius:20px; font-size:11px; font-weight:bold; background:#eee; } .status.approved{ background:#e7f7ed; color:#168447; } .status.pending{ background:#fff4d6; color:#9a6a00; } .empty{ background:white; border-radius:14px; padding:30px 20px; text-align:center; color:#777; box-shadow:0 2px 10px rgba(0,0,0,.06); } .refresh-btn{ width:100%; border:none; background:#0757c9; color:white; padding:13px; border-radius:11px; font-size:14px; font-weight:bold; margin-bottom:20px; cursor:pointer; } @media(max-width:600px){ .summary-grid{ grid-template-columns:1fr; } .summary-card .value{ font-size:22px; } } </style> </head> <body> <header> <div class="header-row"> <h1>💰 Unmarked Funds</h1> <a href="admin.html" class="back-btn"> Admin </a> </div> </header> <div id="loading" class="loading"> <div class="loading-spinner"></div> <div> Loading unmarked data... </div> </div> <div id="main" class="container" style="display:none;"> <div id="error"></div> <button class="refresh-btn" onclick="loadData()"> 🔄 Refresh Data </button> <!-- SUMMARY --> <div class="summary-grid"> <div class="summary-card"> <div class="label"> UNMARKED DEPOSITS </div> <div id="totalDeposits" class="value deposit-value"> ₱0.00 </div> </div> <div class="summary-card"> <div class="label"> UNMARKED WITHDRAWALS </div> <div id="totalWithdrawals" class="value withdraw-value"> ₱0.00 </div> </div> <div class="summary-card"> <div class="label"> NET FUNDS </div> <div id="netFunds" class="value net-value"> ₱0.00 </div> </div> </div> <!-- DEPOSITS --> <div class="section"> <div class="section-title"> <h2> 💳 Unmarked Deposits </h2> <span id="depositCount" class="count"> 0 </span> </div> <div id="depositList"></div> </div> <!-- WITHDRAWALS --> <div class="section"> <div class="section-title"> <h2> 💸 Unmarked Withdrawals </h2> <span id="withdrawalCount" class="count"> 0 </span> </div> <div id="withdrawalList"></div> </div> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ========================= FIREBASE ========================= */ const firebaseConfig = { apiKey: "AIzaSyDAbHsV-S363u-sGCBo3mO1Y7YLEaFAa4e", authDomain: "skyrent-ea30c.firebaseapp.com", projectId: "skyrent-ea30c", storageBucket: "skyrent-ea30c.firebasestorage.app", messagingSenderId: "572678456448", appId: "1:572678456448:web:6b7132351515742dd09265" }; const ADMIN_UID = "28zzG9NB46gRkwia7WtOxS1lQNa2"; const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ========================= HELPERS ========================= */ function safe(value){ if( value === null || value === undefined ){ return ""; } return String(value); } function escapeHtml(value){ return safe(value) .replace(/&/g,"&amp;") .replace(/</g,"&lt;") .replace(/>/g,"&gt;") .replace(/"/g,"&quot;") .replace(/'/g,"&#039;"); } function getAmount(data){ const fields = [ "amount", "depositAmount", "withdrawalAmount", "amountValue", "requestedAmount", "investmentAmount", "planAmount", "price", "value" ]; for(const field of fields){ if( data[field] !== undefined && data[field] !== null && data[field] !== "" ){ const number = Number( String(data[field]) .replace(/,/g,"") .replace(/[₱$]/g,"") ); if(!isNaN(number)){ return number; } } } return 0; } function getName(data){ return ( data.name || data.fullName || data.displayName || data.userName || data.username || "Unknown User" ); } function getPhone(data){ return ( data.phone || data.phoneNumber || data.mobile || data.mobileNumber || "—" ); } function getEmail(data){ return ( data.email || data.emailAddress || "—" ); } function getReference(data){ return ( data.reference || data.referenceNumber || data.ref || data.transactionId || data.transactionReference || "—" ); } function getStatus(data){ return ( data.status || data.state || (data.approved === true ? "approved" : "—") ); } function getDate(value){ if(!value){ return "—"; } try{ if( typeof value === "object" && value.seconds ){ return new Date( value.seconds * 1000 ).toLocaleString(); } return new Date(value).toLocaleString(); }catch(error){ return safe(value); } } function getRecordDate(data){ return ( data.createdAt || data.timestamp || data.date || data.createdDate || data.updatedAt || null ); } /* ========================= UNMARKED CHECK ========================= */ function isUnmarked(data){ const type = data.transactionType; /* Only records with NO transactionType are shown. test = excluded actual = excluded blank/missing = shown */ return !type || String(type).trim() === ""; } /* ========================= LOAD COLLECTION ========================= */ async function loadCollection( collectionName ){ const snapshot = await getDocs( collection( db, collectionName ) ); return snapshot.docs.map( item => ({ id:item.id, data:item.data() }) ); } /* ========================= LOAD DATA ========================= */ window.loadData = async function(){ try{ document .getElementById("error") .style.display = "none"; const deposits = await loadCollection( "deposits" ); const withdrawals = await loadCollection( "withdrawals" ); /* ONLY UNMARKED DATA */ const unmarkedDeposits = deposits.filter( item => isUnmarked(item.data) ); const unmarkedWithdrawals = withdrawals.filter( item => isUnmarked(item.data) ); renderDeposits( unmarkedDeposits ); renderWithdrawals( unmarkedWithdrawals ); updateSummary( unmarkedDeposits, unmarkedWithdrawals ); }catch(error){ console.error(error); const errorBox = document.getElementById("error"); errorBox.style.display = "block"; errorBox.innerHTML = "❌ Error loading Firebase data:<br><br>" + escapeHtml(error.message); } }; /* ========================= SUMMARY ========================= */ function updateSummary( deposits, withdrawals ){ let totalDeposits = 0; let totalWithdrawals = 0; deposits.forEach( item => { totalDeposits += getAmount(item.data); } ); withdrawals.forEach( item => { totalWithdrawals += getAmount(item.data); } ); const net = totalDeposits - totalWithdrawals; document .getElementById("totalDeposits") .textContent = "₱" + totalDeposits.toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); document .getElementById("totalWithdrawals") .textContent = "₱" + totalWithdrawals.toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); document .getElementById("netFunds") .textContent = "₱" + net.toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); } /* ========================= RENDER DEPOSITS ========================= */ function renderDeposits( records ){ const container = document.getElementById( "depositList" ); document .getElementById("depositCount") .textContent = records.length; if(records.length === 0){ container.innerHTML = ` <div class="empty"> No unmarked deposits found. </div> `; return; } /* Newest first when possible */ records.sort( (a,b) => { const da = getRecordDate(a.data); const db = getRecordDate(b.data); return ( dateToNumber(db) - dateToNumber(da) ); } ); container.innerHTML = records.map( item => { const data = item.data; const amount = getAmount(data); const status = getStatus(data); const statusClass = String(status) .toLowerCase() .includes("approved") || String(status) .toLowerCase() .includes("successful") || String(status) .toLowerCase() .includes("completed") ? "approved" : "pending"; return ` <div class="record"> <div class="record-top"> <div class="record-name"> ${escapeHtml( getName(data) )} </div> <div class="amount deposit-amount"> +₱${amount.toLocaleString( "en-PH", { minimumFractionDigits:2 } )} </div> </div> <div class="row"> <span class="label"> Phone </span> <span class="value"> ${escapeHtml( getPhone(data) )} </span> </div> <div class="row"> <span class="label"> Email </span> <span class="value"> ${escapeHtml( getEmail(data) )} </span> </div> <div class="row"> <span class="label"> Reference </span> <span class="value"> ${escapeHtml( getReference(data) )} </span> </div> <div class="row"> <span class="label"> Status </span> <span class="value"> <span class="status ${statusClass}"> ${escapeHtml( status )} </span> </span> </div> <div class="row"> <span class="label"> Date </span> <span class="value"> ${escapeHtml( getDate( getRecordDate(data) ) )} </span> </div> <div class="row"> <span class="label"> Document ID </span> <span class="value"> ${escapeHtml( item.id )} </span> </div> </div> `; } ).join(""); } /* ========================= RENDER WITHDRAWALS ========================= */ function renderWithdrawals( records ){ const container = document.getElementById( "withdrawalList" ); document .getElementById("withdrawalCount") .textContent = records.length; if(records.length === 0){ container.innerHTML = ` <div class="empty"> No unmarked withdrawals found. </div> `; return; } records.sort( (a,b) => { const da = getRecordDate(a.data); const db = getRecordDate(b.data); return ( dateToNumber(db) - dateToNumber(da) ); } ); container.innerHTML = records.map( item => { const data = item.data; const amount = getAmount(data); const status = getStatus(data); const statusClass = String(status) .toLowerCase() .includes("approved") || String(status) .toLowerCase() .includes("successful") || String(status) .toLowerCase() .includes("completed") ? "approved" : "pending"; return ` <div class="record"> <div class="record-top"> <div class="record-name"> ${escapeHtml( getName(data) )} </div> <div class="amount withdraw-amount"> -₱${amount.toLocaleString( "en-PH", { minimumFractionDigits:2 } )} </div> </div> <div class="row"> <span class="label"> Phone </span> <span class="value"> ${escapeHtml( getPhone(data) )} </span> </div> <div class="row"> <span class="label"> Email </span> <span class="value"> ${escapeHtml( getEmail(data) )} </span> </div> <div class="row"> <span class="label"> Reference </span> <span class="value"> ${escapeHtml( getReference(data) )} </span> </div> <div class="row"> <span class="label"> Status </span> <span class="value"> <span class="status ${statusClass}"> ${escapeHtml( status )} </span> </span> </div> <div class="row"> <span class="label"> Date </span> <span class="value"> ${escapeHtml( getDate( getRecordDate(data) ) )} </span> </div> <div class="row"> <span class="label"> Document ID </span> <span class="value"> ${escapeHtml( item.id )} </span> </div> </div> `; } ).join(""); } /* ========================= DATE SORT HELPER ========================= */ function dateToNumber(value){ if(!value){ return 0; } try{ if( typeof value === "object" && value.seconds ){ return Number( value.seconds ) * 1000; } const date = new Date(value); const time = date.getTime(); return isNaN(time) ? 0 : time; }catch(error){ return 0; } } /* ========================= ADMIN AUTH ========================= */ onAuthStateChanged( auth, async user => { if(!user){ window.location.href = "index.html"; return; } if(user.uid !== ADMIN_UID){ document.body.innerHTML = ` <div style=" padding:50px 20px; text-align:center; font-family:Arial; "> <h2 style=" color:#c62828; margin-bottom:10px; "> Access Denied </h2> <p style=" color:#666; "> You are not authorized to access this page. </p> </div> `; return; } document .getElementById("loading") .style.display = "none"; document .getElementById("main") .style.display = "block"; await loadData(); } ); </script> </body> </html>
