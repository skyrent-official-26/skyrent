<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>SkyRent Admin - Actual Funds</title> <style> *{ box-sizing:border-box; margin:0; padding:0; } body{ font-family:Arial,sans-serif; background:#f1f7fc; color:#123; padding-bottom:40px; } /* HEADER */ .header{ background:linear-gradient( 135deg, #0757c9, #0b8de3 ); color:white; padding:20px 15px; text-align:center; box-shadow:0 3px 12px rgba(0,0,0,.15); } .header h1{ font-size:21px; margin-bottom:6px; } .header p{ font-size:12px; opacity:.9; } /* CONTAINER */ .container{ max-width:1000px; margin:auto; padding:15px; } /* BACK BUTTON */ .back-btn{ width:100%; border:none; background:white; color:#0757c9; padding:13px; border-radius:12px; font-size:14px; font-weight:700; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,.08); cursor:pointer; } /* NOTICE */ .notice{ background:#eaf5ff; color:#14527f; border-left:4px solid #168de2; border-radius:10px; padding:12px; font-size:12px; line-height:1.5; margin-bottom:15px; } /* ERROR */ .error{ background:#fff0f0; color:#a32626; border-left:4px solid #d93636; border-radius:10px; padding:12px; font-size:13px; margin-bottom:15px; } /* SUMMARY */ .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:15px; } .summary-card{ background:white; border-radius:13px; padding:15px 8px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.07); } .summary-number{ font-size:19px; font-weight:800; } .summary-label{ font-size:10px; color:#666; margin-top:5px; } .deposit-number{ color:#159447; } .withdrawal-number{ color:#d93636; } .remaining-card{ background:linear-gradient( 135deg, #0757c9, #0b8de3 ); color:white; } .remaining-card .summary-label{ color:rgba(255,255,255,.85); } /* SECTION */ .section-title{ display:flex; justify-content:space-between; align-items:center; margin:20px 0 10px; } .section-title h2{ font-size:17px; } .count{ background:#eaf2ff; color:#0757c9; padding:5px 9px; border-radius:20px; font-size:11px; font-weight:800; } /* RECORDS */ .records-grid{ width:100%; } .card{ background:white; border-radius:14px; padding:15px; margin-bottom:10px; box-shadow:0 2px 9px rgba(0,0,0,.08); } .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; } .card-title{ font-size:15px; font-weight:800; color:#17324d; } .card-subtitle{ font-size:11px; color:#777; margin-top:3px; word-break:break-word; } .amount{ white-space:nowrap; font-size:16px; font-weight:800; } .deposit-amount{ color:#159447; } .withdrawal-amount{ color:#d93636; } .info{ border-top:1px solid #edf0f3; padding-top:9px; } .row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; font-size:12px; } .row span:first-child{ color:#777; } .row span:last-child{ font-weight:600; text-align:right; word-break:break-word; } /* EMPTY */ .empty{ background:white; border-radius:14px; padding:30px 15px; text-align:center; color:#777; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.05); } /* LOADING */ .loading{ text-align:center; padding:40px 10px; color:#666; font-size:14px; } /* AUTH DEBUG */ .auth-box{ background:#fff8e1; color:#795548; border-left:4px solid #ffb300; border-radius:10px; padding:14px; font-size:13px; line-height:1.6; margin-bottom:15px; } .hidden{ display:none; } /* DESKTOP */ @media(min-width:700px){ .records-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .card{ margin-bottom:0; } } /* MOBILE */ @media(max-width:500px){ .summary{ gap:6px; } .summary-number{ font-size:16px; } .summary-label{ font-size:9px; } } </style> </head> <body> <div class="header"> <h1> 🏦 Actual Funds </h1> <p> Unmarked deposits and withdrawals </p> </div> <div class="container"> <button class="back-btn" onclick="window.location.href='admin.html'" > ← Back to Admin </button> <div id="message" ></div> <!-- AUTH STATUS --> <div id="authBox" class="auth-box" > Checking administrator session... </div> <!-- CONTENT --> <div id="mainContent" class="hidden" > <!-- SUMMARY --> <div class="summary"> <div class="summary-card"> <div id="depositTotal" class="summary-number deposit-number" > ₱0.00 </div> <div class="summary-label"> 💰 Unmarked Deposits </div> </div> <div class="summary-card"> <div id="withdrawalTotal" class="summary-number withdrawal-number" > ₱0.00 </div> <div class="summary-label"> 💸 Unmarked Withdrawals </div> </div> <div class="summary-card remaining-card"> <div id="remainingTotal" class="summary-number" > ₱0.00 </div> <div class="summary-label"> 🏦 Remaining Funds </div> </div> </div> <!-- DEPOSITS --> <div class="section-title"> <h2> 💰 Unmarked Deposits </h2> <span id="depositCount" class="count" > 0 </span> </div> <div id="depositContainer" class="records-grid" > <div class="loading"> Loading deposits... </div> </div> <!-- WITHDRAWALS --> <div class="section-title"> <h2> 💸 Unmarked Withdrawals </h2> <span id="withdrawalCount" class="count" > 0 </span> </div> <div id="withdrawalContainer" class="records-grid" > <div class="loading"> Loading withdrawals... </div> </div> </div> </div> <script type="module"> /* ===================================================== SAME FIREBASE IMPORTS AS WORKING CLASSIFIER ===================================================== */ import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ===================================================== SAME FIREBASE CONFIG AS WORKING CLASSIFIER ===================================================== */ const firebaseConfig = { apiKey: "AIzaSyDAbHsV-S363u-sGCBo3mO1Y7YLEaFAa4e8", authDomain: "skyrent-ea30c.firebaseapp.com", projectId: "skyrent-ea30c", storageBucket: "skyrent-ea30c.firebasestorage.app", messagingSenderId: "572678456448", appId: "1:572678456448:web:6b7132351515742dd09265" }; const ADMIN_UID = "28zzG9NB46gRkwia7WtOxS1lQNa2"; /* ===================================================== SAME FIREBASE INITIALIZATION ===================================================== */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ===================================================== DATA ===================================================== */ let deposits = []; let withdrawals = []; /* ===================================================== HELPERS ===================================================== */ function safe(value){ if( value === null || value === undefined || value === "" ){ return "-"; } return String(value); } function escapeHtml(value){ return String(value) .replace(/&/g,"&amp;") .replace(/</g,"&lt;") .replace(/>/g,"&gt;") .replace(/"/g,"&quot;") .replace(/'/g,"&#039;"); } function getName(data){ return ( data.name || data.fullName || data.displayName || data.userName || data.username || data.customerName || "Unknown User" ); } function getPhone(data){ return ( data.phone || data.phoneNumber || data.mobile || data.mobileNumber || "-" ); } function getReference(data){ return ( data.reference || data.referenceNumber || data.ref || data.transactionReference || data.paymentReference || "-" ); } function getAmount(data){ const fields = [ "amount", "depositAmount", "withdrawalAmount", "amountValue", "requestedAmount", "investmentAmount", "planAmount", "price", "value" ]; for( const field of fields ){ if( data[field] !== undefined && data[field] !== null && data[field] !== "" ){ const number = Number(data[field]); if( Number.isFinite(number) ){ return number; } } } return 0; } function getDate(value){ if(!value){ return "-"; } try{ if(value.seconds){ return new Date( value.seconds * 1000 ).toLocaleString(); } if( typeof value.toDate === "function" ){ return value .toDate() .toLocaleString(); } return new Date(value) .toLocaleString(); }catch(error){ return safe(value); } } /* ===================================================== UNMARKED CHECK ===================================================== */ function isUnmarked(data){ const type = data.transactionType; return ( type === undefined || type === null || type === "" ); } /* ===================================================== LOAD COLLECTION ===================================================== */ async function loadCollection( collectionName ){ const snapshot = await getDocs( collection( db, collectionName ) ); return snapshot.docs.map( item => ({ id:item.id, data:item.data() }) ); } /* ===================================================== FORMAT MONEY ===================================================== */ function money(value){ return "₱" + Number(value || 0) .toLocaleString( "en-PH", { minimumFractionDigits:2, maximumFractionDigits:2 } ); } /* ===================================================== LOAD ACTUAL FUNDS ===================================================== */ async function loadActualFunds(){ try{ const allDeposits = await loadCollection( "deposits" ); const allWithdrawals = await loadCollection( "withdrawals" ); /* ONLY UNMARKED RECORDS */ deposits = allDeposits.filter( item => isUnmarked( item.data ) ); withdrawals = allWithdrawals.filter( item => isUnmarked( item.data ) ); /* TOTALS */ let depositTotal = 0; let withdrawalTotal = 0; deposits.forEach( item => { depositTotal += getAmount( item.data ); } ); withdrawals.forEach( item => { withdrawalTotal += getAmount( item.data ); } ); const remaining = depositTotal - withdrawalTotal; /* DISPLAY TOTALS */ document.getElementById( "depositTotal" ).textContent = money(depositTotal); document.getElementById( "withdrawalTotal" ).textContent = money(withdrawalTotal); document.getElementById( "remainingTotal" ).textContent = money(remaining); document.getElementById( "depositCount" ).textContent = deposits.length; document.getElementById( "withdrawalCount" ).textContent = withdrawals.length; renderDeposits(); renderWithdrawals(); document.getElementById( "mainContent" ).classList.remove( "hidden" ); }catch(error){ console.error(error); showError( "Unable to load Firebase data: " + error.message ); } } /* ===================================================== RENDER DEPOSITS ===================================================== */ function renderDeposits(){ const container = document.getElementById( "depositContainer" ); if( deposits.length === 0 ){ container.innerHTML = ` <div class="empty"> No unmarked deposits found. </div> `; return; } container.innerHTML = deposits.map( item => { const data = item.data; const amount = getAmount(data); return ` <div class="card"> <div class="card-top"> <div> <div class="card-title"> ${escapeHtml( getName(data) )} </div> <div class="card-subtitle"> Deposit </div> </div> <div class="amount deposit-amount"> +${money(amount)} </div> </div> <div class="info"> <div class="row"> <span> Phone </span> <span> ${escapeHtml( getPhone(data) )} </span> </div> <div class="row"> <span> Reference </span> <span> ${escapeHtml( getReference(data) )} </span> </div> <div class="row"> <span> Status </span> <span> ${escapeHtml( safe(data.status) )} </span> </div> <div class="row"> <span> Date </span> <span> ${escapeHtml( getDate( data.createdAt || data.timestamp || data.date || data.submittedAt ) )} </span> </div> <div class="row"> <span> Firebase ID </span> <span> ${escapeHtml( item.id )} </span> </div> </div> </div> `; } ).join(""); } /* ===================================================== RENDER WITHDRAWALS ===================================================== */ function renderWithdrawals(){ const container = document.getElementById( "withdrawalContainer" ); if( withdrawals.length === 0 ){ container.innerHTML = ` <div class="empty"> No unmarked withdrawals found. </div> `; return; } container.innerHTML = withdrawals.map( item => { const data = item.data; const amount = getAmount(data); return ` <div class="card"> <div class="card-top"> <div> <div class="card-title"> ${escapeHtml( getName(data) )} </div> <div class="card-subtitle"> Withdrawal </div> </div> <div class="amount withdrawal-amount"> -${money(amount)} </div> </div> <div class="info"> <div class="row"> <span> Phone </span> <span> ${escapeHtml( getPhone(data) )} </span> </div> <div class="row"> <span> Status </span> <span> ${escapeHtml( safe(data.status) )} </span> </div> <div class="row"> <span> Date </span> <span> ${escapeHtml( getDate( data.createdAt || data.timestamp || data.date || data.requestedAt ) )} </span> </div> <div class="row"> <span> Firebase ID </span> <span> ${escapeHtml( item.id )} </span> </div> </div> </div> `; } ).join(""); } /* ===================================================== ERROR ===================================================== */ function showError(message){ const messageBox = document.getElementById( "message" ); messageBox.innerHTML = ` <div class="error"> ${escapeHtml(message)} </div> `; } /* ===================================================== ADMIN AUTH SAME LOGIC AS YOUR WORKING CLASSIFIER, BUT WE DO NOT REDIRECT ON NULL USER. ===================================================== */ onAuthStateChanged( auth, async user => { const authBox = document.getElementById( "authBox" ); if(!user){ authBox.innerHTML = ` <strong> ⚠️ Administrator session not detected. </strong> <br> Firebase did not provide a signed-in administrator to this page. <br><br> <button onclick="window.location.href='admin.html'" style=" border:none; background:#0757c9; color:white; padding:10px 15px; border-radius:8px; font-weight:bold; cursor:pointer; " > Return to Admin </button> `; return; } if( user.uid !== ADMIN_UID ){ authBox.innerHTML = ` <strong> ❌ Access Denied </strong> <br> Signed-in account is not the authorized administrator. `; return; } authBox.innerHTML = ` <strong> ✅ Administrator verified </strong> <br> Loading unmarked Firebase records... `; await loadActualFunds(); setTimeout( () => { authBox.classList.add( "hidden" ); }, 1000 ); } ); </script> </body> </html>
