<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#0757c9">

<title>SkyRent - GCash Payment</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;

  background:
    linear-gradient(
      180deg,
      #0757c9 0%,
      #1686e8 45%,
      #eef7ff 100%
    );

  color:#222;
}

.page{
  width:100%;
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 35px;
}

.header{
  text-align:center;
  color:white;
  padding:10px 0 22px;
}

.logo{
  width:76px;
  height:76px;
  object-fit:contain;
  background:white;
  padding:8px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.header h1{
  margin:10px 0 4px;
  font-size:27px;
}

.header p{
  margin:0;
  font-size:14px;
  opacity:.92;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px 18px;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.title{
  text-align:center;
  color:#0757c9;
  margin:0;
  font-size:22px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin:7px 0 22px;
}

.label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
  color:#333;
}

/* PAYMENT ACCOUNT */

.account-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:22px;
}

.account-option{
  position:relative;
}

.account-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.account-label{
  display:block;
  padding:16px 8px;
  text-align:center;
  border:2px solid #dce9f7;
  border-radius:15px;
  background:#f8fbff;
  color:#0757c9;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.account-option input:checked + .account-label{
  border-color:#0757c9;
  background:#eaf4ff;
  box-shadow:0 4px 12px rgba(7,87,201,.12);
}

.account-check{
  display:block;
  margin-top:5px;
  font-size:11px;
  font-weight:600;
  color:#777;
}

/* AMOUNT */

.amount-wrapper{
  position:relative;
  margin-bottom:15px;
}

.peso{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:21px;
  font-weight:800;
  color:#0757c9;
}

#amount{
  width:100%;
  height:57px;
  border:2px solid #dce9f7;
  border-radius:15px;
  outline:none;
  padding:0 15px 0 42px;
  font-size:21px;
  font-weight:700;
  color:#222;
  background:#f8fbff;
}

#amount:focus{
  border-color:#1686e8;
  background:white;
}

/* QUICK AMOUNTS */

.quick-title{
  font-size:13px;
  font-weight:700;
  color:#666;
  margin:5px 0 9px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:22px;
}

.quick button{
  border:1px solid #d5e5f7;
  background:#f3f8ff;
  color:#0757c9;
  border-radius:11px;
  padding:10px 4px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
}

.quick button:active{
  transform:scale(.97);
}

/* PAY BUTTON */

.pay-button{
  width:100%;
  height:58px;
  border:0;
  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #007cff,
      #0757c9
    );

  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;

  box-shadow:
    0 8px 20px rgba(7,87,201,.28);
}

.pay-button:active{
  transform:scale(.98);
}

.pay-button:disabled{
  opacity:.65;
}

/* STATUS */

.status{
  display:none;
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  font-size:13px;
  line-height:1.5;
  text-align:center;
}

.status.show{
  display:block;
}

.status.info{
  background:#eef6ff;
  color:#0757c9;
}

.status.warning{
  background:#fff7e6;
  color:#8a5b00;
}

.status.success{
  background:#eaf9f0;
  color:#17723c;
}

/* INSTRUCTIONS */

.info-box{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#f3f8ff;
  color:#5b6b7c;
  font-size:12px;
  line-height:1.55;
  text-align:center;
}

.back{
  display:block;
  text-align:center;
  color:white;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  margin-top:20px;
}

</style>
</head>

<body>

<div class="page">

  <div class="header">

    <img
      src="skyrent-logo.png"
      class="logo"
      alt="SkyRent"
    >

    <h1>SkyRent</h1>

    <p>GCash Payment</p>

  </div>


  <div class="card">

    <h2 class="title">
      Make Payment
    </h2>

    <p class="subtitle">
      Select a receiving account and enter
      the amount you want to pay.
    </p>


    <!-- RECEIVING ACCOUNT -->

    <label class="label">
      Receiving Account
    </label>

    <div class="account-options">

      <div class="account-option">

        <input
          type="radio"
          id="payment1"
          name="paymentAccount"
          value="payment1"
          checked
        >

        <label
          class="account-label"
          for="payment1"
        >
          Payment 1

          <span class="account-check">
            GCash
          </span>
        </label>

      </div>


      <div class="account-option">

        <input
          type="radio"
          id="payment2"
          name="paymentAccount"
          value="payment2"
        >

        <label
          class="account-label"
          for="payment2"
        >
          Payment 2

          <span class="account-check">
            GCash
          </span>
        </label>

      </div>

    </div>


    <!-- AMOUNT -->

    <label
      class="label"
      for="amount"
    >
      Payment Amount
    </label>

    <div class="amount-wrapper">

      <span class="peso">
        ₱
      </span>

      <input
        type="number"
        id="amount"
        inputmode="decimal"
        min="1"
        step="0.01"
        placeholder="Enter amount"
      >

    </div>


    <!-- QUICK AMOUNTS -->

    <div class="quick-title">
      Quick Amount
    </div>

    <div class="quick">

      <button onclick="setAmount(500)">
        ₱500
      </button>

      <button onclick="setAmount(800)">
        ₱800
      </button>

      <button onclick="setAmount(1500)">
        ₱1,500
      </button>

      <button onclick="setAmount(3000)">
        ₱3,000
      </button>

      <button onclick="setAmount(5000)">
        ₱5,000
      </button>

      <button onclick="setAmount(10000)">
        ₱10,000
      </button>

    </div>


    <!-- PAY -->

    <button
      class="pay-button"
      id="payButton"
      onclick="payWithGCash()"
    >
      Pay with GCash
    </button>


    <div
      class="status"
      id="status"
    ></div>


    <div class="info-box">

      <strong>Payment Information</strong>
      <br><br>

      Your selected receiving account is kept
      internally by SkyRent. The GCash account
      number is not displayed on this page.

    </div>

  </div>


  <a
    href="javascript:history.back()"
    class="back"
  >
    ← Back
  </a>

</div>


<script>

/*
====================================================
SKYRENT PAYMENT ACCOUNT CONFIGURATION
====================================================

The actual account numbers are kept here for the
payment logic and are NOT displayed in the interface.

Payment 1:
09507177497

Payment 2:
09304087163
====================================================
*/

const PAYMENT_ACCOUNTS = {

  payment1: {
    name: "Payment 1",
    account: "09507177497"
  },

  payment2: {
    name: "Payment 2",
    account: "09304087163"
  }

};


/*
====================================================
SET AMOUNT
====================================================
*/

function setAmount(value){

  document.getElementById("amount").value = value;

}


/*
====================================================
STATUS
====================================================
*/

function showStatus(message, type){

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status show " + type;

}


/*
====================================================
PAY WITH GCASH
====================================================
*/

function payWithGCash(){

  const amountInput =
    document.getElementById("amount");

  const amount =
    parseFloat(amountInput.value);


  if(!amount || amount <= 0){

    showStatus(
      "Please enter a valid payment amount.",
      "warning"
    );

    amountInput.focus();

    return;
  }


  const selected =
    document.querySelector(
      'input[name="paymentAccount"]:checked'
    );


  if(!selected){

    showStatus(
      "Please select a receiving account.",
      "warning"
    );

    return;
  }


  const paymentKey =
    selected.value;


  const account =
    PAYMENT_ACCOUNTS[paymentKey];


  if(!account){

    showStatus(
      "Payment account could not be found.",
      "warning"
    );

    return;
  }


  /*
  Store the payment information temporarily.

  This allows the next page/payment flow to know
  which SkyRent payment account was selected and
  what amount the user entered.
  */

  sessionStorage.setItem(
    "skyrentPaymentAccount",
    paymentKey
  );

  sessionStorage.setItem(
    "skyrentPaymentAmount",
    String(amount)
  );


  /*
  IMPORTANT:

  A generic gcash:// URL cannot reliably tell GCash
  which recipient and amount to use.

  Therefore we attempt to open GCash, while keeping
  the selected payment information available.

  When you provide the official GCash payment/QR
  links, this section can be changed to launch the
  correct payment flow for Payment 1 or Payment 2.
  */


  showStatus(
    "Opening GCash for your ₱" +
    amount.toLocaleString("en-PH") +
    " payment using " +
    account.name +
    "...",
    "info"
  );


  const payButton =
    document.getElementById("payButton");

  payButton.disabled = true;

  payButton.textContent =
    "Opening GCash...";


  /*
  Attempt to open GCash.
  */

  window.location.href = "gcash://";


  /*
  Restore the button if the browser does not
  leave this page.
  */

  setTimeout(function(){

    payButton.disabled = false;

    payButton.textContent =
      "Pay with GCash";


    showStatus(
      "If GCash did not open, the GCash app may not be installed or this browser may not support app links.",
      "warning"
    );

  }, 2500);

}


/*
Clear status when amount changes.
*/

document
  .getElementById("amount")
  .addEventListener("input", function(){

    document
      .getElementById("status")
      .className = "status";

  });

</script>

</body>
</html>
