<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent GCash Payment</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:Arial;
    background:linear-gradient(135deg,#0757c9,#35a4ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.card{

    background:white;
    width:92%;
    max-width:400px;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);

}


.logo{

    width:80px;
    display:block;
    margin:auto;

}


h2{

    text-align:center;
    color:#0757c9;
    margin:15px 0;

}


label{

    font-size:13px;
    font-weight:bold;

}


input{

    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #ddd;
    margin:10px 0 15px;
    font-size:18px;

}


.info{

    background:#eef6ff;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;

}


.info p{

    margin:5px 0;
    font-size:14px;

}


button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#0757c9;
    color:white;
    font-size:16px;
    font-weight:bold;

}


button:active{

    transform:scale(.97);

}


</style>

</head>


<body>


<div class="card">


<img src="/skyrent.png" class="logo">


<h2>
SkyRent GCash Payment
</h2>



<label>
Enter Deposit Amount
</label>


<input 
type="number"
id="amount"
placeholder="Example: 500">



<div class="info">

<p>
<strong>Receiver:</strong>
SkyRent GCash
</p>


<p>
<strong>GCash Number:</strong>
09123456789
</p>


<p>
<strong>Payment Amount:</strong>
₱<span id="displayAmount">0</span>
</p>


</div>



<button onclick="payGCash()">

Open GCash Payment

</button>


</div>



<script>


const amountInput =
document.getElementById("amount");


const displayAmount =
document.getElementById("displayAmount");



amountInput.addEventListener(
"input",
function(){

displayAmount.innerText =
Number(this.value || 0)
.toLocaleString("en-PH");

}

);



function payGCash(){


const amount =
Number(amountInput.value);



if(amount < 500){

alert(
"Minimum deposit is ₱500"
);

return;

}


// Your GCash number
const gcashNumber =
"09507177497";


// Try opening GCash
window.location.href =
"gcash://send?recipient="
+gcashNumber
+"&amount="
+amount;



// fallback

setTimeout(function(){

alert(
"Please open GCash manually and send ₱"
+amount
+" to "
+gcashNumber
);

},2000);



}



</script>


</body>

</html>
