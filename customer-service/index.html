<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRent - Official Links</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:linear-gradient(180deg,#0757c9 0%,#0b73e8 45%,#eef6ff 45%,#eef6ff 100%);
    color:#172033;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:35px 20px;
}

/* HEADER */

.header{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    margin-bottom:12px;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,.18));
}

.header h1{
    font-size:26px;
    font-weight:800;
    margin-bottom:7px;
}

.header p{
    font-size:14px;
    opacity:.92;
}

/* CARD */

.links-card{
    background:white;
    border-radius:22px;
    padding:22px 18px;
    box-shadow:0 12px 30px rgba(0,45,110,.14);
}

/* LINK BUTTON */

.link{
    display:flex;
    align-items:center;
    text-decoration:none;
    color:#172033;
    background:#f5f9ff;
    border:1px solid #e2ecfa;
    border-radius:16px;
    padding:15px 14px;
    margin-bottom:14px;
    transition:.2s ease;
}

.link:last-child{
    margin-bottom:0;
}

.link:not(.disabled):active{
    transform:scale(.98);
}

.icon{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-right:13px;
    font-size:23px;
}

.telegram{
    background:#e8f5ff;
}

.service{
    background:#eef2f7;
}

.link-info{
    flex:1;
    min-width:0;
}

.link-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
}

.link-description{
    font-size:12px;
    color:#718096;
}

.arrow{
    font-size:22px;
    color:#0757c9;
    margin-left:8px;
}

.disabled{
    cursor:default;
    opacity:.72;
}

.disabled .arrow{
    color:#94a3b8;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:25px;
    font-size:12px;
    color:#7890aa;
}

.footer strong{
    color:#0757c9;
}

/* DESKTOP */

@media(min-width:600px){
    .container{
        padding-top:55px;
    }
}
</style>

</head>

<body>

<div class="container">


<div class="header">

    <!-- Make sure skyrent-logo.png is in the same folder -->
    <img
        src="skyrent-logo.png"
        alt="SkyRent Logo"
        class="logo"
    >

    <h1>SkyRent Official Links</h1>

    <p>Stay connected with the official SkyRent community.</p>

</div>


<div class="links-card">

    <!-- OFFICIAL GROUP -->

    <a
        href="https://t.me/+hOfhGyuqvTRlNmZl"
        target="_blank"
        rel="noopener noreferrer"
        class="link"
    >

        <div class="icon telegram">
            ✈️
        </div>

        <div class="link-info">
            <div class="link-title">
                SkyRent Official Group
            </div>

            <div class="link-description">
                Join the official SkyRent community
            </div>
        </div>

        <div class="arrow">
            ›
        </div>

    </a>


    <!-- OFFICIAL CHANNEL -->

    <a
        href="https://t.me/+WAPJusE7dqdlYzA1"
        target="_blank"
        rel="noopener noreferrer"
        class="link"
    >

        <div class="icon telegram">
            📢
        </div>

        <div class="link-info">
            <div class="link-title">
                SkyRent Official Channel
            </div>

            <div class="link-description">
                Get official SkyRent announcements
            </div>
        </div>

        <div class="arrow">
            ›
        </div>

    </a>


    <!-- CUSTOMER SERVICE -->
<div class="link disabled">

        <div class="icon service">
            💬
        </div>

        <div class="link-info">
            <div class="link-title">
                Customer Service
            </div>

            <div class="link-description">
                Customer service link coming soon
            </div>
        </div>

        <div class="arrow">
            ›
        </div>

    </div>

</div>

<div class="footer">
    <strong>SkyRent</strong><br>
    Invest, earn, save, fly.
</div>


</div>

</body>
</html>
