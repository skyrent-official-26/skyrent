/* =====================================================
   NUMBER HELPERS
===================================================== */

function getNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return 0;
    }

    if(typeof value === "number"){
        return Number.isFinite(value)
            ? value
            : 0;
    }

    const cleaned =
        String(value)
        .replace(/[₱,\s]/g,"");

    const number =
        Number(cleaned);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(value){

    return "₱" +
        getNumber(value)
        .toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "—";
    }

    try{

        let date;

        if(
            value &&
            typeof value.toDate === "function"
        ){

            date =
                value.toDate();

        }
        else if(
            value instanceof Date
        ){

            date =
                value;

        }
        else if(
            typeof value === "number"
        ){

            date =
                new Date(value);

        }
        else{

            date =
                new Date(value);

        }

        if(
            !date ||
            Number.isNaN(date.getTime())
        ){
            return "—";
        }

        return date.toLocaleString(
            "en-PH",
            {
                year:"numeric",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "—";

    }

}

function getPlanId(data){

    if(!data){
        return "";
    }

    let plan =
        data.planId ??
        data.plan ??
        data.planName ??
        data.aircraft ??
        data.aircraftName ??
        "";

    plan =
        String(plan)
        .trim()
        .toUpperCase();

    if(plan.includes("AC1")){
        return "AC1";
    }

    if(plan.includes("AC2")){
        return "AC2";
    }

    if(
        plan.includes("AC3") ||
        plan.includes("ACT3")
    ){
        return "AC3";
    }

    if(plan.includes("AC4")){
        return "AC4";
    }

    if(plan.includes("AC5")){
        return "AC5";
    }

    if(plan.includes("AC6")){
        return "AC6";
    }

    if(plan.includes("AC7")){
        return "AC7";
    }

    if(plan.includes("AC8")){
        return "AC8";
    }

    if(plan.includes("AC9")){
        return "AC9";
    }

    return plan;

}

   USER ID
===================================================== */

function getInvestmentUserId(data){

    if(!data){
        return "";
    }

    return String(
        data.userId ??
        data.uid ??
        data.userUID ??
        data.userUid ??
        ""
    );

}


/* =====================================================
   USER PHONE
===================================================== */

function getUserPhone(user){

    if(!user){
        return "—";
    }

    return String(
        user.phone ??
        user.phoneNumber ??
        user.mobile ??
        "—"
    );

}


/* =====================================================
   USER NAME
===================================================== */

function getUserName(user){

    if(!user){
        return "Unknown User";
    }

    return String(
        user.name ??
        user.fullName ??
        user.displayName ??
        "Unknown User"
    );

}


/* =====================================================
   INVESTMENT AMOUNT
===================================================== */

function getInvestmentAmount(data){

    if(!data){
        return 0;
    }

    const possible = [

        data.amount,

        data.investmentAmount,

        data.planAmount,

        data.depositAmount,

        data.price

    ];

    for(const value of possible){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return getNumber(value);

        }

    }

    const planId =
        getPlanId(data);

    if(PLAN_DATA[planId]){
        return PLAN_DATA[planId].amount;
    }

    return 0;

}


/* =====================================================
   TOTAL REVENUE
   This is expected/recorded plan revenue,
   NOT collected earnings.
===================================================== */

function getInvestmentRevenue(data){

    if(!data){
        return 0;
    }

    const possible = [

        data.totalRevenue,

        data.expectedRevenue,

        data.totalIncome,

        data.expectedIncome,

        data.revenue,

        data.income

    ];

    for(const value of possible){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return getNumber(value);

        }

    }

    const planId =
        getPlanId(data);

    if(PLAN_DATA[planId]){

        return PLAN_DATA[planId].total;

    }

    return 0;

}


/* =====================================================
   EARNINGS COLLECTED
   IMPORTANT:
   Does NOT fall back to plan revenue.
===================================================== */

function getCollectedEarnings(data){

    if(!data){
        return 0;
    }

    const possible = [

        data.claimedTotal,

        data.collectedEarnings,

        data.earningsCollected,

        data.totalCollected,

        data.totalEarningsCollected,

        data.totalCollectedEarnings,

        data.collectedIncome,

        data.incomeCollected,

        data.claimedEarnings,

        data.earnedAmount,

        data.collectedAmount

    ];

    for(const value of possible){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return getNumber(value);

        }

    }

    return 0;

}


/* =====================================================
   DAILY EARNING
===================================================== */

function getDailyEarning(data){

    if(!data){
        return 0;
    }

    const possible = [

        data.dailyEarning,

        data.dailyEarnings,

        data.dailyIncome,

        data.dailyProfit

    ];

    for(const value of possible){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return getNumber(value);

        }

    }

    const planId =
        getPlanId(data);

    if(PLAN_DATA[planId]){
        return PLAN_DATA[planId].daily;
    }

    return 0;

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(data){

    if(!data){
        return "unknown";
    }

    let status =
        data.status ??
        data.investmentStatus ??
        "";

    status =
        String(status)
        .trim()
        .toLowerCase();

    if(!status){

        if(
            data.completed === true ||
            data.isCompleted === true
        ){

            return "completed";

        }

        if(
            data.active === true ||
            data.isActive === true
        ){

            return "active";

        }

    }

    return status || "unknown";

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const normalized =
        String(status)
        .toLowerCase();

    if(
        normalized === "active" ||
        normalized === "in progress" ||
        normalized === "in_progress"
    ){
        return "status-active";
    }

    if(
        normalized === "completed" ||
        normalized === "complete"
    ){
        return "status-completed";
    }

    if(
        normalized === "pending"
    ){
        return "status-pending";
    }

    return "status-other";

}


/* =====================================================
   CREATED DATE
===================================================== */

function getCreatedDate(data){

    if(!data){
        return null;
    }

    return (
        data.createdAt ??
        data.createdDate ??
        data.date ??
        data.timestamp ??
        data.purchaseDate ??
        null
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PLAN SUMMARY
===================================================== */

function renderPlanSummary(){

    const container =
        document.getElementById("planSummary");

    if(!container){
        return;
    }

    container.innerHTML = "";

    Object.keys(PLAN_DATA)
    .forEach(planId => {

        const plan =
            PLAN_DATA[planId];

        const records =
            allInvestments.filter(
                investment =>
                    getPlanId(investment) === planId
            );

        let invested = 0;
        let collected = 0;

        records.forEach(investment => {

            invested +=
                getInvestmentAmount(investment);

            collected +=

            document.createElement("div");

        card.innerHTML = `

/* =====================================================
   UPDATE MAIN SUMMARY
===================================================== */

function updateSummary(){

    let totalInvestments = 0;

    let totalRevenue = 0;

    let totalActiveInvestment = 0;

    let totalEarningsCollected = 0;


    allInvestments.forEach(data => {

        const amount =
            getInvestmentAmount(data);

        const revenue =
            getInvestmentRevenue(data);

        const collected =
            getCollectedEarnings(data);

        const status =
            getStatus(data);


        totalInvestments +=
            amount;

        totalRevenue +=
            revenue;

        totalEarningsCollected +=
            collected;


        const normalized =
            String(status)
            .toLowerCase()
            .trim();


        if(
            normalized === "active" ||
            normalized === "in progress" ||
            normalized === "in_progress"
        ){

            totalActiveInvestment +=
                amount;

        }

    });


    document.getElementById(
        "totalInvestments"
    ).textContent =
        formatMoney(totalInvestments);


    document.getElementById(
        "totalRevenue"
    ).textContent =
        formatMoney(totalRevenue);


    document.getElementById(
        "totalActiveInvestment"
    ).textContent =
        formatMoney(totalActiveInvestment);


    document.getElementById(
        "totalEarningsCollected"
    ).textContent =
        formatMoney(totalEarningsCollected);

}


/* =====================================================
   FILTER INVESTMENTS
===================================================== */

function getFilteredInvestments(){

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    return allInvestments.filter(data => {

        const userId =
            getInvestmentUserId(data);

        const user =
            userMap[userId] || {};

        const name =
            getUserName(user)
            .toLowerCase();

        const phone =
            getUserPhone(user)
            .toLowerCase();

        const plan =
            getPlanId(data)
            .toLowerCase();

        const status =
            getStatus(data)
            .toLowerCase();


        const matchesSearch =
            !search ||
            name.includes(search) ||
            phone.includes(search) ||
            plan.includes(search);


        let matchesFilter = true;


        if(currentFilter === "active"){

            matchesFilter =
                status === "active" ||
                status === "in progress" ||
                status === "in_progress";

        }
        else if(currentFilter === "completed"){

            matchesFilter =
                status === "completed" ||
                status === "complete";

        }
        else if(
            currentFilter.startsWith("AC")
        ){

            matchesFilter =
                plan.toUpperCase() ===
                currentFilter.toUpperCase();

        }


        return (
            matchesSearch &&
            matchesFilter
        );

    });

}

/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


    allUsers = [];

    userMap = {};


    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data();

            const user = {

                id:
                    documentSnapshot.id,

                ...data

            };


            allUsers.push(
                user
            );


            userMap[
                documentSnapshot.id
            ] =
                user;

        }
    );

}


/* =====================================================
   LOAD INVESTMENTS
===================================================== */

async function loadInvestments(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "investments"
            )
        );


    allInvestments = [];


    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data();


            allInvestments.push({

                id:
                    documentSnapshot.id,

                ...data

            });

        }
    );


    /*
       Newest investments first
    */

    allInvestments.sort(
        (a,b) => {

            const dateA =
                getCreatedDate(a);

            const dateB =
                getCreatedDate(b);


            if(
                dateA &&
                dateB &&
                typeof dateA.toMillis === "function" &&
                typeof dateB.toMillis === "function"
            ){

                return (
                    dateB.toMillis() -
                    dateA.toMillis()
                );

            }


            const timeA =
                dateA
                ? new Date(dateA).getTime()
                : 0;

            const timeB =
                dateB
                ? new Date(dateB).getTime()
                : 0;


            return timeB - timeA;

        }
    );

}

        );

    }

}

===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            updateAdminLoading(
                "No admin session found",
                "Please login first."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                700
            );

            return;

        }


        currentAdmin =
            user;


        updateAdminLoading(
            "Administrator account found",
            "Checking admin permissions..."
        );


        if(
            user.uid !== ADMIN_UID
        ){

            updateAdminLoading(
                "Access denied",
                "This Firebase account is not an administrator."
            );


            alert(
                "❌ Access denied. This account is not an administrator."
            );


            return;

        }


        await loadInvestmentPage();

    }
);
